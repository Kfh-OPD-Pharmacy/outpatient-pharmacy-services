<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إدارة الأدوية الموحدة</title>

<style>
*{box-sizing:border-box}

body{
  font-family:Arial,sans-serif;
  background:#f3f4f6;
  margin:0;
  padding:16px;
  color:#168fb3
}

.container{
  max-width:980px;
  margin:auto;
  background:#fff;
  padding:22px;
  border-radius:14px;
  box-shadow:0 10px 25px rgba(0,0,0,.1);
  min-height:calc(100vh - 32px)
}

.top-bar{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
  margin-bottom:8px;
  direction:ltr
}

.logo{
  width:120px;
  height:120px;
  object-fit:contain
}

.official-header{
  width:fit-content;
  max-width:100%;
  text-align:right;
  transform:translateY(14px);
  padding-left:8px;
  border-left:4px solid #168fb3;
  direction:rtl
}

.official-header h2,
.official-header h3{
  margin:2px 0;
  font-size:13px;
  line-height:1.4;
  color:#168fb3
}

hr{
  border:none;
  border-top:1px solid #e5e7eb;
  margin:14px 0
}

.meta-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:14px;
  direction:ltr
}

.date-box,
.language-chip{
  color:#168fb3;
  padding:4px 0;
  font-size:13px;
  font-weight:bold;
  background:transparent;
  border:0;
  font-family:inherit
}

.language-chip{
  cursor:pointer;
  white-space:nowrap
}

.title-row{
  display:grid;
  grid-template-columns:36px auto 36px;
  align-items:center;
  justify-content:center;
  gap:10px;
  margin:18px 0 8px
}

.page-title{
  text-align:center;
  font-size:24px;
  font-weight:bold;
  margin:0;
  color:#168fb3;
  grid-column:2
}

.title-back-button{
  grid-column:1;
  width:34px;
  height:34px;
  border:0;
  background:transparent;
  color:#168fb3;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0;
  text-decoration:none;
  font-size:28px;
  line-height:1
}

.title-back-button:hover{
  color:#0f7592;
  transform:translateX(-1px)
}

.subtitle{
  text-align:center;
  color:#334155;
  font-size:15px;
  line-height:1.7;
  margin:0 auto 18px;
  max-width:620px
}

.login-card,
.panel{
  max-width:760px;
  margin:18px auto 0;
  background:#f9fafb;
  border:1px solid #e5e7eb;
  border-radius:8px;
  padding:16px
}

.login-card{
  max-width:360px
}

label{
  display:block;
  margin:0 0 5px;
  font-size:14px;
  font-weight:bold;
  color:#168fb3
}

input,
select{
  width:100%;
  height:38px;
  padding:8px 10px;
  margin-bottom:12px;
  border:1px solid #cbd5e1;
  border-radius:8px;
  font-size:14px;
  background:#fff
}

.form-grid{
  display:grid;
  grid-template-columns:2fr 1fr auto;
  gap:10px;
  align-items:end
}

.actions{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap
}

.primary-btn,
.secondary-btn,
.danger-btn{
  height:38px;
  padding:0 16px;
  border:0;
  border-radius:8px;
  font-weight:bold;
  font-size:14px;
  cursor:pointer;
  white-space:nowrap
}

.primary-btn{
  background:#168fb3;
  color:#fff
}

.secondary-btn{
  background:#e0f2fe;
  color:#168fb3
}

.danger-btn{
  background:#fee2e2;
  color:#b91c1c
}

.primary-btn:hover{
  background:#0f7592
}

#loginResult,
#result{
  min-height:22px;
  text-align:center;
  margin-top:10px;
  font-size:13px;
  font-weight:bold
}

.error{
  color:#b91c1c
}

.success{
  color:#047857
}


/* =========================================
   ADMIN NAME + LOGOUT
========================================= */

.admin-strip{
  display:none;
  align-items:center;
  justify-content:center;
  gap:10px;
  margin:10px auto 18px;
  color:#168fb3;
  direction:ltr
}

.admin-name{
  text-align:center;
  font-size:24px;
  font-weight:bold;
  white-space:nowrap
}

.logout-btn{
  width:34px;
  height:34px;
  border:0;
  background:transparent;
  color:#168fb3;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0;
  cursor:pointer;
  flex:0 0 auto
}

.power-svg{
  width:25px;
  height:25px;
  stroke:currentColor;
  stroke-width:2.3;
  fill:none;
  stroke-linecap:round;
  stroke-linejoin:round
}

.tools{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:10px
}

.search{
  max-width:260px;
  margin:0
}

.table-wrap{
  overflow-x:auto;
  border:1px solid #e5e7eb;
  border-radius:8px;
  background:#fff
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:620px
}

th{
  background:#168fb3;
  color:#fff;
  font-size:13px;
  padding:10px;
  text-align:center
}

td{
  font-size:13px;
  padding:9px;
  border-bottom:1px solid #e5e7eb;
  text-align:center;
  color:#334155
}

td:first-child{
  text-align:start;
  color:#036987;
  font-weight:bold
}

.row-actions{
  display:flex;
  gap:6px;
  justify-content:center
}

.icon-btn{
  width:32px;
  height:32px;
  border:0;
  border-radius:8px;
  background:#e0f2fe;
  color:#168fb3;
  cursor:pointer;
  font-size:16px
}

.icon-btn.danger{
  background:#fee2e2;
  color:#b91c1c
}

.status-pill{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:54px;
  border-radius:999px;
  padding:4px 8px;
  font-size:12px;
  font-weight:bold
}

.status-pill.active{
  background:#dcfce7;
  color:#166534
}

.status-pill.inactive{
  background:#fee2e2;
  color:#991b1b
}

@media (max-width:700px){

  body{
    padding:10px;
    background:#fff
  }

  .container{
    padding:14px;
    border-radius:0;
    box-shadow:none;
    min-height:100vh
  }

  .logo{
    width:84px;
    height:84px
  }

  .official-header{
    transform:translateY(10px)
  }

  .official-header h2,
  .official-header h3{
    font-size:12px
  }

  .page-title{
    font-size:20px
  }

  .title-row{
    grid-template-columns:34px auto 34px
  }

  .title-back-button{
    width:32px;
    height:32px;
    font-size:26px
  }

  .subtitle{
    font-size:13px
  }

  .login-card,
  .panel{
    max-width:100%;
    padding:14px
  }

  .form-grid{
    grid-template-columns:1fr
  }

  .admin-name{
    font-size:22px
  }

  th,
  td{
    font-size:12px;
    padding:8px
  }

}

/* PHASE B: unified login UI only */
#loginCard.login-card{
  width:min(100%, 360px);
  max-width:360px;
  margin:18px auto 0;
  padding:18px;
  background:#f9fafb;
  border:1px solid #e5e7eb;
  border-radius:10px;
  box-shadow:0 12px 28px rgba(15,23,42,.08)
}
#loginCard.login-card label{
  margin:0 0 6px;
  color:#168fb3;
  font-size:14px;
  line-height:1.35
}
#loginCard.login-card input{
  height:40px;
  padding:8px 10px;
  margin:0 0 12px;
  border:1px solid #cbd5e1;
  border-radius:8px;
  background:#fff;
  color:#111827;
  font-size:14px;
  font-family:inherit
}
#loginCard.login-card input:focus{
  border-color:#168fb3;
  outline:3px solid rgba(22,143,179,.12)
}
#loginCard .actions{
  gap:10px;
  margin-top:4px
}
#loginCard #loginBtn{
  min-width:120px;
  height:40px;
  border-radius:10px;
  font-size:14px
}
#loginCard #loginBtn:disabled{
  background:#94a3b8;
  color:#fff;
  cursor:not-allowed;
  opacity:.85
}
#loginResult{
  margin-top:12px;
  padding:10px 12px;
  border-radius:8px;
  font-size:13px;
  line-height:1.5
}
@media (max-width:700px){
  #loginCard.login-card{
    width:min(100%, 320px);
    padding:16px;
    margin-top:16px
  }
  #loginCard #loginBtn{
    width:100%;
    min-width:0
  }
}

/* PHASE B-FIX: exact unified visual tokens only */
.container{
  max-width:980px;
  background:#fff;
  padding:22px;
  border-radius:14px;
  box-shadow:0 10px 25px rgba(0,0,0,.1)
}
.page-title{
  font-size:23px;
  font-weight:bold;
  margin:18px 0 12px
}
#loginCard.login-card{
  width:100%;
  max-width:420px;
  padding:22px;
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:14px;
  box-shadow:0 8px 20px rgba(0,0,0,.08)
}
#loginCard.login-card input{
  width:100%;
  height:44px;
  padding:8px 12px;
  border:1px solid #cbd5e1;
  border-radius:8px;
  font-size:14px;
  font-family:inherit;
  outline:none;
  box-sizing:border-box
}
#loginCard.login-card input:focus{
  border-color:#168fb3;
  box-shadow:0 0 0 2px rgba(22,143,179,.12);
  outline:none
}
#loginCard #loginBtn{
  height:44px;
  min-height:44px;
  border-radius:8px;
  font-size:14px;
  font-weight:bold
}
@media (max-width:700px){
  .container{
    padding:14px;
    border-radius:0;
    box-shadow:none
  }
  #loginCard.login-card{
    max-width:420px;
    padding:22px
  }
}


/* PHASE C: unified portal design system */
@media screen{
  body{
    background:#f3f4f6;
  }

  .container,
  .employee-shell{
    max-width:980px;
    margin:auto;
    background:#fff;
    padding:22px;
    border-radius:14px;
    box-shadow:0 10px 25px rgba(0,0,0,.1);
  }

  .logo,
  .official-logo{
    width:120px;
    height:120px;
    object-fit:contain;
  }

  .official-header h2,
  .official-header h3{
    margin:2px 0;
    color:#168fb3;
    font-size:13px;
    line-height:1.4;
  }

  hr,
  .official-divider{
    border-top-color:#e5e7eb;
    margin:14px 0;
  }

  .page-title,
  .employee-page-title{
    color:#168fb3;
    font-size:23px;
    font-weight:bold;
    line-height:1.25;
    margin:18px 0 12px;
    text-align:center;
  }

  .title-row{
    margin:18px 0 12px;
  }

  .panel,
  .toolbar,
  .empty-box,
  .order-panel,
  .size-row,
  .result-card,
  .upload-box,
  .users-form,
  .upload-standalone,
  .employee-toolbar,
  .upload-toolbar,
  .supervisor-panel,
  .user-summary-panel,
  .filter-panel,
  .filters-panel,
  .summary-card,
  .stat-card{
    background:#fff;
    border:1px solid #e5e7eb;
    border-radius:10px;
    box-shadow:0 4px 10px rgba(0,0,0,.04);
  }

  .portal-card,
  .service-card,
  .control-card,
  .pharmacy-card,
  .card-link{
    border-radius:10px;
    box-shadow:0 4px 10px rgba(0,0,0,.04);
  }

  input,
  select,
  textarea{
    min-height:40px;
    padding:8px 12px;
    border:1px solid #cbd5e1;
    border-radius:8px;
    font-size:14px;
    font-family:inherit;
    box-sizing:border-box;
  }

  input:focus,
  select:focus,
  textarea:focus{
    border-color:#168fb3;
    box-shadow:0 0 0 2px rgba(22,143,179,.12);
    outline:none;
  }

  .primary-btn,
  .secondary-btn,
  .action-btn,
  .ghost-btn,
  button[type="submit"]{
    min-height:40px;
    border-radius:8px;
    font-size:14px;
    font-weight:bold;
  }

  .actions,
  .form-actions,
  .login-actions,
  .card-actions,
  .row-actions,
  .scan-actions{
    gap:10px;
  }

  .table-wrap,
  .dashboard-table-wrap,
  .orders-table-wrap{
    overflow-x:auto;
    border-radius:10px;
  }

  table{
    border-collapse:collapse;
  }

  th{
    background:#168fb3;
    color:#fff;
    font-weight:bold;
  }

  th,
  td{
    border-color:#e5e7eb;
  }

  @media (max-width:700px){
    body{
      padding:10px;
      background:#fff;
    }

    .container,
    .employee-shell{
      padding:14px;
      border-radius:0;
      box-shadow:none;
    }

    .logo,
    .official-logo{
      width:84px;
      height:84px;
    }

    .official-header h2,
    .official-header h3{
      font-size:12px;
    }

    .page-title,
    .employee-page-title{
      font-size:20px;
      margin:16px 0 12px;
    }

    input,
    select,
    textarea{
      width:100%;
      font-size:13px;
    }
  }
}

<body>

</div>


<script>

const UNIFIED_API_URL =
  "https://script.google.com/macros/s/AKfycbzg9PCeoJQl0ifbng_aam6u5mTePD0872wqZ5ilZYqcFV9QypiyopulgPPyO3nqLpez/exec";


const MEDICATIONS_API_URL =
  "https://script.google.com/macros/s/AKfycbxtK-J87-gmKVXExW_kbVXBuYTxArtP5pnvnp3HJh2s_BL2nPQn8vPrwMX_bDUkp4uq/exec";


let currentLang =
  "ar";


let adminUsername =
  sessionStorage.getItem(
    "unifiedPortalUsername"
  ) || "";
let adminDisplayName = "";


let adminSessionToken =
  sessionStorage.getItem(
    "unifiedPortalSessionToken"
  ) || "";


let medications =
  [];


let editingId =
  "";


let sessionVerified = false;
let sessionGeneration = 0;


const text = {

  ar:{

    title:
      "إدارة الأدوية الموحدة",

    subtitle:
      "قاعدة مركزية لأسماء الأدوية المستخدمة في القوائم المنسدلة.",

    officialLine1:
      "تجمع المدينة المنورة الصحي",

    officialLine2:
      "مستشفى الملك فهد بالمدينة المنورة",

    officialLine3:
      "إدارة الرعاية الصيدلانية",

    username:
      "اسم المستخدم",

    pin:
      "PIN",

    login:
      "دخول",

    invalid:
      "بيانات الدخول غير صحيحة أو ليس لديك صلاحيات المستخدم الرئيسي.",

    medName:
      "اسم الدواء",

    service:
      "الخدمة",

    status:
      "الحالة",

    actions:
      "الإجراء",

    add:
      "إضافة",

    update:
      "تحديث",

    clear:
      "مسح",

    refresh:
      "تحديث",

    active:
      "فعال",

    inactive:
      "متوقف",

    saved:
      "تم الحفظ",

    deleted:
      "تم الحذف",

    missing:
      "اكتب اسم الدواء.",

    scriptMissing:
      "ضع رابط سكربت إدارة الأدوية أولًا.",

    failed:
      "تعذر تنفيذ العملية."

  },


  en:{

    title:
      "Unified Medication Management",

    subtitle:
      "Central medication database for dropdown lists.",

    officialLine1:
      "Madinah Health Cluster",

    officialLine2:
      "King Fahad Hospital - Madinah",

    officialLine3:
      "Pharmaceutical Care Administration",

    username:
      "Username",

    pin:
      "PIN",

    login:
      "Login",

    invalid:
      "Invalid login or main admin permission is required.",

    medName:
      "Medication Name",

    service:
      "Service",

    status:
      "Status",

    actions:
      "Action",

    add:
      "Add",

    update:
      "Update",

    clear:
      "Clear",

    refresh:
      "Refresh",

    active:
      "Active",

    inactive:
      "Inactive",

    saved:
      "Saved",

    deleted:
      "Deleted",

    missing:
      "Enter medication name.",

    scriptMissing:
      "Add the medication Apps Script URL first.",

    failed:
      "Operation failed."

  }

};



function setLanguage(
  lang
){

  currentLang =
    lang;


  document.documentElement.lang =
    lang;


  document.documentElement.dir =
    lang === "ar"
      ? "rtl"
      : "ltr";


  document.title =
    text[lang].title;


  [
    "officialLine1",
    "officialLine2",
    "officialLine3"
  ].forEach(
    function(id){

      document.getElementById(
        id
      ).innerText =
        text[lang][id];

    }
  );


  document.getElementById(
    "pageTitle"
  ).innerText =
    text[lang].title;


  document.getElementById(
    "subtitle"
  ).innerText =
    text[lang].subtitle;


  document.getElementById(
    "usernameLabel"
  ).innerText =
    text[lang].username;


  document.getElementById(
    "pinLabel"
  ).innerText =
    text[lang].pin;


  document.getElementById(
    "loginBtn"
  ).innerText =
    text[lang].login;


  document.getElementById(
    "medNameLabel"
  ).innerText =
    text[lang].medName;


  document.getElementById(
    "serviceLabel"
  ).innerText =
    text[lang].service;


  document.getElementById(
    "nameHeader"
  ).innerText =
    text[lang].medName;


  document.getElementById(
    "serviceHeader"
  ).innerText =
    text[lang].service;


  document.getElementById(
    "statusHeader"
  ).innerText =
    text[lang].status;


  document.getElementById(
    "actionsHeader"
  ).innerText =
    text[lang].actions;


  document.getElementById(
    "saveBtn"
  ).innerText =
    editingId
      ? text[lang].update
      : text[lang].add;


  document.getElementById(
    "clearBtn"
  ).innerText =
    text[lang].clear;


  document.getElementById(
    "refreshBtn"
  ).innerText =
    text[lang].refresh;


  renderDate();

  renderRows();

}



function toggleLanguage(){

  setLanguage(
    currentLang === "ar"
      ? "en"
      : "ar"
  );

}



function renderDate(){

  const now =
    new Date();


  const date =
    new Intl.DateTimeFormat(
      "en-CA",
      {
        timeZone:
          "Asia/Riyadh"
      }
    ).format(
      now
    );


  const day =
    new Intl.DateTimeFormat(
      currentLang === "ar"
        ? "ar-SA"
        : "en-US",
      {
        timeZone:
          "Asia/Riyadh",

        weekday:
          "long"
      }
    ).format(
      now
    );


  document.getElementById(
    "dateBox"
  ).innerText =
    `${day} - ${date}`;

}



function loginAdmin(){
  window.location.replace("index.html");
}



function showLoginError(){

  const el =
    document.getElementById(
      "loginResult"
    );


  el.className =
    "error";


  el.innerText =
    text[currentLang].invalid;

}



function showAdmin(){

  if (!sessionVerified) return;

  document.getElementById(
    "loginCard"
  ).style.display =
    "none";


  document.getElementById(
    "adminStrip"
  ).style.display =
    "flex";


  document.getElementById(
    "adminPanel"
  ).style.display =
    "block";


  document.getElementById(
    "adminName"
  ).innerText =
    adminDisplayName || "Admin";


  loadMedications();

}



function hideProtectedContent(){
  sessionVerified = false;
  document.getElementById("loginCard").style.display = "none";
  document.getElementById("adminStrip").style.display = "none";
  document.getElementById("adminPanel").style.display = "none";
  medications = [];
  document.getElementById("medicationsBody").innerHTML = "";
  clearForm();
  clearResult();
}

function clearPortalSession(){
  ["unifiedPortalUsername", "unifiedPortalSessionToken", "unifiedPortalUser"]
    .forEach(function(key){ sessionStorage.removeItem(key); });
  adminUsername = "";
  adminDisplayName = "";
  adminSessionToken = "";
}

function getSessionDisplayName(user){
  if (!user || typeof user !== "object") return "";
  return String(
    user.name ||
    user.fullName ||
    user.displayName ||
    user.employeeName ||
    ""
  ).trim();
}

function handleSessionFailure(code){
  sessionGeneration++;
  hideProtectedContent();
  if (code === "INVALID_SESSION" || code === "MISSING_SESSION"){
    clearPortalSession();
    window.location.replace("index.html");
  } else if (code === "NO_PERMISSION"){
    window.location.replace("control-panel.html");
  } else {
    const result = document.getElementById("loginResult");
    result.className = "error";
    result.innerText = text[currentLang].failed;
  }
}

function logoutAdmin(){
  const tokenToRevoke = adminSessionToken;
  sessionGeneration++;
  hideProtectedContent();
  clearPortalSession();
  if (tokenToRevoke){
    unifiedApi({
      action: "revokeSession",
      sessionToken: tokenToRevoke
    }).catch(function(){});
  }
  window.location.replace("index.html");
}



async function unifiedApi(
  payload
){

  const response =
    await fetch(
      UNIFIED_API_URL,
      {

        method:
          "POST",

        headers: {
          "Content-Type":
            "text/plain;charset=utf-8"
        },

        keepalive: payload.action === "revokeSession",

        body:
          JSON.stringify({

            sessionToken:
              payload.sessionToken ||
              adminSessionToken,

            ...payload

          })

      }
    );


  if (!response.ok) throw new Error("HTTP " + response.status);
  return response.json();

}



function medicationsApiReady(){

  return (
    MEDICATIONS_API_URL &&
    !MEDICATIONS_API_URL.includes(
      "PUT_CENTRAL_MEDICATIONS"
    )
  );

}



async function medicationsApi(
  payload
){
  const generation = sessionGeneration;
  if (!sessionVerified ||
      adminSessionToken !== sessionStorage.getItem("unifiedPortalSessionToken")){
    handleSessionFailure("AUTH_UNAVAILABLE");
    await validateExistingSession();
    throw new Error("Session requires validation");
  }


  if (
    !medicationsApiReady()
  ){

    throw new Error(
      "missing-url"
    );

  }


  const response =
    await fetch(
      MEDICATIONS_API_URL,
      {

        method:
          "POST",

        headers: {
          "Content-Type":
            "text/plain;charset=utf-8"
        },

        body:
          JSON.stringify({

            ...payload,

            sessionToken:
              adminSessionToken

          })

      }
    );


  if (!response.ok) throw new Error("HTTP " + response.status);
  const result = await response.json();
  if (generation !== sessionGeneration ||
      adminSessionToken !== sessionStorage.getItem("unifiedPortalSessionToken")){
    throw new Error("Stale session response");
  }
  if (["INVALID_SESSION", "MISSING_SESSION", "NO_PERMISSION",
       "AUTH_UNAVAILABLE", "NO_ADMIN_PERMISSION"].includes(result.code)){
    handleSessionFailure(result.code);
    throw new Error("Authorization failed");
  }
  return result;

}



async function validateExistingSession(){
  const generation = ++sessionGeneration;
  hideProtectedContent();
  const status = document.getElementById("loginResult");
  status.className = "";
  status.innerText = "";
  adminSessionToken = sessionStorage.getItem("unifiedPortalSessionToken") || "";
  if (!adminSessionToken){
    handleSessionFailure("MISSING_SESSION");
    return;
  }
  const token = adminSessionToken;
  try {
    const result = await unifiedApi({
      action: "validateSession",
      sessionToken: token,
      service: "medicationManagement"
    });
    if (generation !== sessionGeneration) return;
    if (token !== sessionStorage.getItem("unifiedPortalSessionToken")){
      await validateExistingSession();
      return;
    }
    if (!result.success){
      handleSessionFailure(result.code);
      return;
    }
    if (!result.user || !result.user.username){
      handleSessionFailure("AUTH_UNAVAILABLE");
      return;
    }
    if (result.user.medicationManagementAccess !== true){
      handleSessionFailure("NO_PERMISSION");
      return;
    }
    adminUsername = result.user.username;
    adminDisplayName = getSessionDisplayName(result.user);
    sessionStorage.setItem("unifiedPortalUsername", adminUsername);
    sessionStorage.setItem("unifiedPortalUser", JSON.stringify(result.user));
    sessionVerified = true;
    showAdmin();
  } catch (error){
    if (generation === sessionGeneration){
      handleSessionFailure("AUTH_UNAVAILABLE");
    }
  }
}



async function loadMedications(){

  clearResult();


  if (
    !medicationsApiReady()
  ){

    showResult(
      "error",
      text[currentLang].scriptMissing
    );

    return;

  }


  try{

    const result =
      await medicationsApi({
        action:
          "listMedications",
        includeInactive: true
      });


    if (
      !result.success
    ){

      showResult(
        "error",
        text[currentLang].failed
      );

      return;

    }


    medications =
      result.medications || [];


    renderRows();


  }catch(error){

    showResult(
      "error",
      text[currentLang].failed
    );

  }

}



async function saveMedication(){

  const name =
    document.getElementById(
      "medNameInput"
    ).value.trim();


  const service =
    document.getElementById(
      "serviceInput"
    ).value;


  if (
    !name
  ){

    showResult(
      "error",
      text[currentLang].missing
    );

    return;

  }


  try{

    const result =
      await medicationsApi({

        action:
          editingId
            ? "updateMedication"
            : "addMedication",

        id:
          editingId,

        medicationName:
          name,

        service:
          service,

        active:
          true

      });


    if (
      !result.success
    ){

      showResult(
        "error",
        text[currentLang].failed
      );

      return;

    }


    clearForm();


    showResult(
      "success",
      text[currentLang].saved
    );


    await loadMedications();


  }catch(error){

    showResult(
      "error",
      medicationsApiReady()
        ? text[currentLang].failed
        : text[currentLang].scriptMissing
    );

  }

}



function editMedication(
  id
){

  const item =
    medications.find(
      function(m){
        return m.id === id;
      }
    );


  if (
    !item
  ){

    return;

  }


  editingId =
    item.id;


  document.getElementById(
    "medNameInput"
  ).value =
    item.name;


  document.getElementById(
    "serviceInput"
  ).value =
    item.service || "kidney";


  document.getElementById(
    "saveBtn"
  ).innerText =
    text[currentLang].update;

}



async function toggleMedication(
  id
){

  const item =
    medications.find(
      function(m){
        return m.id === id;
      }
    );


  if (
    !item
  ){

    return;

  }


  try{

    const result =
      await medicationsApi({

        action:
          "updateMedication",

        id:
          item.id,

        medicationName:
          item.name,

        service:
          item.service,

        active:
          !item.active

      });


    if (
      !result.success
    ){

      showResult(
        "error",
        text[currentLang].failed
      );

      return;

    }


    await loadMedications();


  }catch(error){

    showResult(
      "error",
      text[currentLang].failed
    );

  }

}



async function deleteMedication(
  id
){

  if (
    !confirm(
      currentLang === "ar"
        ? "حذف الدواء؟"
        : "Delete medication?"
    )
  ){

    return;

  }


  try{

    const result =
      await medicationsApi({

        action:
          "deleteMedication",

        id:
          id

      });


    if (
      !result.success
    ){

      showResult(
        "error",
        text[currentLang].failed
      );

      return;

    }


    showResult(
      "success",
      text[currentLang].deleted
    );


    await loadMedications();


  }catch(error){

    showResult(
      "error",
      text[currentLang].failed
    );

  }

}



function clearForm(){

  editingId =
    "";


  document.getElementById(
    "medNameInput"
  ).value =
    "";


  document.getElementById(
    "serviceInput"
  ).value =
    "kidney";


  document.getElementById(
    "saveBtn"
  ).innerText =
    text[currentLang].add;

}



function renderRows(){

  const body =
    document.getElementById(
      "medicationsBody"
    );


  if (
    !body
  ){

    return;

  }


  const q =
    (
      document.getElementById(
        "searchInput"
      )?.value || ""
    )
      .trim()
      .toLowerCase();


  const rows =
    medications.filter(
      function(m){

        return (
          !q ||
          String(
            m.name || ""
          )
            .toLowerCase()
            .includes(
              q
            )
        );

      }
    );


  body.innerHTML =
    rows.map(
      function(item){

        return `
          <tr>

            <td>
              ${escapeHtml(
                item.name || ""
              )}
            </td>

            <td>
              ${escapeHtml(
                item.service || ""
              )}
            </td>

            <td>

              <span
                class="status-pill ${
                  item.active
                    ? "active"
                    : "inactive"
                }">

                ${
                  item.active
                    ? text[currentLang].active
                    : text[currentLang].inactive
                }

              </span>

            </td>

            <td>

              <div class="row-actions">

                <button
                  class="icon-btn"
                  type="button"
                  onclick="editMedication('${escapeAttr(item.id)}')"
                  title="Edit">
                  ✎
                </button>

                <button
                  class="icon-btn"
                  type="button"
                  onclick="toggleMedication('${escapeAttr(item.id)}')"
                  title="Toggle">
                  ⏻
                </button>

                <button
                  class="icon-btn danger"
                  type="button"
                  onclick="deleteMedication('${escapeAttr(item.id)}')"
                  title="Delete">
                  ×
                </button>

              </div>

            </td>

          </tr>
        `;

      }
    ).join("");

}



function showResult(
  type,
  message
){

  const el =
    document.getElementById(
      "result"
    );


  el.className =
    type;


  el.innerText =
    message;

}



function clearResult(){

  showResult(
    "",
    ""
  );

}



function escapeHtml(
  value
){

  return String(
    value
  ).replace(
    /[&<>"']/g,
    function(c){

      return {
        "&":
          "&amp;",

        "<":
          "&lt;",

        ">":
          "&gt;",

        "\"":
          "&quot;",

        "'":
          "&#39;"
      }[c];

    }
  );

}



function escapeAttr(
  value
){

  return escapeHtml(
    value
  ).replace(
    /`/g,
    "&#96;"
  );

}



setLanguage(
  "ar"
);


window.addEventListener("pagehide", function(){
  sessionGeneration++;
  hideProtectedContent();
});
window.addEventListener("pageshow", function(event){
  if (event.persisted || !sessionStorage.getItem("unifiedPortalSessionToken")){
    validateExistingSession();
  }
});
validateExistingSession();

</script>
