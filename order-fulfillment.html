<!doctype html>
<html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Order Fulfillment</title>
<style>
body{margin:0;padding:16px;background:#f3f4f6;font-family:Arial,sans-serif;color:#18324b}.card{max-width:760px;margin:24px auto;padding:22px;background:#fff;border:1px solid #e5e7eb;border-radius:14px;box-shadow:0 8px 20px rgba(0,0,0,.08)}h1{margin:0 0 8px;color:#168fb3;font-size:24px}#status{font-weight:700;color:#168fb3;margin:12px 0}.order-table{width:100%;border-collapse:collapse}.order-table th,.order-table td{border:1px solid #d7e3e8;padding:9px;text-align:left}.order-table th{background:#168fb3;color:#fff}.qty{width:100%;box-sizing:border-box;min-height:42px;padding:8px;border:1px solid #cbd5e1;border-radius:6px;font-size:16px}.actions{text-align:center;margin-top:18px}.actions button{min-height:44px;padding:10px 22px;border:0;border-radius:8px;background:#168fb3;color:#fff;font-weight:700;cursor:pointer}.actions button:disabled{opacity:.55;cursor:not-allowed}@media(max-width:600px){body{padding:10px}.card{margin:10px auto;padding:14px}.order-table{font-size:13px}.order-table th,.order-table td{padding:7px}}
</style></head><body>
<main class="card"><h1>Order Fulfillment</h1><div id="status">Loading order…</div><div id="content" hidden><p><strong>Reference:</strong> <span id="reference"></span></p><p><strong>Pharmacy:</strong> <span id="pharmacy"></span></p><table class="order-table"><thead><tr><th>Medication</th><th>Requested Quantity</th><th>Dispensed Quantity</th><th>Approved Quantity</th><th>Notes</th></tr></thead><tbody id="items"></tbody></table><div class="actions"><button id="submit" type="button">Submit</button></div></div></main>
<script>
const API="https://script.google.com/macros/s/AKfycbwna5ifaRT46qMasogcUbjs6u15PtP7p6vwTNCtNqtQi0Kn8FR6JLtjeborWXNPb4Hz/exec";
const token=new URLSearchParams(location.search).get("token")||"";let order=null;
const esc=v=>String(v==null?"":v).replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
function call(action,data){return fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(Object.assign({action:action},data||{}))}).then(r=>r.json());}
async function boot(){if(!token){document.getElementById("status").textContent="Invalid fulfillment link.";return}try{const r=await call("getWarehouseOrder",{accessToken:token});if(!r.success)throw Error(r.code||"ORDER_LOAD_FAILED");order=r;const readOnly=!!r.readOnly;document.getElementById("reference").textContent=r.orderNo;document.getElementById("pharmacy").textContent=(r.pharmacy||"").charAt(0).toUpperCase()+(r.pharmacy||"").slice(1)+" Pharmacy";document.getElementById("items").innerHTML=(r.items||[]).map((i,n)=>'<tr><td>'+esc(i.medicationName||"-")+'</td><td>'+esc(i.requestedQuantity||"-")+'</td><td>'+(readOnly?esc(i.dispensedQuantity||"-"):'<input class="qty" data-item="'+esc(i.itemNo)+'" inputmode="decimal" aria-label="Dispensed quantity for item '+(n+1)+'">')+'</td><td>'+esc(i.approvedQuantity||"-")+'</td><td>'+(readOnly?esc(i.notes||"-"):'<input class="notes" data-item="'+esc(i.itemNo)+'" aria-label="Notes for item '+(n+1)+'" placeholder="Notes">')+'</td></tr>').join("");document.getElementById("content").hidden=false;document.getElementById("submit").hidden=readOnly;document.getElementById("status").textContent=readOnly?(r.approved?"This order is approved and read-only.":"This order was submitted and is read-only until review."):"Enter dispensed quantities. Leave blank if not entered."}catch(e){document.getElementById("status").textContent="Could not load this order ("+esc(e.message)+")."}}
document.getElementById("submit").onclick=async function(){const btn=this;const items=[...document.querySelectorAll(".qty")].map(el=>({itemNo:el.dataset.item,dispensedQuantity:el.value,notes:(document.querySelector('.notes[data-item="'+el.dataset.item+'"]')||{}).value||""}));btn.disabled=true;try{const r=await call("submitWarehouseQuantities",{accessToken:token,items:items,idempotencyKey:(crypto.randomUUID?crypto.randomUUID():String(Date.now()))});if(!r.success)throw Error(r.code||"SUBMIT_FAILED");document.getElementById("status").textContent="Submitted successfully. This order is locked for review.";document.querySelectorAll(".qty,.notes").forEach(i=>i.disabled=true)}catch(e){if(e.message==="INVALID_QUANTITY"){document.getElementById("status").textContent="Submit failed (INVALID_QUANTITY).";btn.disabled=false}else{document.getElementById("status").textContent="Submit status could not be confirmed. Refresh the order or contact the system administrator.";btn.disabled=true}}};boot();
</script></body></html>
