<html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Order Fulfillment</title>
<style>

<main class="card"><h1>Order Fulfillment</h1><div id="status">Loading order…</div><div id="content" hidden><p><strong>Reference:</strong> <span id="reference"></span></p><p><strong>Pharmacy:</strong> <span id="pharmacy"></span></p><table class="order-table"><thead><tr><th>Medication</th><th>Requested Quantity</th><th>Dispensed Quantity</th><th>Approved Quantity</th><th>Notes</th></tr></thead><tbody id="items"></tbody></table><div class="actions"><button id="submit" type="button">Submit</button></div></div></main>
<script>
const API="https://script.google.com/macros/s/AKfycbwna5ifaRT46qMasogcUbjs6u15PtP7p6vwTNCtNqtQi0Kn8FR6JLtjeborWXNPb4Hz/exec";
const token=new URLSearchParams(location.search).get("token")||"";let order=null;
const esc=v=>String(v==null?"":v).replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
function call(action,data){return fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(Object.assign({action:action},data||{}))}).then(r=>r.json());}
async function boot(){if(!token){document.getElementById("status").textContent="Invalid fulfillment link.";return}try{const r=await call("getWarehouseOrder",{accessToken:token});if(!r.success)throw Error(r.code||"ORDER_LOAD_FAILED");order=r;const readOnly=!!r.readOnly;document.getElementById("reference").textContent=r.orderNo;document.getElementById("pharmacy").textContent=(r.pharmacy||"").charAt(0).toUpperCase()+(r.pharmacy||"").slice(1)+" Pharmacy";document.getElementById("items").innerHTML=(r.items||[]).map((i,n)=>'<tr><td>'+esc(i.medicationName||"-")+'</td><td>'+esc(i.requestedQuantity||"-")+'</td><td>'+(readOnly?esc(i.dispensedQuantity||"-"):'<input class="qty" data-item="'+esc(i.itemNo)+'" inputmode="decimal" aria-label="Dispensed quantity for item '+(n+1)+'">')+'</td><td>'+esc(i.approvedQuantity||"-")+'</td><td>'+(readOnly?esc(i.notes||"-"):'<input class="notes" data-item="'+esc(i.itemNo)+'" aria-label="Notes for item '+(n+1)+'" placeholder="Notes">')+'</td></tr>').join("");document.getElementById("content").hidden=false;document.getElementById("submit").hidden=readOnly;document.getElementById("status").textContent=readOnly?(r.approved?"This order is approved and read-only.":"This order was submitted and is read-only until review."):""}catch(e){document.getElementById("status").textContent="Could not load this order ("+esc(e.message)+")."}}
document.getElementById("submit").onclick=async function(){const btn=this;const items=[...document.querySelectorAll(".qty")].map(el=>({itemNo:el.dataset.item,dispensedQuantity:el.value,notes:(document.querySelector('.notes[data-item="'+el.dataset.item+'"]')||{}).value||""}));btn.disabled=true;try{const r=await call("submitWarehouseQuantities",{accessToken:token,items:items,idempotencyKey:(crypto.randomUUID?crypto.randomUUID():String(Date.now()))});if(!r.success)throw Error(r.code||"SUBMIT_FAILED");document.getElementById("status").textContent="Submitted successfully. This order is locked for review.";document.querySelectorAll(".qty,.notes").forEach(i=>i.disabled=true)}catch(e){if(e.message==="INVALID_QUANTITY"){document.getElementById("status").textContent="Submit failed (INVALID_QUANTITY).";btn.disabled=false}else{document.getElementById("status").textContent="Submit status could not be confirmed. Refresh the order or contact the system administrator.";btn.disabled=true}}};boot();
</script><script>const WAREHOUSE_THERAPEUTIC_GROUPS=["Antihypertensives","Cardiac Medications","Lipid-Lowering Agents","Antidiabetics","Hematology & Antithrombotics","Neurological Medications","Psychiatric Medications","Analgesics & Anti-inflammatory","Antibiotics & Antimicrobials","Gastrointestinal Medications","Respiratory & Allergy","Dermatological Preparations","Vitamins, Minerals & Supplements","Immunological Medications","Hormonal & Endocrine Medications","Ophthalmic & Otic Medications","Urological Medications","Other Medications"];const WAREHOUSE_MEDICATION_CLASSIFICATION=Object.freeze({});function warehouseTherapeuticGroup(name){return WAREHOUSE_MEDICATION_CLASSIFICATION[String(name||"").trim().toLowerCase()]||"Other Medications";}function classifyWarehouseRows(){const body=document.getElementById("items");if(!body||body.dataset.therapeuticGrouped==="true")return;const rows=[...body.querySelectorAll("tr")];if(!rows.length)return;const sorted=rows.map(function(row,index){return {row:row,name:String(row.cells[0]&&row.cells[0].textContent||"").trim(),index:index,group:warehouseTherapeuticGroup(row.cells[0]&&row.cells[0].textContent||"")};}).sort(function(a,b){return WAREHOUSE_THERAPEUTIC_GROUPS.indexOf(a.group)-WAREHOUSE_THERAPEUTIC_GROUPS.indexOf(b.group)||a.name.toLocaleLowerCase().localeCompare(b.name.toLocaleLowerCase())||a.index-b.index;});body.innerHTML="";let group="";sorted.forEach(function(entry){if(entry.group!==group){group=entry.group;const heading=document.createElement("tr"),cell=document.createElement("th");heading.className="therapeutic-group-row";cell.colSpan=5;cell.textContent=group;cell.style.cssText="background:#e8f4f7;color:#168fb3;text-align:left;font-weight:700";heading.appendChild(cell);body.appendChild(heading);}body.appendChild(entry.row);});body.dataset.therapeuticGrouped="true";}new MutationObserver(classifyWarehouseRows).observe(document.getElementById("items"),{childList:true});</script><script>(function(){var h=document.querySelector("h1");if(h)h.textContent="ORDER REVIEW";var s=document.getElementById("status");if(s){var clear=function(){if(s.textContent.indexOf("Enter dispensed quantities")===0)s.textContent="";if(s.textContent.indexOf("Submitted successfully")===0)s.textContent="Successfully Submitted for Review";};clear();new MutationObserver(clear).observe(s,{childList:true,characterData:true,subtree:true});}})();</script><script>var WAREHOUSE_CLASSIFICATION_ENTRIES=[["Antihypertensives","Losartan|Telmisartan|Hydralazine|Atenolol|Bisoprolol|Nifedipine|Carvedilol|Prazosin|Metoprolol|Labetalol|Methyldopa|Captopril|Amlodipine|Perindopril|Valsartan|Verapamil"],["Cardiac Medications","Isosorbide|Nitroglycerine|Adenosine|Procainamide|Amiodarone|Digoxin|Dobutamine|Noradrenaline|Adrenaline|Vasopressin|Furosemide|Metolazone"],["Lipid-Lowering Agents","Atorvastatin|Rosuvastatin"],["Antidiabetics","Gliclazide|Linagliptin"],["Hematology & Antithrombotics","Aspirin 81mg|Clopidogrel|Apixaban|Warfarine|Heparin Sodium|Enoxaparin|Reteplase|Darbepoetin|Epoetin beta|Methoxy polyethylene glycol (erythropoiesis-stimulating preparation)|Iron inj|Folic Acid|Plasma Protein"],["Neurological Medications","Levetiracetam|Betahistine|Benztropine"],["Psychiatric Medications","Imipramine|Risperidone|Olanzapine|Venlafaxine|Sulpiride|Haloperidol|Fluoxetine|Clomipramine|Aripiprazole"],["Analgesics & Anti-inflammatory","Paracetamol|Meloxicam|Celecoxib|Diclofenac Gel"],["Antibiotics & Antimicrobials","Amoxicillin|Augmentin|Ciprofloxacin|Moxifloxacin|Metronidazole|Co-trimoxazole|Gentamycin inj|Fluconazole|Caspofungin|Meropenem|Cefazolin|Ceftazidime|Cefepime|Ertapenem|Vancomycin|Azithromycine"],["Gastrointestinal Medications","Mebeverine|Senna|Loperamide|Metoclopramide|Esomeprazole|Omeprazole|Fleet Enema|Lactulose|Buscopan|Simethicone"],["Respiratory & Allergy","Sulbutamol|Pulmicort|Atrovent|Symbicort|Chlorpheniramine|Diphenhydramin|Diphenhydramine|Promethazine|Cetirizine|Dextromethorphan|Bromhexine|ACC|Normal saline Nasal Spray"],["Dermatological Preparations","Hydrocortisone Cream|Fucidine ointment|Fucibact B Cream|Gentamycin oint|Mebo|B-sitosterol cream|White Paraffin|Lidocaine gel|Mupirocin ointment|Heamoproct Cream|Urea Cream|Acitretine"],["Vitamins, Minerals & Supplements","Neurobion|Multivitamine|Vit D|Calcium Carbonate|Calcium Gluconate|Calcium chloride|Magnisium Sulphate|Potassium Chloride"],["Immunological Medications","Hydroxychloroquine|Sulfasalazine|Prednisolone|Hydrocortisone systemic|Dexamethasone"],["Hormonal & Endocrine Medications","L.Thyroxine|Alfacalcidol|Cinacalcet|Paricalcitol"],["Ophthalmic & Otic Medications","Naphazoline eye Drops"],["Urological Medications","Tamsulosine|Finasteride"],["Other Medications","Allopurinol|Sodium Bicarbonate|Sevelamer|Velphoro|Patiromer|Difelikefalin|Sodium phosphate|Lidocaine injectable|Atropine|Naloxone|Mouth wash"]];function warehouseTherapeuticGroup(name){var key=String(name||"").trim().replace(/\s+/g," ").toLowerCase();for(var i=0;i<WAREHOUSE_CLASSIFICATION_ENTRIES.length;i++){if(WAREHOUSE_CLASSIFICATION_ENTRIES[i][1].split("|").some(function(item){return item.toLowerCase()===key;}))return WAREHOUSE_CLASSIFICATION_ENTRIES[i][0];}return "Other Medications";}</script></body></html>
