<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إدارة المستخدمين الموحدة</title>

<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f3f4f6;margin:0;padding:16px;color:#168fb3}
.container{max-width:1120px;margin:auto;background:#fff;padding:22px;border-radius:14px;box-shadow:0 10px 25px rgba(0,0,0,.1)}
.top-bar{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:8px;direction:rtl}
.logo{width:120px;height:120px;object-fit:contain}
.official-header{width:fit-content;max-width:100%;text-align:start;margin-inline-start:0;margin-inline-end:auto;transform:translateY(14px)}
.official-header h2,.official-header h3{margin:2px 0;font-size:13px;line-height:1.4;color:#168fb3}
[dir="rtl"] .official-header{padding-left:8px;border-left:4px solid #168fb3}
[dir="ltr"] .official-header{padding-right:8px;border-right:4px solid #168fb3}
hr{border:none;border-top:1px solid #e5e7eb;margin:14px 0}
.meta-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;direction:ltr}
.date-box{color:#168fb3;padding:6px 10px;font-size:13px;font-weight:bold;text-align:center}
.language-btn{border:none;background:transparent;cursor:pointer;font-size:13px;font-weight:bold;color:#168fb3;padding:4px 0}
.secondary-btn{border:1px solid #cbd5e1;background:#fff;cursor:pointer;font-size:13px;font-weight:bold;color:#168fb3;padding:7px 10px;border-radius:8px}
.title-row{display:grid;grid-template-columns:36px auto 36px;align-items:center;justify-content:center;gap:10px;margin:14px 0 10px}
.page-title{text-align:center;font-size:24px;font-weight:bold;margin:0;color:#168fb3;grid-column:2}
.title-back-button{grid-column:1;width:34px;height:34px;border:0;background:transparent;color:#168fb3;display:flex;align-items:center;justify-content:center;padding:0;text-decoration:none;font-size:28px;line-height:1}
.title-back-button:hover{color:#0f7592;transform:translateX(-1px)}
.login-card,.panel,.empty-box{border:1px solid #e5e7eb;background:#f9fafb;border-radius:8px;padding:14px;margin-top:14px}
.login-card{max-width:280px;margin:16px auto 0;background:#f9fafb;box-shadow:none;padding:12px}
label{font-weight:bold;display:block;margin-bottom:3px;color:#111827;font-size:13px}
input{width:100%;height:36px;padding:7px 10px;margin-top:5px;margin-bottom:10px;border:1px solid #cbd5e1;border-radius:8px;font-size:14px;background:#fff;text-align:start}
.primary-btn{padding:9px 18px;background:#168fb3;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:bold;cursor:pointer}
.primary-btn:disabled{background:#94a3b8;cursor:not-allowed}
.login-actions{display:flex;align-items:center;justify-content:center;gap:8px;width:fit-content;margin:2px auto 0}
.login-actions .primary-btn,.login-actions .secondary-btn{width:36px;height:36px;margin:0;padding:0;display:inline-flex;align-items:center;justify-content:center}
.login-svg{width:20px;height:20px;display:block;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.admin-top{display:grid;grid-template-columns:36px auto 36px;align-items:center;justify-content:center;gap:14px;border:none;background:transparent;padding:4px 0 2px;margin:8px auto 18px;color:#168fb3;text-align:center}
.admin-name{font-weight:bold;color:#168fb3;font-size:24px;line-height:1.2;grid-column:2;white-space:nowrap}
.logout-btn{border:none;background:transparent;color:#168fb3;font-size:0;cursor:pointer;padding:0;width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;border-radius:0;line-height:1;grid-column:1;grid-row:1}
.logout-btn:hover{background:transparent;transform:scale(1.06)}
.power-svg{width:30px;height:30px;display:block;fill:none;stroke:currentColor;stroke-width:2.35;stroke-linecap:round;stroke-linejoin:round}
.form-grid{display:grid;grid-template-columns:180px 140px 220px;gap:10px;align-items:end;justify-content:center;max-width:620px;margin:0 auto}
.permissions-row{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin:4px auto 10px}
.check-pill{height:36px;display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;color:#111827;font-size:13px;padding:0 12px}
.check-pill input{width:auto;height:auto;margin:0}
.form-actions{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:2px}
.form-actions .primary-btn,.form-actions .secondary-btn{height:36px;margin:0;min-width:120px}
.table-wrap{overflow-x:auto;max-width:980px;margin:14px auto 0}
table{width:100%;border-collapse:collapse;min-width:840px;background:#fff}
th,td{padding:6px 5px;border:1px solid #e5e7eb;text-align:center;color:#111827;font-size:12px}
th{background:#168fb3;color:#fff}
.status-pill{display:inline-block;min-width:58px;padding:3px 6px;border-radius:8px;font-weight:bold;font-size:11px}
.status-active{background:#ecfdf5;color:#047857}
.status-inactive{background:#fff7ed;color:#9a3412}
.status-none{background:#f1f5f9;color:#64748b}
.icon-only{border:none;background:transparent;cursor:pointer;font-size:16px;line-height:1;padding:1px}
.edit-btn{color:#168fb3}
.delete-btn{color:#b91c1c}
#result,#loginResult{display:none;margin-top:12px;padding:10px;border-radius:8px;text-align:center}
#result.error,#loginResult.error{display:block;background:#fef2f2;color:#991b1b}
#result.success,#loginResult.success{display:block;background:#ecfdf5;color:#065f46}
.panel{padding:12px}

@media (max-width:700px){
body{padding:10px;background:#fff}
.container{padding:14px;border-radius:0;box-shadow:none}
.logo{width:84px;height:84px}
.official-header{transform:translateY(10px)}
.official-header h2,.official-header h3{font-size:12px}
.page-title{font-size:20px}
.title-row{grid-template-columns:34px auto 34px}
.title-back-button{width:32px;height:32px;font-size:26px}
.form-grid{grid-template-columns:1fr;max-width:320px}
.form-actions{flex-wrap:wrap}
.login-card{max-width:280px;padding:12px}
.admin-top{gap:10px;margin:8px auto 16px}
.admin-name{font-size:22px}
.logout-btn{width:32px;height:32px}
.power-svg{width:28px;height:28px}
table{min-width:760px}
}

/* PHASE B: unified login UI only */
#loginView.login-card{
  width:min(100%, 360px);
  max-width:360px;
  margin:18px auto 0;
  padding:18px;
  background:#f9fafb;
  border:1px solid #e5e7eb;
  border-radius:10px;
  box-shadow:0 12px 28px rgba(15,23,42,.08)
}
#loginView.login-card label{
  margin:0 0 6px;
  color:#168fb3;
  font-size:14px;
  line-height:1.35
}
#loginView.login-card input{
  height:40px;
  padding:8px 10px;
  margin:0 0 12px;
  border:1px solid #cbd5e1;
  border-radius:8px;
  background:#fff;
  color:#111827;
  font-size:14px;
  font-family:inherit
}
#loginView.login-card input:focus{
  border-color:#168fb3;
  outline:3px solid rgba(22,143,179,.12)
}
#loginView .login-actions{
  gap:10px;
  margin:4px auto 0
}
#loginView .login-actions .primary-btn,
#loginView .login-actions .secondary-btn{
  width:42px;
  min-width:42px;
  height:42px;
  min-height:42px;
  border-radius:10px
}
#loginView .login-actions .secondary-btn{
  background:#fff;
  color:#168fb3;
  border:1px solid #cbd5e1
}
#loginView .primary-btn:disabled{
  background:#94a3b8;
  color:#fff;
  cursor:not-allowed;
  opacity:.85
}
#loginResult{
  margin-top:12px;
  padding:10px 12px;
  border-radius:8px;
  font-size:13px;
  line-height:1.5
}
@media (max-width:700px){
  #loginView.login-card{
    width:min(100%, 320px);
    padding:16px;
    margin-top:16px
  }
  #loginView .login-actions .primary-btn,
  #loginView .login-actions .secondary-btn{
    width:42px;
    min-width:42px
  }
}

/* PHASE B-FIX: exact unified visual tokens only */
.container{
  max-width:980px;
  background:#fff;
  padding:22px;
  border-radius:14px;
  box-shadow:0 10px 25px rgba(0,0,0,.1)
}
.page-title{
  font-size:23px;
  font-weight:bold;
  margin:18px 0 12px
}
#loginView.login-card{
  width:100%;
  max-width:420px;
  padding:22px;
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:14px;
  box-shadow:0 8px 20px rgba(0,0,0,.08)
}
#loginView.login-card input{
  width:100%;
  height:44px;
  padding:8px 12px;
  border:1px solid #cbd5e1;
  border-radius:8px;
  font-size:14px;
  font-family:inherit;
  outline:none;
  box-sizing:border-box
}
#loginView.login-card input:focus{
  border-color:#168fb3;
  box-shadow:0 0 0 2px rgba(22,143,179,.12);
  outline:none
}
#loginView .login-actions .primary-btn,
#loginView .login-actions .secondary-btn{
  height:44px;
  min-height:44px;
  border-radius:8px;
  font-size:14px;
  font-weight:bold
}
@media (max-width:700px){
  .container{
    padding:14px;
    border-radius:0;
    box-shadow:none
  }
  #loginView.login-card{
    max-width:420px;
    padding:22px
  }
}


/* PHASE C: unified portal design system */
@media screen{
  body{
    background:#f3f4f6;
  }

  .container,
  .employee-shell{
    max-width:980px;
    margin:auto;
    background:#fff;
    padding:22px;
    border-radius:14px;
    box-shadow:0 10px 25px rgba(0,0,0,.1);
  }

  .logo,
  .official-logo{
    width:120px;
    height:120px;
    object-fit:contain;
  }

  .official-header h2,
  .official-header h3{
    margin:2px 0;
    color:#168fb3;
    font-size:13px;
    line-height:1.4;
  }

  hr,
  .official-divider{
    border-top-color:#e5e7eb;
    margin:14px 0;
  }

  .page-title,
  .employee-page-title{
    color:#168fb3;
    font-size:23px;
    font-weight:bold;
    line-height:1.25;
    margin:18px 0 12px;
    text-align:center;
  }

  .title-row{
    margin:18px 0 12px;
  }

  .panel,
  .toolbar,
  .empty-box,
  .order-panel,
  .size-row,
  .result-card,
  .upload-box,
  .users-form,
  .upload-standalone,
  .employee-toolbar,
  .upload-toolbar,
  .supervisor-panel,
  .user-summary-panel,
  .filter-panel,
  .filters-panel,
  .summary-card,
  .stat-card{
    background:#fff;
    border:1px solid #e5e7eb;
    border-radius:10px;
    box-shadow:0 4px 10px rgba(0,0,0,.04);
  }

  .portal-card,
  .service-card,
  .control-card,
  .pharmacy-card,
  .card-link{
    border-radius:10px;
    box-shadow:0 4px 10px rgba(0,0,0,.04);
  }

  input,
  select,
  textarea{
    min-height:40px;
    padding:8px 12px;
    border:1px solid #cbd5e1;
    border-radius:8px;
    font-size:14px;
    font-family:inherit;
    box-sizing:border-box;
  }

  input:focus,
  select:focus,
  textarea:focus{
    border-color:#168fb3;
    box-shadow:0 0 0 2px rgba(22,143,179,.12);
    outline:none;
  }

  .primary-btn,
  .secondary-btn,
  .action-btn,
  .ghost-btn,
  button[type="submit"]{
    min-height:40px;
    border-radius:8px;
    font-size:14px;
    font-weight:bold;
  }

  .actions,
  .form-actions,
  .login-actions,
  .card-actions,
  .row-actions,
  .scan-actions{
    gap:10px;
  }

  .table-wrap,
  .dashboard-table-wrap,
  .orders-table-wrap{
    overflow-x:auto;
    border-radius:10px;
  }

  table{
    border-collapse:collapse;
  }

  th{
    background:#168fb3;
    color:#fff;
    font-weight:bold;
  }

  th,
  td{
    border-color:#e5e7eb;
  }

  @media (max-width:700px){
    body{
      padding:10px;
      background:#fff;
    }

    .container,
    .employee-shell{
      padding:14px;
      border-radius:0;
      box-shadow:none;
    }

    .logo,
    .official-logo{
      width:84px;
      height:84px;
    }

    .official-header h2,
    .official-header h3{
      font-size:12px;
    }

    .page-title,
    .employee-page-title{
      font-size:20px;
      margin:16px 0 12px;
    }

    input,
    select,
    textarea{
      width:100%;
      font-size:13px;
    }
  }
}

/* Unified User Management UI only */
.management-toolbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  max-width:900px;
  margin:0 auto 14px;
  padding:10px 0
}
.management-toolbar input{
  width:min(100%, 340px);
  margin:0
}
.toolbar-actions{
  display:flex;
  align-items:center;
  gap:10px;
  flex:0 0 auto
}
.toolbar-actions select{
  width:140px;
  margin:0
}
.add-user-btn{
  white-space:nowrap
}
.user-form-panel{
  max-width:760px;
  margin:0 auto 16px;
  padding:18px
}
.form-section-title{
  margin:0 0 12px;
  color:#168fb3;
  font-size:15px;
  font-weight:bold
}
.service-section-title{
  margin-top:16px;
  padding-top:14px;
  border-top:1px solid #e5e7eb
}
.user-form-panel .form-grid{
  grid-template-columns:1fr 1fr;
  max-width:none;
  gap:12px 16px;
  justify-content:stretch
}
.user-form-panel .form-grid input{
  margin-bottom:0
}
.permissions-row{
  justify-content:flex-start;
  gap:10px 22px;
  margin:0 0 16px
}
.simple-check{
  display:inline-flex;
  align-items:center;
  gap:8px;
  min-height:30px;
  margin:0;
  color:#111827;
  font-size:13px;
  font-weight:normal;
  cursor:pointer
}
.simple-check input{
  width:16px;
  height:16px;
  min-height:0;
  margin:0;
  padding:0;
  box-shadow:none
}
.simple-check input:disabled{
  cursor:not-allowed;
  opacity:.65
}
.active-control{
  align-self:center;
  justify-self:start;
  margin-top:20px
}
.table-wrap{
  max-width:900px;
  margin-top:12px;
  border:1px solid #e5e7eb
}
table{
  min-width:680px
}
th,td{
  padding:10px 8px;
  border-width:0 0 1px;
  text-align:start
}
th{
  font-size:12px
}
tbody tr:last-child td{
  border-bottom:0
}
.inactive-user-row{
  background:#f8fafc;
  opacity:.72
}
.user-name-cell{
  font-weight:bold
}
.main-admin-badge{
  display:inline-block;
  margin-inline-start:6px;
  padding:2px 6px;
  border:1px solid #a5d8e7;
  border-radius:8px;
  background:#eef9fc;
  color:#0f7592;
  font-size:10px;
  font-weight:bold;
  white-space:nowrap
}
.access-list{
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:5px
}
.access-badge{
  display:inline-block;
  padding:3px 7px;
  border:1px solid #cde7ef;
  border-radius:8px;
  background:#f2fafc;
  color:#0f7592;
  font-size:11px;
  white-space:nowrap
}
.access-empty{
  color:#94a3b8;
  font-size:12px
}
.actions-cell{
  white-space:nowrap
}
.icon-only{
  width:30px;
  height:30px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:0;
  border-radius:6px
}
.icon-only:hover{
  background:#f1f5f9
}
.action-svg{
  width:17px;
  height:17px;
  fill:none;
  stroke:currentColor;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round
}
.empty-box{
  max-width:900px;
  margin:12px auto 0;
  padding:24px;
  text-align:center;
  color:#64748b
}

.permission-groups{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
  margin:0 0 16px
}
.permission-group{
  border:1px solid #e5e7eb;
  border-radius:10px;
  padding:12px;
  background:#fff
}
.permission-group-title{
  margin:0 0 10px;
  color:#168fb3;
  font-size:14px;
  font-weight:bold
}
.permission-subgroup + .permission-subgroup{
  margin-top:12px;
  padding-top:10px;
  border-top:1px solid #eef2f7
}
.permission-subtitle{
  margin:0 0 8px;
  color:#475569;
  font-size:12px;
  font-weight:bold
}
.permission-options{
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  gap:7px
}
@media (max-width:700px){
  .management-toolbar{
    align-items:stretch;
    flex-direction:column
  }
  .management-toolbar input{
    width:100%
  }
  .toolbar-actions{
    width:100%
  }
  .toolbar-actions select,
  .toolbar-actions .add-user-btn{
    flex:1
  }
  .user-form-panel .form-grid{
    grid-template-columns:1fr
  }

  .permission-groups{
    grid-template-columns:1fr
  }
  .active-control{
    margin-top:2px
  }
  table{
    min-width:620px
  }
}

</style>
</head>

<body>
<div class="container">

<div class="top-bar">
  <div class="official-header">
    <h2 id="officialLine1"></h2>
    <h3 id="officialLine2"></h3>
    <h3 id="officialLine3"></h3>
  </div>
  <img class="logo" src="logo.png" alt="Logo">
</div>

<hr>

<div class="meta-row">
  <div class="date-box" id="dateBox"></div>
  <button type="button" class="language-btn" id="languageToggle" onclick="toggleLanguage()"></button>
</div>

<div class="title-row">
  <a class="title-back-button" href="control-panel.html" title="رجوع" aria-label="رجوع">↩</a>
  <div class="page-title" id="pageTitle"></div>
</div>

<div id="sessionStatus" class="empty-box" role="status" style="display:none"></div>

<div id="loginView" class="login-card" style="display:none">
  <label id="adminUsernameLabel" for="adminUsername"></label>
  <input type="text" id="adminUsername" autocomplete="username">

  <label for="adminPin">PIN</label>
  <input type="password" id="adminPin" inputmode="numeric" autocomplete="current-password">

  <div class="login-actions">
    <button type="button" class="primary-btn" id="loginBtn" onclick="loginAdmin()"></button>
    <button type="button" class="secondary-btn" id="changePinBtn" onclick="changeLoginPin()">🔑</button>
  </div>

  <div id="loginResult"></div>
</div>

<div id="adminView" style="display:none">

  <div class="admin-top">
    <span class="admin-name" id="adminName"></span>
    <button type="button" class="logout-btn" id="logoutBtn" onclick="logoutAdmin()"></button>
  </div>

  <div class="management-toolbar">
    <input
      type="search"
      id="usersSearchInput"
      oninput="handleUsersSearch()">

    <div class="toolbar-actions">
      <select
        id="usersStatusFilter"
        onchange="handleUsersFilter()">
        <option value="all"></option>
        <option value="active"></option>
        <option value="inactive"></option>
      </select>

      <button
        type="button"
        class="primary-btn add-user-btn"
        id="addUserBtn"
        onclick="openAddUserForm()"></button>
    </div>
  </div>

  <div class="panel user-form-panel" id="userFormPanel" style="display:none">

    <div class="form-section-title" id="userInformationTitle"></div>

    <div class="form-grid">

      <div>
        <label id="usernameLabel" for="usernameInput"></label>
        <input type="text" id="usernameInput">
      </div>

      <div>
        <label id="pinLabel" for="pinInput"></label>
        <input type="text" id="pinInput" inputmode="numeric">
      </div>

      <div>
        <label id="nameLabel" for="nameInput"></label>
        <input type="text" id="nameInput">
      </div>

      <label class="simple-check active-control">
        <input id="activeInput" type="checkbox" checked>
        <span id="activeLabel"></span>
      </label>

    </div>

    <div class="form-section-title service-section-title" id="serviceAccessTitle"></div>

    <div class="permission-groups">

      <section class="permission-group">
        <h3 class="permission-group-title" id="opdGroupTitle"></h3>
        <div class="permission-subgroup">
          <div class="permission-subtitle" id="opdMailGroupTitle"></div>
          <div class="permission-options">
            <label class="simple-check"><input id="opdMailRxAccessInput" type="checkbox"><span id="opdMailRxAccessLabel"></span></label>
            <label class="simple-check"><input id="opdMailDailyListAccessInput" type="checkbox"><span id="opdMailDailyListAccessLabel"></span></label>
            <label class="simple-check"><input id="opdMailIndicatorAccessInput" type="checkbox"><span id="opdMailIndicatorAccessLabel"></span></label>
          </div>
        </div>

/* ================================

================================ */

function loginAdmin() {
  window.location.replace("index.html");
}

function hideAdminData() {
  sessionVerified = false;
  window.clearTimeout(inactivityTimer);
  document.getElementById("adminView").style.display = "none";
  document.getElementById("loginView").style.display = "none";
  users = [];
  document.getElementById("usersBody").innerHTML = "";
  clearForm();
  clearResult();
}

function clearPortalSession() {
  ["unifiedPortalUsername", "unifiedPortalSessionToken", "unifiedPortalUser"]
    .forEach(function(key) { sessionStorage.removeItem(key); });
  adminUsername = "";
  adminSessionToken = "";
}

function logoutAdmin() {
  const tokenToRevoke = adminSessionToken;
  sessionGeneration++;
  hideAdminData();
  clearPortalSession();
  if (tokenToRevoke) {
    unifiedApi({
      action: "revokeSession",
      sessionToken: tokenToRevoke
    }).catch(function() {});
  }
  window.location.replace("index.html");
}

async function validatePortalSession() {
  const generation = ++sessionGeneration;
  hideAdminData();
  const status = document.getElementById("sessionStatus");
  status.style.display = "block";
  status.innerText = text[currentLang].loading;
  adminSessionToken = sessionStorage.getItem("unifiedPortalSessionToken") || "";
  if (!adminSessionToken) {
    clearPortalSession();
    window.location.replace("index.html");
    return;
  }
  try {
    const result = await unifiedApi({
      action: "validateSession",
      service: "userManagement"
    });
    if (generation !== sessionGeneration) return;
    if (result.success && result.user && result.user.username) {
      adminUsername = result.user.username;
      sessionStorage.setItem("unifiedPortalUsername", adminUsername);
      sessionStorage.setItem("unifiedPortalUser", JSON.stringify(result.user));
      sessionVerified = true;
      status.style.display = "none";
      showAdminView();
    } else if (result.code === "NO_PERMISSION") {
      window.location.replace("control-panel.html");
    } else if (result.code === "INVALID_SESSION" || result.code === "MISSING_SESSION") {
      clearPortalSession();
      window.location.replace("index.html");
    } else {
      throw new Error("Session validation failed");
    }
  } catch (error) {
    if (generation !== sessionGeneration) return;
    // A transport failure does not invalidate the shared portal session.
    status.innerText = currentLang === "ar"
      ? "تعذر التحقق من الجلسة. أعد تحميل الصفحة للمحاولة."
      : "Unable to verify your session. Reload the page to retry.";
  }
}

/* ================================
   CHANGE MAIN ADMIN PIN
================================ */

async function changeLoginPin() {

  const username =
    document.getElementById(
      "adminUsername"
    ).value.trim()
    ||
    adminUsername
    ||
    window.prompt(
      "أدخل اسم المستخدم:"
    );

  if (!username) return;

  const currentPin =
    window.prompt(
      "أدخل PIN الحالي:"
    );

  if (!currentPin) return;

  const newPin =
    window.prompt(
      "أدخل PIN الجديد:"
    );

  if (!newPin) return;

  const confirmPin =
    window.prompt(
      "أعد إدخال PIN الجديد:"
    );

  if (
    newPin !==
    confirmPin
  ) {

    showLoginResult(
      "error",
      text[
        currentLang
      ].pinMismatch
    );

    return;
  }

  try {

    const result =
      await unifiedApi({
        action:
          "changeLoginPin",
        username:
          username,
        currentPin:
          currentPin,
        newPin:
          newPin
      });

    if (!result.success) {

      showLoginResult(
        "error",
        result.message ||
        text[currentLang].failed
      );

      return;
    }

    showLoginResult(
      "success",
      text[currentLang].pinChanged
    );

  } catch (error) {

    showLoginResult(
      "error",
      text[currentLang].failed
    );
  }
}

/* ================================
   INACTIVITY
================================ */

function startInactivityWatcher() {

  [
    "click",
    "keydown",
    "touchstart",
    "mousemove"
  ].forEach(
    function(eventName) {

      window.addEventListener(
        eventName,
        resetInactivityTimer,
        {
          passive: true
        }
      );
    }
  );

  resetInactivityTimer();
}

function resetInactivityTimer() {

  if (!sessionVerified) return;

  window.clearTimeout(
    inactivityTimer
  );

  inactivityTimer =
    window.setTimeout(
      function() {

        if (
          adminUsername &&
          adminSessionToken
        ) {
          logoutAdmin();
        }

      },
      INACTIVITY_LIMIT_MS
    );
}

================================ */

async function loadUsers(silent = false) {

  if (!silent) {
    clearResult();
  
    document.getElementById(
      "emptyBox"
    ).style.display =
      "block";
  
    document.getElementById(
      "emptyBox"
    ).innerText =
      text[currentLang].loading;
  
    document.getElementById(
      "usersTable"
    ).style.display =
      "none";
  }

  try {

    const result =
      await unifiedApi({
        action:
          "adminListUsers"
      });

    if (!result.success) {

      users = [];

      showResult(
        "error",
        text[currentLang].failed
      );

      renderUsers();

      return;
    }

    users =
      result.users ||
      [];

    users.sort(
      function(a, b) {

        return String(
          a.username || ""
        ).localeCompare(
          String(
            b.username || ""
          )
        );
      }
    );

    renderUsers();

  } catch (error) {

    users = [];

    showResult(
      "error",
      text[currentLang].failed
    );

    renderUsers();
  }
}

/* ================================
   SAVE USER
================================ */

async function saveUser() {
  const username = document.getElementById("usernameInput").value.trim();
  const pin = document.getElementById("pinInput").value.trim();
  const name = document.getElementById("nameInput").value.trim();
  const active = document.getElementById("activeInput").checked;

  const permissionPayload = {};

  DETAILED_PERMISSIONS.forEach(function(definition) {
    const input = document.getElementById(definition[0]);
    permissionPayload[definition[1]] = Boolean(input && input.checked);
  });

  if (!username || !name) {
    showResult("error", text[currentLang].failed + " (MISSING_FIELDS)");
    return;
  }

  const hasPermission = Object.keys(permissionPayload).some(function(key) {
    return permissionPayload[key];
  });

  if (!hasPermission) {
    showResult("error", text[currentLang].permissionRequired);
    return;
  }

  if (!editingUsername && !pin) {
    showResult("error", text[currentLang].pinRequired);
    return;
  }

  try {
    let result;

    if (editingUsername) {
      result = await unifiedApi({
        action:"adminUpdateUser",
        originalUsername:editingUsername,
        username:username,
        pin:pin,
        name:name,
        active:active,
        ...permissionPayload
      });
    } else {
      result = await unifiedApi({
        action:"adminAddUser",
        username:username,
        pin:pin,
        name:name,
        active:active,
        ...permissionPayload
      });
    }

    if (!result.success) {
      showResult(
        "error",
        result.message || `${text[currentLang].failed} (${result.code || "ERROR"})`
      );
      return;
    }

    showResult("success", text[currentLang].saved);
    clearForm();
    await loadUsers(true);

  } catch (error) {
    showResult("error", text[currentLang].failed);
  }
}

/* ================================
   EDIT USER
================================ */

function editUser(username) {
  const user = users.find(function(item) {
    return item.username === username;
  });

  if (!user) return;

  editingUsername = user.username;
  document.getElementById("usernameInput").value = user.username || "";
  document.getElementById("pinInput").value = "";
  document.getElementById("nameInput").value = user.name || "";

  const isMainAdmin = String(user.username || "").toLowerCase() === "admin";

  DETAILED_PERMISSIONS.forEach(function(definition) {
    const input = document.getElementById(definition[0]);
    if (!input) return;

    input.checked = isMainAdmin ? true : Boolean(user[definition[1]]);
    input.disabled = isMainAdmin || adminUsername.toLowerCase() !== "admin";
  });

  document.getElementById("activeInput").checked =
    isMainAdmin ? true : user.active !== false;

  document.getElementById("saveUserBtn").innerText = text[currentLang].update;
  showUserForm();
}

/* ================================
   DELETE USER
================================ */

async function deleteUser(
  username
) {

  if (
    !confirm(
      text[
        currentLang
      ].confirmDelete
    )
  ) {
    return;
  }

  try {

    const result =
      await unifiedApi({
        action:
          "adminDeleteUser",

        username:
          username
      });

    if (!result.success) {

      showResult(
        "error",
        result.message ||
        text[currentLang].failed
      );

      return;
    }

    showResult(
      "success",
      text[currentLang].deleted
    );

    await loadUsers();

  } catch (error) {

    showResult(
      "error",
      text[currentLang].failed
    );
  }
}

/* ================================
   CLEAR FORM
================================ */

function clearForm() {
  editingUsername = "";
  document.getElementById("usernameInput").value = "";
  document.getElementById("pinInput").value = "";
  document.getElementById("nameInput").value = "";

  DETAILED_PERMISSIONS.forEach(function(definition) {
    const input = document.getElementById(definition[0]);
    if (input) {
      input.checked = false;
      input.disabled = adminUsername.toLowerCase() !== "admin";
    }
  });

  document.getElementById("activeInput").checked = true;
  document.getElementById("saveUserBtn").innerText = text[currentLang].save;
  document.getElementById("userFormPanel").style.display = "none";
}

/* ================================
   RENDER USERS
================================ */

function renderUsers() {

  const body =
    document.getElementById(
      "usersBody"
    );

  const table =
    document.getElementById(
      "usersTable"
    );

  const empty =
    document.getElementById(
      "emptyBox"
    );

  if (!body) return;

  body.innerHTML =
    "";

  const filteredUsers =
    users.filter(
      function(user) {

        const matchesSearch =
          !usersSearchTerm ||
          String(
            user.name || ""
          )
            .toLowerCase()
            .includes(
              usersSearchTerm
            ) ||
          String(
            user.username || ""
          )
            .toLowerCase()
            .includes(
              usersSearchTerm
            );

        const isActive =
          user.active !== false;

        const matchesStatus =
          usersStatusFilter === "all" ||
          (
            usersStatusFilter === "active" &&
            isActive
          ) ||
          (
            usersStatusFilter === "inactive" &&
            !isActive
          );

        return (
          matchesSearch &&
          matchesStatus
        );
      }
    );

  if (!filteredUsers.length) {

    table.style.display =
      "none";

    empty.style.display =
      "block";

    empty.innerText =
      text[currentLang].noUsers;

    return;
  }

  empty.style.display =
    "none";

  table.style.display =
    "table";

  filteredUsers.forEach(
    function(user) {

      const tr =
        document.createElement(
          "tr"
        );

      if (
        user.active === false
      ) {
        tr.classList.add(
          "inactive-user-row"
        );
      }

      const isMainAdmin =
        String(
          user.username || ""
        ).toLowerCase() ===
        "admin";

      tr.innerHTML = `

        <td class="user-name-cell">
          ${escapeHtml(user.name || "")}
          ${isMainAdmin
            ? `<span class="main-admin-badge">${escapeHtml(text[currentLang].mainAdmin)}</span>`
            : ""}
        </td>

        <td>
          ${escapeHtml(user.username || "")}
        </td>

        <td>
          ${renderAccessBadges(
            user,
            isMainAdmin
          )}
        </td>

        <td>
          ${activeStatus(
            user.active
          )}
        </td>

        <td class="actions-cell">
          <button
            type="button"
            class="icon-only edit-btn"
            title="${text[currentLang].edit}"
            onclick="editUser('${escapeAttribute(user.username)}')">
            <svg class="action-svg" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 20h9"></path>
              <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"></path>
            </svg>
          </button>

          <button
            type="button"
            class="icon-only delete-btn"
            title="${text[currentLang].delete}"
            onclick="deleteUser('${escapeAttribute(user.username)}')">
            <svg class="action-svg" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 6h18"></path>
              <path d="M8 6V4h8v2"></path>
              <path d="M19 6l-1 14H6L5 6"></path>
              <path d="M10 11v5M14 11v5"></path>
            </svg>
          </button>
        </td>

      `;

      body.appendChild(
        tr
      );
    }
  );
}


function renderAccessBadges(user, isMainAdmin) {
  if (isMainAdmin) {
    return `
      <div class="access-list">
        <span class="access-badge">${escapeHtml(text[currentLang].allServices)}</span>
      </div>
    `;
  }

  const permissions = DETAILED_PERMISSIONS
    .filter(function(definition) {
      return Boolean(user[definition[1]]);
    })
    .map(function(definition) {
      return `
        <span class="access-badge">${escapeHtml(text[currentLang][definition[2]])}</span>
      `;
    })
    .join("");

  return permissions
    ? `<div class="access-list">${permissions}</div>`
    : `<span class="access-empty">${escapeHtml(text[currentLang].noAccess)}</span>`;
}

function permissionStatus(
  hasAccess,
  active
) {

  if (!hasAccess) {

    return `
      <span class="status-pill status-none">
        ${text[currentLang].noAccess}
      </span>
    `;
  }

  if (!active) {

    return `
      <span class="status-pill status-inactive">
        ${text[currentLang].inactive}
      </span>
    `;
  }

  return `
    <span class="status-pill status-active">
      ${text[currentLang].active}
    </span>
  `;
}

function activeStatus(active) {

  return active !== false
    ? `
      <span class="status-pill status-active">
        ${text[currentLang].active}
      </span>
      `
    : `
      <span class="status-pill status-inactive">
        ${text[currentLang].inactive}
      </span>
      `;
}

/* ================================
   UNIFIED API
================================ */

async function unifiedApi(
  payload
) {

  const generation = sessionGeneration;

  const response =
    await fetch(
      UNIFIED_API_URL,
      {
        method:
          "POST",

        headers: {
          "Content-Type":
            "text/plain;charset=utf-8"
        },

        keepalive: payload.action === "revokeSession",

        body:
          JSON.stringify({
            sessionToken:
              payload.sessionToken ||
              adminSessionToken,

            ...payload
          })
      }
    );

  if (!response.ok) throw new Error("HTTP " + response.status);
  const result = await response.json();
  if (payload.action !== "revokeSession" && generation !== sessionGeneration) {
    throw new Error("Stale session response");
  }
  if (payload.action.startsWith("admin") &&
      ["UNAUTHORIZED", "INVALID_SESSION", "NO_PERMISSION"].includes(result.code)) {
    sessionGeneration++;
    hideAdminData();
    if (result.code === "INVALID_SESSION") {
      clearPortalSession();
      window.location.replace("index.html");
    } else if (result.code === "NO_PERMISSION") {
      window.location.replace("control-panel.html");
    } else {
      const status = document.getElementById("sessionStatus");
      status.style.display = "block";
      status.innerText = text[currentLang].failed;
    }
    throw new Error("Session authorization changed");
  }
  return result;
}

/* ================================
   UI HELPERS
================================ */

function showResult(
  type,
  message
) {

  const result =
    document.getElementById(
      "result"
    );

  result.className =
    type;

  result.innerText =
    message;
}

function clearResult() {

  const result =
    document.getElementById(
      "result"
    );

  result.className =
    "";

  result.innerText =
    "";
}

function showLoginResult(
  type,
  message
) {

  const result =
    document.getElementById(
      "loginResult"
    );

  result.className =
    type;

  result.innerText =
    message;
}

function escapeHtml(value) {

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );
}

function escapeAttribute(
  value
) {

  return String(
    value ?? ""
  )
  .replace(
    /\\/g,
    "\\\\"
  )
  .replace(
    /'/g,
    "\\'"
  );
}

/* ================================
   INITIALIZE
================================ */

setLanguage("ar");

window.addEventListener("pagehide", function() {
  sessionGeneration++;
  hideAdminData();
});
window.addEventListener("pageshow", function(event) {
  if (event.persisted) validatePortalSession();
});
validatePortalSession();
