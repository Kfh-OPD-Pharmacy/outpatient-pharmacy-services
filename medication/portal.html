<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>صرف الأدوية الشهرية بموعد</title>

<style>
*{box-sizing:border-box}

body{
  font-family:Arial,sans-serif;
  background:#f3f4f6;
  margin:0;
  padding:16px;
  color:#168fb3
}

.container{
  max-width:980px;
  margin:auto;
  background:#fff;
  padding:22px;
  border-radius:14px;
  box-shadow:0 10px 25px rgba(0,0,0,.1);
  min-height:calc(100vh - 32px)
}

.top-bar{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
  margin-bottom:8px;
  direction:ltr
}

.logo{
  width:120px;
  height:120px;
  object-fit:contain
}

.official-header{
  width:fit-content;
  max-width:100%;
  text-align:right;
  transform:translateY(14px);
  padding-left:8px;
  border-left:4px solid #168fb3;
  direction:rtl
}

.official-header h2,
.official-header h3{
  margin:2px 0;
  font-size:13px;
  line-height:1.4;
  color:#168fb3
}

/* العربي كما هو */
html[dir="rtl"] .official-header{
  text-align:right;
  padding-left:8px;
  padding-right:0;
  border-left:4px solid #168fb3;
  border-right:0
}

/* في حال استخدام الإنجليزية لاحقاً:
   نفس مكان الترويسة، فقط النص يكون محاذياً للخط */
html[dir="ltr"] .official-header{
  text-align:left;
  padding-left:6px;
  padding-right:0;
  border-left:4px solid #168fb3;
  border-right:0
}

html[dir="ltr"] .official-header h2,
html[dir="ltr"] .official-header h3{
  direction:ltr;
  text-align:left
}

hr{
  border:none;
  border-top:1px solid #e5e7eb;
  margin:14px 0
}

.meta-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:14px;
  direction:ltr
}

.date-box{
  color:#168fb3;
  padding:4px 0;
  font-size:13px;
  font-weight:bold;
  text-align:center
}

.language-chip{
  color:#168fb3;
  font-size:13px;
  font-weight:bold;
  padding:4px 0;
  white-space:nowrap
}

.page-title{
  text-align:center;
  font-size:24px;
  font-weight:bold;
  margin:18px 0 8px;
  color:#168fb3
}

.subtitle{
  text-align:center;
  color:#334155;
  font-size:15px;
  line-height:1.7;
  margin:0 auto 22px;
  max-width:620px
}

.portal-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:14px;
  max-width:680px;
  margin:30px auto 0
}

.portal-card{
  background:#168fb3;
  border:1px solid #168fb3;
  border-radius:8px;
  padding:18px;
  text-decoration:none;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  min-height:118px;
  transition:.15s ease
}

.portal-card:hover{
  border-color:#0f7592;
  transform:translateY(-1px);
  box-shadow:0 8px 18px rgba(22,143,179,.28);
  filter:brightness(1.05)
}

.card-text{
  text-align:start
}

.card-title{
  font-size:18px;
  font-weight:bold;
  color:#fff;
  margin:0 0 7px
}

.card-desc{
  font-size:13px;
  color:rgba(255,255,255,.85);
  line-height:1.6;
  margin:0
}

.card-icon{
  width:44px;
  height:44px;
  border-radius:10px;
  background:rgba(255,255,255,.2);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
  flex:0 0 auto
}

.main-home-link{
  display:flex;
  align-items:center;
  justify-content:center;
  width:fit-content;
  margin:20px auto 0;
  color:#168fb3;
  text-decoration:none;
  font-size:28px;
  line-height:1;
  background:transparent;
  border:none;
  padding:4px
}

.main-home-link:hover{
  color:#0f7592
}

.portal-grid{
  gap:12px;
  max-width:580px;
  margin-top:28px
}

.portal-card{
  min-height:100px;
  padding:14px;
  gap:12px
}

.card-title{
  font-size:16px;
  margin-bottom:5px
}

.card-desc{
  font-size:12px;
  line-height:1.55
}

.card-icon{
  width:38px;
  height:38px;
  border-radius:8px;
  font-size:21px
}

.back-button{
  width:38px;
  height:38px;
  margin:0 auto 8px 0;
  padding:0;
  border:0;
  background:transparent;
  color:#168fb3;
  font-size:31px;
  line-height:1;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  font-family:Arial,sans-serif;
  border-radius:0
}

.back-button:hover{
  background:transparent;
  color:#0f7592;
  transform:translateX(-1px)
}

@media (max-width:700px){

  .back-button{
    width:34px;
    height:34px;
    margin-bottom:6px;
    font-size:28px
  }

  body{
    padding:10px;
    background:#fff
  }

  .container{
    padding:14px;
    border-radius:0;
    box-shadow:none;
    min-height:100vh
  }

  .logo{
    width:84px;
    height:84px
  }

  .official-header{
    transform:translateY(10px)
  }

  .official-header h2,
  .official-header h3{
    font-size:12px
  }

  .page-title{
    font-size:20px
  }

  .portal-grid{
    grid-template-columns:1fr
  }

  .portal-card{
    min-height:88px;
    padding:12px
  }

  .card-title{
    font-size:15px
  }

  .card-desc{
    font-size:12px
  }

  .card-icon{
    width:34px;
    height:34px;
    font-size:19px
  }
}


/* PHASE C: unified portal design system */
@media screen{
  body{
    background:#f3f4f6;
  }

  .container,
  .employee-shell{
    max-width:980px;
    margin:auto;
    background:#fff;
    padding:22px;
    border-radius:14px;
    box-shadow:0 10px 25px rgba(0,0,0,.1);
  }

  .logo,
  .official-logo{
    width:120px;
    height:120px;
    object-fit:contain;
  }

  .official-header h2,
  .official-header h3{
    margin:2px 0;
    color:#168fb3;
    font-size:13px;
    line-height:1.4;
  }

  hr,
  .official-divider{
    border-top-color:#e5e7eb;
    margin:14px 0;
  }

  .page-title,
  .employee-page-title{
    color:#168fb3;
    font-size:23px;
    font-weight:bold;
    line-height:1.25;
    margin:18px 0 12px;
    text-align:center;
  }

  .title-row{
    margin:18px 0 12px;
  }

  .panel,
  .toolbar,
  .empty-box,
  .order-panel,
  .size-row,
  .result-card,
  .upload-box,
  .users-form,
  .upload-standalone,
  .employee-toolbar,
  .upload-toolbar,
  .supervisor-panel,
  .user-summary-panel,
  .filter-panel,
  .filters-panel,
  .summary-card,
  .stat-card{
    background:#fff;
    border:1px solid #e5e7eb;
    border-radius:10px;
    box-shadow:0 4px 10px rgba(0,0,0,.04);
  }

  .portal-card,
  .service-card,
  .control-card,
  .pharmacy-card,
  .card-link{
    border-radius:10px;
    box-shadow:0 4px 10px rgba(0,0,0,.04);
  }

  input,
  select,
  textarea{
    min-height:40px;
    padding:8px 12px;
    border:1px solid #cbd5e1;
    border-radius:8px;
    font-size:14px;
    font-family:inherit;
    box-sizing:border-box;
  }

  input:focus,
  select:focus,
  textarea:focus{
    border-color:#168fb3;
    box-shadow:0 0 0 2px rgba(22,143,179,.12);
    outline:none;
  }

  .primary-btn,
  .secondary-btn,
  .action-btn,
  .ghost-btn,
  button[type="submit"]{
    min-height:40px;
    border-radius:8px;
    font-size:14px;
    font-weight:bold;
  }

  .actions,
  .form-actions,
  .login-actions,
  .card-actions,
  .row-actions,
  .scan-actions{
    gap:10px;
  }

  .table-wrap,
  .dashboard-table-wrap,
  .orders-table-wrap{
    overflow-x:auto;
    border-radius:10px;
  }

  table{
    border-collapse:collapse;
  }

  th{
    background:#168fb3;
    color:#fff;
    font-weight:bold;
  }

  th,
  td{
    border-color:#e5e7eb;
  }

  @media (max-width:700px){
    body{
      padding:10px;
      background:#fff;
    }

    .container,
    .employee-shell{
      padding:14px;
      border-radius:0;
      box-shadow:none;
    }

    .logo,
    .official-logo{
      width:84px;
      height:84px;
    }

    .official-header h2,
    .official-header h3{
      font-size:12px;
    }

    .page-title,
    .employee-page-title{
      font-size:20px;
      margin:16px 0 12px;
    }

    input,
    select,
    textarea{
      width:100%;
      font-size:13px;
    }
  }
}

</style>

<style>
.meta-row.unified-meta{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);
  align-items:center;
  gap:12px;
  direction:ltr
}
.meta-row.unified-meta .date-box{justify-self:start}
.meta-row.unified-meta .language-chip{justify-self:end}
.unified-user-tools{
  grid-column:2;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  direction:rtl;
  color:#168fb3
}
.unified-user-tools .logout-icon{
  width:34px;
  height:34px;
  padding:0;
  border:0;
  background:transparent;
  color:#168fb3;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  justify-content:center
}
.unified-user-tools .power-svg{
  width:28px;
  height:28px;
  display:block;
  fill:none;
  stroke:currentColor;
  stroke-width:2.35;
  stroke-linecap:round;
  stroke-linejoin:round
}
.unified-user-tools .back-button{
  margin:0;
  text-decoration:none
}
#portalEmployeeName{
  font-weight:bold;
  white-space:nowrap;
  max-width:220px;
  overflow:hidden;
  text-overflow:ellipsis
}
.portal-card[hidden]{display:none!important}
@media (max-width:700px){
  .meta-row.unified-meta{grid-template-columns:minmax(54px,1fr) auto minmax(54px,1fr);gap:6px}
  .unified-user-tools{gap:6px}
  #portalEmployeeName{max-width:120px;font-size:13px}
}
</style>
</head>

<body>

<div class="container">
<div class="top-bar">

    <img
      class="logo"
      src="../logo.png"
      alt="Logo">

    <div class="official-header">

      <h2>
        تجمع المدينة المنورة الصحي
      </h2>

      <h3>
        مستشفى الملك فهد بالمدينة المنورة
      </h3>

      <h3>
        إدارة الرعاية الصيدلانية
      </h3>

    </div>

  </div>

  <hr>

  <div class="meta-row unified-meta">

    <div
      class="date-box"
      id="dateBox">
    </div>

    <div class="unified-user-tools">
      <a class="back-button" href="../outpatient-pharmacy.html" title="رجوع" aria-label="رجوع">‹</a>
      <strong id="portalEmployeeName"></strong>
      <button id="portalLogoutBtn" class="logout-icon" type="button" title="خروج" aria-label="خروج">
        <svg class="power-svg" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3v9"></path>
          <path d="M7.1 6.8a8 8 0 1 0 9.8 0"></path>
        </svg>
      </button>
    </div>

    <div class="language-chip">
      🌐 ع | E
    </div>

  </div>

  <h1 class="page-title">
    صرف الأدوية الشهرية بموعد
  </h1>

  <div class="portal-grid">

    <a
      class="portal-card"
      id="manageCard"
      href="employee.html"
      hidden>

      <div class="card-text">

        <p class="card-title">
          إدارة المواعيد
        </p>

        <p class="card-desc">
          متابعة الحجوزات اليومية وتحديث الاستلام والتسليم.
        </p>

      </div>

      <div class="card-icon">
        ✓
      </div>

    </a>

    <a
      class="portal-card"
      id="indicatorCard"
      href="dashboard.html"
      hidden>

      <div class="card-text">

        <p class="card-title">
          مؤشر المواعيد
        </p>

        <p class="card-desc">
          عرض مؤشرات الحجوزات والسعة المتاحة خلال اليوم.
        </p>

      </div>

      <div class="card-icon">
        ▦
      </div>

    </a>

  </div>

</div>

<script>
const UNIFIED_API_URL =
  "https://script.google.com/macros/s/AKfycbw9JM87uiSHihWDP0N1gn4IskEG_8O-fWleathLZW9Wwbs915UQz8Gq5k2dIwAGImCF/exec";

function renderDate(){
  const now = new Date();

  const date =
    new Intl.DateTimeFormat(
      "en-CA",
      {timeZone:"Asia/Riyadh"}
    ).format(now);

  const dayName =
    new Intl.DateTimeFormat(
      "ar-SA",
      {
        timeZone:"Asia/Riyadh",
        weekday:"long"
      }
    ).format(now);

  document.getElementById("dateBox").innerText =
    `${dayName} - ${date}`;
}

function getCachedUnifiedUser(){
  const raw =
    sessionStorage.getItem("unifiedPortalUser") || "";

  if (!raw) return null;

  try {
    return JSON.parse(raw);
  } catch (error) {
    return null;
  }
}

function hasManageAccess(user){
  return Boolean(
    user &&
    (
      user.opdAppointmentManageAccess === true ||
      (
        user.permissions &&
        user.permissions.opdAppointmentManage === true
      )
    )
  );
}

function hasIndicatorAccess(user){
  return Boolean(
    user &&
    (
      user.opdAppointmentIndicatorAccess === true ||
      (
        user.permissions &&
        user.permissions.opdAppointmentIndicator === true
      )
    )
  );
}

function renderPortalAccess(user){
  const manage = hasManageAccess(user);
  const indicator = hasIndicatorAccess(user);

  const manageCard = document.getElementById("manageCard");
  const indicatorCard = document.getElementById("indicatorCard");

  manageCard.hidden = !manage;
  indicatorCard.hidden = !indicator;

  document.getElementById("portalEmployeeName").textContent =
    user
      ? (user.name || user.username || "")
      : "";

  return manage || indicator;
}

function hidePortalCards(){
  document.getElementById("manageCard").hidden = true;
  document.getElementById("indicatorCard").hidden = true;
  document.getElementById("portalEmployeeName").textContent = "";
}

function clearUnifiedSession(){
  sessionStorage.removeItem("unifiedPortalUsername");
  sessionStorage.removeItem("unifiedPortalSessionToken");
  sessionStorage.removeItem("unifiedPortalUser");
}

async function unifiedRequest(payload){
  const response =
    await fetch(
      UNIFIED_API_URL,
      {
        method:"POST",
        headers:{
          "Content-Type":"text/plain;charset=utf-8"
        },
        body:JSON.stringify(payload)
      }
    );

  if (!response.ok) {
    throw new Error("NETWORK_ERROR");
  }

  return response.json();
}

async function validatePortalSession(){
  const token =
    sessionStorage.getItem("unifiedPortalSessionToken") || "";

  if (!token) {
    clearUnifiedSession();
    hidePortalCards();
    window.location.replace("../index.html");
    return;
  }

  const cachedUser = getCachedUnifiedUser();
  const cachedAllowed = renderPortalAccess(cachedUser);

  try {
    const result =
      await unifiedRequest({
        action:"validateSession",
        sessionToken:token,
        service:""
      });

    if (!result || result.success !== true || !result.user || result.user.active === false) {
      const code = result && result.code ? result.code : "INVALID_SESSION";

      if (code === "NO_PERMISSION") {
        hidePortalCards();
        window.location.replace("../outpatient-pharmacy.html");
        return;
      }

      clearUnifiedSession();
      hidePortalCards();
      window.location.replace("../index.html");
      return;
    }

    sessionStorage.setItem(
      "unifiedPortalUser",
      JSON.stringify(result.user)
    );

    sessionStorage.setItem(
      "unifiedPortalUsername",
      result.user.username || ""
    );

    if (!renderPortalAccess(result.user)) {
      window.location.replace("../outpatient-pharmacy.html");
    }

  } catch (error) {
    if (!cachedAllowed) {
      hidePortalCards();
    }
  }
}

async function logoutUnified(){
  const token =
    sessionStorage.getItem("unifiedPortalSessionToken") || "";

  if (token) {
    try {
      await unifiedRequest({
        action:"revokeSession",
        sessionToken:token
      });
    } catch (error) {}
  }

  clearUnifiedSession();
  hidePortalCards();
  window.location.replace("../index.html");
}

document.getElementById("portalLogoutBtn")
  .addEventListener("click", logoutUnified);

window.addEventListener(
  "pageshow",
  function(){
    const token =
      sessionStorage.getItem("unifiedPortalSessionToken") || "";

    if (!token) {
      hidePortalCards();
      window.location.replace("../index.html");
    }
  }
);

renderDate();
validatePortalSession();
</script>

</body>
</html>
