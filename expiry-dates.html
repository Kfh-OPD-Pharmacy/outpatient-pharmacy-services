<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Expiry Dates</title><style>
*{box-sizing:border-box}body{margin:0;padding:10px;background:#f3f4f6;font-family:Arial,sans-serif;color:#111827}.container{max-width:980px;margin:auto;background:#fff;padding:22px;border-radius:14px;box-shadow:0 10px 25px rgba(0,0,0,.1);min-height:calc(100vh - 32px)}.top{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:4px}.logo{width:120px;height:120px;object-fit:contain}.official{border-left:4px solid #168fb3;padding-left:8px;color:#168fb3;justify-self:end;text-align:left}.official h2,.official h3{margin:2px 0;font-size:13px;line-height:1.4}.meta{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:4px;margin:14px 0 30px}.date{color:#168fb3;font-weight:bold;font-size:12px}.user{grid-column:2;background:#fff;border:1px solid #e5e7eb;border-radius:8px;box-shadow:0 2px 6px rgba(0,0,0,.06);height:32px;width:220px;display:flex;align-items:center;justify-content:center;gap:4px;color:#168fb3;font-size:13px;font-weight:bold}.user .back{order:3;margin-left:auto;color:#168fb3;text-decoration:none}.user .logout{order:1;cursor:pointer;border:0;background:none;color:#168fb3}.lang{grid-column:3;justify-self:end;border:0;background:none;color:#168fb3;font-weight:bold;cursor:pointer}.title{text-align:center;color:#168fb3;font-size:23px;margin:18px 0 30px}.grid{position:relative;display:grid;grid-template-columns:repeat(2,minmax(0,240px));grid-template-rows:116px;justify-content:center;gap:4px;max-width:520px;margin:auto}.grid:before{content:"";position:absolute;left:50%;top:50%;width:54px;height:54px;transform:translate(-50%,-50%);background:url('outpatient-pharmacy-icon.png') center/contain no-repeat;z-index:2;pointer-events:none}.card{height:116px;background:#168fb3;border:1px solid #168fb3;border-radius:10px;color:#fff;text-decoration:none;display:flex;align-items:center;justify-content:center;text-align:center;font-size:16px;font-weight:bold;padding:14px;box-shadow:0 4px 10px rgba(0,0,0,.04)}.card:first-child{-webkit-mask:radial-gradient(circle 30px at 100% 50%,transparent 0 28px,#000 30px),linear-gradient(#000 0 0);-webkit-mask-composite:source-in;mask:radial-gradient(circle 30px at 100% 50%,transparent 0 28px,#000 30px),linear-gradient(#000 0 0);mask-composite:intersect}.card:last-child{-webkit-mask:radial-gradient(circle 30px at 0 50%,transparent 0 28px,#000 30px),linear-gradient(#000 0 0);-webkit-mask-composite:source-in;mask:radial-gradient(circle 30px at 0 50%,transparent 0 28px,#000 30px),linear-gradient(#000 0 0);mask-composite:intersect}@media(max-width:700px){.container{padding:14px;border-radius:0;min-height:100vh}.logo{width:84px;height:84px}.official h2,.official h3{font-size:12px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));width:min(100%,360px);grid-template-rows:104px}.card{height:104px;font-size:15px}.grid:before{width:44px;height:44px}.user{width:calc(100vw - 56px);max-width:calc(100vw - 56px)}}
</style></head><body><main class="container"><header class="top"><img class="logo" src="logo.png" alt="Logo"><div class="official"><h2 id="line1">Madinah Health Cluster</h2><h3 id="line2">King Fahad Hospital - Madinah</h3><h3 id="line3">Pharmaceutical Care Administration</h3></div><span></span></header><hr><div class="meta"><div class="date" id="date"></div><div class="user"><button class="logout" onclick="logout()">⏻</button><span id="name"></span><a class="back" href="pharmacy-medications.html">↩</a></div><button class="lang" onclick="toggleLanguage()">🌐 ع | E</button></div><h1 class="title" id="title">Expiry Dates</h1><section class="grid"><a class="card" href="expiry/kidney/dashboard.html?from=expiry-dates" id="indexCard">Expiry Index</a><a class="card" href="expiry/kidney/form.html?from=expiry-dates" id="formCard">Registration Form</a></section></main><script>
const API="https://script.google.com/macros/s/AKfycbzg9PCeoJQl0ifbng_aam6u5mTePD0872wqZ5ilZYqcFV9QypiyopulgPPyO3nqLpez/exec";let lang="en";function user(){try{return JSON.parse(sessionStorage.getItem("unifiedPortalUser")||"null")}catch(e){return null}}function ok(u,k){return u&&(u.isAdmin===true||u[k]===true)}async function boot(){const t=sessionStorage.getItem("unifiedPortalSessionToken"),u=user();if(!t||!u){location.replace("index.html");return}document.getElementById("name").textContent=u.name||u.username||"";try{const r=await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"validateSession",sessionToken:t,service:""})}).then(x=>x.json());if(!r.success){location.replace("index.html");return}const v=r.user;document.getElementById("name").textContent=v.name||v.username||"";document.getElementById("indexCard").style.display=ok(v,"kidneyExpiryDashboardAccess")?"flex":"none";document.getElementById("formCard").style.display=ok(v,"kidneyExpiryRegisterAccess")?"flex":"none"}catch(e){}}function logout(){sessionStorage.clear();location.replace("index.html")}function toggleLanguage(){lang=lang==="en"?"ar":"en";document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";document.getElementById("title").textContent=lang==="ar"?"تواريخ الانتهاء":"Expiry Dates";document.getElementById("indexCard").textContent=lang==="ar"?"مؤشر الانتهاء":"Expiry Index";document.getElementById("formCard").textContent=lang==="ar"?"نموذج التسجيل":"Registration Form";document.getElementById("line1").textContent=lang==="ar"?"تجمع المدينة المنورة الصحي":"Madinah Health Cluster";document.getElementById("line2").textContent=lang==="ar"?"مستشفى الملك فهد بالمدينة المنورة":"King Fahad Hospital - Madinah";document.getElementById("line3").textContent=lang==="ar"?"إدارة الرعاية الصيدلانية":"Pharmaceutical Care Administration";renderDate()}function renderDate(){const n=new Date(),d=new Intl.DateTimeFormat("en-CA",{timeZone:" </script></body></html>
