<script>document.addEventListener('DOMContentLoaded',function(){var reset=document.getElementById('reset');if(!reset)return;var backdrop=document.createElement('div');backdrop.className='reset-modal-backdrop';backdrop.innerHTML='<div class="reset-modal" role="dialog" aria-modal="true" aria-labelledby="resetModalTitle" aria-describedby="resetModalText"><div class="reset-modal-icon" aria-hidden="true">⚠</div><h2 id="resetModalTitle">CONFIRM RESET</h2><p id="resetModalText">Are you sure you want to reset the aggregation data? This action cannot be undone.</p><div class="reset-modal-actions"><button type="button" class="reset-modal-cancel">Cancel</button><button type="button" class="reset-modal-confirm">Reset</button></div></div>';document.body.appendChild(backdrop);var dialog=backdrop.querySelector('.reset-modal'),cancel=backdrop.querySelector('.reset-modal-cancel'),confirmButton=backdrop.querySelector('.reset-modal-confirm'),lastFocus=null,busy=false;function close(){if(busy)return;backdrop.classList.remove('is-open');if(lastFocus)lastFocus.focus()}function open(){lastFocus=document.activeElement;backdrop.classList.add('is-open');cancel.focus()}reset.onclick=function(){open()};cancel.onclick=close;backdrop.addEventListener('click',function(e){if(e.target===backdrop)close()});dialog.addEventListener('keydown',function(e){if(e.key==='Escape')close();if(e.key==='Tab'){var focusables=[cancel,confirmButton],idx=focusables.indexOf(document.activeElement);if(e.shiftKey&&idx<=0){e.preventDefault();focusables[1].focus()}else if(!e.shiftKey&&idx===1){e.preventDefault();focusables[0].focus()}}});confirmButton.onclick=function(){if(busy)return;busy=true;confirmButton.disabled=true;cancel.disabled=true;var nativeConfirm=window.confirm;window.confirm=function(){return true};try{resetTotals();backdrop.classList.remove('is-open');if(lastFocus)lastFocus.focus()}finally{window.confirm=nativeConfirm;busy=false;confirmButton.disabled=false;cancel.disabled=false}}});</script>

<script>
const API="https://script.google.com/macros/s/AKfycbwna5ifaRT46qMasogcUbjs6u15PtP7p6vwTNCtNqtQi0Kn8FR6JLtjeborWXNPb4Hz/exec";
let lang="en",user=null,allowed=[];
const token=()=>sessionStorage.getItem("unifiedPortalSessionToken")||"";
const api=(action,data)=>fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(Object.assign({action:action,sessionToken:token()},data||{}))}).then(r=>r.json());
const esc=v=>String(v==null?"":v).replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
 function render(){document.getElementById("name").textContent=user&&(user.name||user.username)||"";document.getElementById("title").textContent=lang==="ar"?"تجميع الطلبيات":"Order Aggregation";document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";const parts=new Intl.DateTimeFormat("en-US",{timeZone:"Asia/Riyadh",weekday:"long",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date()).reduce((out,part)=>{out[part.type]=part.value;return out},{});document.getElementById("date").textContent=parts.weekday+" - "+parts.year+"-"+parts.month+"-"+parts.day}
 function loadSummary(){const scope=document.getElementById("summaryScope").value;if(!scope)return;api("approvedOrderReport",{pharmacy:scope==="all"?"":scope}).then(r=>{if(!r.success)throw Error(r.code||"REPORT_FAILED");document.getElementById("body").innerHTML=(r.items||[]).map(i=>"<tr><td>"+esc(i.medicationName||"-")+"</td><td>"+Number(i.kidney||0)+"</td><td>"+Number(i.diabetes||0)+"</td><td>"+Number(i.outpatient||0)+"</td><td>"+Number(i.mail||0)+"</td><td>"+Number(i.grandTotal||0)+"</td></tr>").join("");const issueCodes=[...new Set((r.issues||[]).map(x=>x.code).filter(Boolean))];document.getElementById("message").textContent=issueCodes.length?(lang==="ar"?"سجلات تحتاج إلى مراجعة: ":"Some records require review: ")+issueCodes.join(", "):r.items&&r.items.length?"":"No approved dispensed quantities in the active period."}).catch(e=>document.getElementById("message").textContent="Could not load summary ("+esc(e.message)+" ).")}
 function renderCloseReport(r,scope){const rows=(r.items||[]).map(i=>"<tr><td>"+esc(i.medicationName)+"</td><td>"+Number(i.kidney||0)+"</td><td>"+Number(i.diabetes||0)+"</td><td>"+Number(i.outpatient||0)+"</td><td>"+Number(i.mail||0)+"</td><td>"+Number(i.grandTotal||0)+"</td><td>"+esc((i.orders||[]).join(", "))+"</td></tr>").join("");const w=window.open("","_blank");if(!w){document.getElementById("message").textContent="Archive completed ("+esc(r.archiveId)+"). Allow pop-ups to print the report.";return}w.document.open();w.document.write("<!doctype html><html><head><title>Approved Dispensed Quantities</title><style>body{font-family:Arial;padding:24px;color:#18324b}h1{color:#168fb3}table{width:100%;border-collapse:collapse}th,td{border:1px solid #cbd5e1;padding:8px;text-align:left}th{background:#168fb3;color:#fff}</style></head><body><h1>Approved Dispensed Quantities</h1><p><strong>Pharmacy:</strong> "+esc(scope)+"</p><p><strong>Archive:</strong> "+esc(r.archiveId)+"</p><table><thead><tr><th>Medication</th><th>KC</th><th>DM</th><th>OP</th><th>MP</th><th>Grand Total</th><th>Orders</th></tr></thead><tbody>"+rows+"</tbody></table></body></html>");w.document.close();w.focus();setTimeout(function(){w.print();},100)}
 function resetTotals(){const scope=document.getElementById("summaryScope").value;if(!scope||!confirm("Close the approved period and prepare the report? Historical orders remain unchanged."))return;api("closeApprovedPeriod",{pharmacy:scope==="all"?"":scope,periodStart:"",periodEnd:"",idempotencyKey:crypto.randomUUID?crypto.randomUUID():String(Date.now())}).then(r=>{if(!r.success){const issueCodes=[...new Set((r.issues||[]).map(x=>x.code).filter(Boolean))];throw Error((r.code||"CLOSE_FAILED")+(issueCodes.length?": "+issueCodes.join(", "):""))}document.getElementById("message").textContent="Archive completed: "+r.archiveId;renderCloseReport(r,scope);loadSummary()}).catch(e=>document.getElementById("message").textContent="Close failed ("+esc(e.message)+")")}
function boot(){if(!token()){location.replace("index.html");return}api("validateSession",{service:""}).then(r=>{if(!r.success||!r.user)throw Error("INVALID_SESSION");user=r.user;allowed=["kidney","diabetes","outpatient","mail"].filter(p=>user.isAdmin===true||user[p+"OrderAccess"]===true);const s=document.getElementById("summaryScope");s.innerHTML=allowed.map(p=>'<option value="'+p+'">'+(p==="mail"?"Mail Pharmacy (MP)":p.charAt(0).toUpperCase()+p.slice(1)+" Pharmacy")+'</option>').join("");if(user.isAdmin===true)s.insertAdjacentHTML("beforeend",'<option value="all">All Pharmacies</option>');if(!s.options.length)throw Error("NO_PERMISSION");s.value=user.isAdmin===true?"all":allowed[0];render();loadSummary()}).catch(()=>location.replace("index.html"))}
 document.getElementById("reset").onclick=resetTotals;document.getElementById("summaryScope").onchange=loadSummary;document.getElementById("logout").onclick=()=>{sessionStorage.removeItem("unifiedPortalSessionToken");sessionStorage.removeItem("unifiedPortalUser");location.replace("index.html")};document.getElementById("lang").onclick=()=>{lang=lang==="en"?"ar":"en";render()};render();boot();</script>
<style id="official-signature-style">.developer-signature{max-width:760px;margin:28px auto 8px;padding:0 12px;text-align:center;line-height:1.5;font-family:inherit}.developer-signature .signature-unit,.developer-signature .signature-author{display:block;margin:0;font-size:11px;font-weight:400;white-space:normal}.developer-signature .signature-unit{color:#64748b}.developer-signature .signature-author{margin-top:2px;color:#168fb3;font-weight:600}@media(max-width:600px){.developer-signature{margin-top:22px;padding:0 8px}.developer-signature .signature-unit,.developer-signature .signature-author{font-size:10px}}</style><script>(function(){var container=document.querySelector('.container');if(container&&!container.querySelector('.developer-signature')){var footer=document.createElement('footer');footer.className='developer-signature';footer.setAttribute('aria-label','Project signature');footer.innerHTML='<span class="signature-unit">Pharmacy Services - Outpatient Pharmacy</span><span class="signature-author">Developed by Abdullah Alattas</span>';container.appendChild(footer);}})();</script></body></html>
