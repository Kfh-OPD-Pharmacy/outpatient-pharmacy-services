<style>[hidden]{display:none!important} #periodNav button[aria-pressed="true"]{background:#168fb3;color:white}</style></head><body><main class="container"><div class="top-bar"><img class="logo" src="logo.png" alt="Logo"><div class="official-header"><h2 id="line1">Madinah Health Cluster</h2><h3 id="line2">King Fahad Hospital - Madinah</h3><h3 id="line3">Pharmaceutical Care Administration</h3></div></div><hr><div class="meta"><div class="date" id="date"></div><div class="user"><button id="logout" aria-label="Logout">⏻</button><span id="name"></span><a href="pharmacy-medications.html" aria-label="Back">↩</a></div><button class="lang" id="lang">🌐 ع | E</button></div><h1 class="title" id="title">Order Aggregation</h1><section class="panel"><div class="toolbar"><select id="summaryScope" disabled></select><button id="startEntry" type="button" disabled>Start Entry</button><button id="reset" type="button" disabled>⟳ Reset</button><input id="aggregationSearch" type="search" autocomplete="off" placeholder="Search medication"><span id="searchCount" class="aggregation-search-count"></span></div><div class="toolbar" id="periodNav" style="margin-top:12px" hidden><button type="button" data-entry-view="current">Current Period</button><button type="button" data-entry-view="next">Next Period</button></div><div class="message" id="message"></div><table class="summary-table"><thead><tr><th>Medication</th><th>KC</th><th>DM</th><th>OP</th><th>MP</th><th>Grand Total</th></tr></thead><tbody id="body"></tbody></table></section></main><div class="aggregation-details-backdrop" id="aggregationDetailsModal" role="presentation"><section class="aggregation-details-modal" role="dialog" aria-modal="true" aria-labelledby="aggregationDetailsTitle"><div class="aggregation-details-head"><h2 id="aggregationDetailsTitle"></h2><button class="aggregation-details-close" id="aggregationDetailsClose" type="button" aria-label="Close">×</button></div><div class="aggregation-details-loading" id="aggregationDetailsLoading"></div><div id="aggregationDetailsContent" hidden><table class="aggregation-details-table"><thead><tr><th id="detailOrderHeader">Order No.</th><th id="detailPharmacyHeader">Pharmacy</th><th id="detailApprovalHeader">Approval Date</th><th id="detailQuantityHeader">Approved Dispensed Q</th></tr></thead><tbody id="aggregationDetailsBody"></tbody></table><div class="aggregation-details-total" id="aggregationDetailsTotal"></div></div></section></div>
<footer class="developer-signature" aria-label="Project signature"><span class="signature-unit">Pharmacy Services - Outpatient Pharmacy</span><span class="signature-author">Developed by Abdullah Alattas</span></footer>

<div class="reset-modal-backdrop" id="resetModal"><div class="reset-modal" role="dialog" aria-modal="true" aria-labelledby="resetModalTitle"><div class="reset-modal-icon" aria-hidden="true">⚠</div><h2 id="resetModalTitle">CONFIRM RESET</h2><p id="resetModalText"></p><div class="reset-modal-actions"><button type="button" class="reset-modal-cancel">Cancel</button><button type="button" class="reset-modal-confirm">Reset</button></div></div></div>

<script>
const API="https://script.google.com/macros/s/AKfycbwna5ifaRT46qMasogcUbjs6u15PtP7p6vwTNCtNqtQi0Kn8FR6JLtjeborWXNPb4Hz/exec";
let lang="en",user=null,allowed=[];
const token=()=>sessionStorage.getItem("unifiedPortalSessionToken")||"";
const api=(action,data)=>fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(Object.assign({action:action,sessionToken:token()},data||{}))}).then(r=>r.json());
const esc=v=>String(v==null?"":v).replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
const $=id=>document.getElementById(id);
const scope=$('summaryScope'), tbody=$('body'), start=$('startEntry'), reset=$('reset');
reset.remove();
const enteredHeader=document.createElement('th'), pendingLabel=document.createElement('label'), pendingOnly=document.createElement('input'), progress=document.createElement('div');
enteredHeader.id='enteredHeader';enteredHeader.hidden=true;document.querySelector('.summary-table thead tr').appendChild(enteredHeader);
pendingOnly.type='checkbox';pendingOnly.id='pendingOnly';pendingLabel.id='pendingOnlyLabel';pendingLabel.hidden=true;pendingLabel.append(pendingOnly,document.createTextNode(' Pending Only'));$('periodNav').appendChild(pendingLabel);
progress.id='entryProgress';progress.className='message';progress.hidden=true;$('message').after(progress);
const closeArchive=document.createElement('button'), closeModal=document.createElement('div');
closeArchive.id='closeArchive';closeArchive.type='button';closeArchive.disabled=true;closeArchive.hidden=true;closeArchive.textContent='Close & Archive';start.after(closeArchive);
const historyButton=document.createElement('button'),historyModal=document.createElement('div');historyButton.id='historyButton';historyButton.type='button';historyButton.textContent='History';closeArchive.after(historyButton);historyModal.className='aggregation-details-backdrop';historyModal.id='historyModal';historyModal.innerHTML='<section class="aggregation-details-modal" role="dialog" aria-modal="true"><div class="aggregation-details-head"><h2 id="historyTitle">History</h2><button class="aggregation-details-close" id="historyClose" type="button">×</button></div><div class="toolbar"><input id="historyQuery" type="search" placeholder="Period or pharmacy"><input id="historyFrom" type="date"><input id="historyTo" type="date"></div><div id="historyBody"></div></section>';document.body.appendChild(historyModal);
closeModal.id='closeArchiveModal';closeModal.className='reset-modal-backdrop';closeModal.innerHTML='<div class="reset-modal" role="dialog" aria-modal="true"><h2 id="closeArchiveTitle">CLOSE & ARCHIVE</h2><p id="closeArchiveText"></p><div class="reset-modal-actions"><button type="button" id="closeArchiveCancel" class="reset-modal-cancel">Cancel</button><button type="button" id="closeArchiveConfirm" class="reset-modal-confirm">Close & Archive</button></div></div>';document.body.appendChild(closeModal);
let state=null, view='next', fingerprint=null, generation=0, detailVersion=0, pending=null, ready=false, busy=false, timer=null, error='', notice='', savingProgress={};
const tr=(en,ar)=>lang==='ar'?ar:en;
const pharmacyArg=()=>scope.value==='all'?'':scope.value;
const pharmacyName=p=>({kidney:'KC',diabetes:'DM',outpatient:'OP',mail:'MP'}[p]||p||'-');
const key=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now())+'-'+Math.random();
function controls(){
  const locked=!ready||!state||busy||!!error||state.hasActive;
  start.disabled=locked||!state?.nextItems?.length;
  reset.disabled=locked||!state?.nextItems?.length;
  closeArchive.disabled=!ready||busy||!!error||scope.value==='all'||!state?.hasActive||view!=='current'||Object.keys(savingProgress).length>0||state?.entryProgress?.percent!==100;
  scope.disabled=!ready||busy;
  document.querySelector('.start-entry-confirm').disabled=start.disabled;
  document.querySelector('.reset-modal-confirm').disabled=reset.disabled;
  document.querySelector('.start-entry-cancel').disabled=busy;
  document.querySelector('.reset-modal-cancel').disabled=busy;
}
function filter(){
  const q=$('aggregationSearch').value.trim().toLowerCase();let n=0;
  tbody.querySelectorAll('tr[data-medication]').forEach(row=>{row.hidden=(!!q&&!row.dataset.medication.toLowerCase().includes(q))||(pendingOnly.checked&&row.dataset.entered==='true');if(!row.hidden)n++;});
  $('searchCount').textContent=q?n+tr(' matching items',' أصناف مطابقة'):'';
}
function renderState(){
  controls();
  $('periodNav').hidden=!state?.hasActive;
  if(!state)return;
  const active=state.hasActive&&view==='current', items=active?state.activeItems:state.nextItems;
  const source=active?'active':'next';
  const signature=JSON.stringify([scope.value,source,items,pendingOnly.checked,items.length?null:lang]);
  if(signature!==fingerprint){
    const scrollX=window.scrollX,scrollY=window.scrollY, panel=document.querySelector('.panel'), left=panel.scrollLeft;
    tbody.innerHTML=items.map(i=>{const ep=i.entryProgress||{}, editable=active&&scope.value!=='all', target=(ep.targets||[])[0]||'', parts=target.split('|');return `<tr data-medication="${esc(i.medicationName||'-')}" data-entered="${ep.entered===true}"><td><button type="button" class="medication-detail-button" data-entry-source="${source}" data-aggregation-key="${esc(i.aggregationKey||'')}">${esc(i.medicationName||'-')}</button></td>${['kidney','diabetes','outpatient','mail','grandTotal'].map(k=>`<td>${Number(i[k]||0)}</td>`).join('')}${active?`<td><input class="entry-checkbox" type="checkbox" data-period-id="${esc(parts[0]||'')}" data-aggregation-key="${esc(i.aggregationKey||'')}" ${ep.entered?'checked':''} ${editable?'':'disabled'}></td>`:''}</tr>`;}).join('')||`<tr><td colspan="${active?7:6}">${tr('No approved quantities.','لا توجد كميات معتمدة.')}</td></tr>`;
    fingerprint=signature;filter();panel.scrollLeft=left;window.scrollTo(scrollX,scrollY);
  }
  document.querySelectorAll('[data-entry-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.entryView===view)));
  enteredHeader.hidden=!active;pendingLabel.hidden=!active;progress.hidden=!active;
  closeArchive.hidden=!active;
  if(active){const p=state.entryProgress||{entered:0,total:items.length,percent:0};progress.innerHTML=esc(tr('Entry Progress: ','تقدم التسجيل: ')+p.entered+'/'+p.total+' ('+p.percent+'%)')+' <span role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+Number(p.percent||0)+'" style="display:inline-block;width:120px;height:8px;background:#e5e7eb;border-radius:4px;overflow:hidden;vertical-align:middle"><span style="display:block;width:'+Math.max(0,Math.min(100,Number(p.percent||0)))+'%;height:100%;background:#168fb3"></span></span>';}
  const periods=(state.activePeriods||[]).map(p=>p.id+' — '+p.startedAt).join(', ');
  const issues=[...new Set((state.issues||[]).map(x=>x.code).filter(Boolean))];
  $('message').textContent=error||notice||(state.hasActive?(active?tr('Entry in Progress: ','التسجيل جارٍ: '):tr('Next Period: ','الفترة القادمة: '))+periods:'')+(issues.length?' '+tr('Records require review: ','سجلات تحتاج مراجعة: ')+issues.join(', '):'');
}
async function loadSummary(){
  if(!ready||busy||Object.keys(savingProgress).length||!scope.value)return;
  if(pending)return pending;
  const g=generation, selected=scope.value;
  if(!state){tbody.innerHTML=`<tr class="summary-table-loading"><td colspan="6">${tr('Loading aggregation data…','جارٍ تحميل بيانات التجميع…')}</td></tr>`;}
  const task=(async()=>{
    try{
      const r=await api('getAggregationEntryState',{pharmacy:selected==='all'?'':selected});
      if(g!==generation)return;
      if(!r.success||typeof r.hasActive!=='boolean'||!Array.isArray(r.nextItems)||(r.hasActive&&!Array.isArray(r.activeItems)))throw Error(r.code||'STATE_FAILED');
      if(r.hasActive&&!state?.hasActive)view='current';
      if(!r.hasActive)view='next';
      state=r;error='';renderState();
    }catch(e){if(g!==generation)return;error=tr('Could not load aggregation state: ','تعذر تحميل حالة التجميع: ')+e.message; if(!state)tbody.innerHTML='';$('message').textContent=error;controls();}
  })();
  pending=task;
  try{await task;}finally{if(pending===task)pending=null;}
}
async function saveEntryProgress(box){

async function mutate(isStart){
  if((isStart?start:reset).disabled||busy)return;

  const storageKey=(isStart?'aggregationEntryRetry:':'aggregationResetRetry:')+selected;
  const requestKey=sessionStorage.getItem(storageKey)||key();sessionStorage.setItem(storageKey,requestKey);
  busy=true;generation++;pending=null;controls();notice='';
  try{
    if(!isStart)throw Error('LEGACY_RESET_DISABLED');const r=await api('startAggregationEntry',{pharmacy,idempotencyKey:requestKey});

}
