<!doctype html>
<html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Order Aggregation</title>
<style>body{margin:0;padding:10px;background:#f3f4f6;font-family:Arial,sans-serif;color:#111827}.container{max-width:980px;margin:auto;background:#fff;padding:22px;border-radius:14px;box-shadow:0 10px 25px rgba(0,0,0,.1)}.top-bar{display:flex;justify-content:space-between;direction:ltr}.logo{width:120px;height:120px;object-fit:contain;margin-top:-20px;margin-bottom:-28px}.official-header{padding-left:8px;border-left:4px solid #168fb3;direction:rtl;text-align:right;transform:translateY(14px)}.official-header h2,.official-header h3{margin:2px 0;font-size:13px;line-height:1.4;color:#168fb3}hr{border:0;border-top:1px solid #e5e7eb;margin:14px 0}.meta{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin:14px 0 38px}.date{color:#168fb3;font-weight:bold}.user{grid-column:2;width:220px;height:32px;display:flex;align-items:center;justify-content:center;gap:6px;color:#168fb3;border:1px solid #e5e7eb;border-radius:8px}.user button,.user a,.lang{border:0;background:none;color:#168fb3;cursor:pointer}.user span{flex:1;text-align:center}.lang{grid-column:3;justify-self:end}.title{text-align:center;color:#168fb3;font-size:23px;margin:18px 0 30px}.panel{max-width:760px;margin:auto;padding:16px;border:1px solid #e5e7eb;border-radius:10px}.toolbar{display:flex;gap:8px;justify-content:center}.toolbar select,.toolbar button{min-height:36px;border:1px solid #168fb3;border-radius:6px;background:#fff}.message{text-align:center;color:#168fb3;font-weight:bold;margin-top:10px}.summary-table{width:100%;border-collapse:collapse;margin-top:14px}.summary-table th,.summary-table td{border:1px solid #e5e7eb;padding:8px;text-align:center}.summary-table th{background:#168fb3;color:#fff}@media(max-width:700px){.container{padding:14px}.logo{width:84px;height:84px}.official-header{transform:translateY(10px)}.official-header h2,.official-header h3{font-size:12px}.user{width:calc(100vw - 56px)}}
</style></head><body><main class="container"><div class="top-bar"><img class="logo" src="logo.png" alt="Logo"><div class="official-header"><h2 id="line1">Madinah Health Cluster</h2><h3 id="line2">King Fahad Hospital - Madinah</h3><h3 id="line3">Pharmaceutical Care Administration</h3></div></div><hr><div class="meta"><div class="date" id="date"></div><div class="user"><button id="logout" aria-label="Logout">⏻</button><span id="name"></span><a href="pharmacy-medications.html" aria-label="Back">↩</a></div><button class="lang" id="lang">🌐 ع | E</button></div><h1 class="title" id="title">Order Aggregation</h1><section class="panel"><div class="toolbar"><select id="summaryScope"></select><button id="refresh" type="button">↻</button><button id="reset" type="button">⟳</button></div><div class="message" id="message"></div><table class="summary-table"><thead><tr><th>Medication</th><th>Kidney</th><th>Diabetes</th><th>Outpatient</th><th>Grand Total</th></tr></thead><tbody id="body"></tbody></table></section></main>
<style id="official-portal-header">
  .top-bar{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:8px;direction:ltr}
  .logo{width:120px;height:120px;object-fit:contain;margin:0}
  .official-header{width:fit-content;max-width:100%;display:flex;align-items:stretch;direction:ltr;text-align:left;transform:translateY(14px);padding-left:8px;border-left:4px solid #168fb3}
  .official-header h2,.official-header h3{margin:2px 0;font-size:13px;line-height:1.4;color:#168fb3;text-align:left}
  .meta{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:12px;margin:14px 0 14px;direction:ltr}
  .date{grid-column:1;justify-self:start;color:#168fb3;font-weight:bold}
  .user{grid-column:2;justify-self:center;width:220px;height:32px;min-height:32px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;gap:4px;padding:2px 4px;color:#168fb3;background:#fff;border:1px solid #e5e7eb;border-radius:8px;box-shadow:0 2px 6px rgba(0,0,0,.06)}
  .user button,.user a{width:27px;height:27px;min-width:27px;display:inline-flex;align-items:center;justify-content:center;padding:0;border:0;background:transparent;color:#168fb3;cursor:pointer;flex:0 0 27px}
  .user span{flex:1;min-width:0;text-align:center;white-space:nowrap}
  .lang{grid-column:3;justify-self:end;border:0;background:transparent;color:#168fb3;cursor:pointer}
  @media(max-width:700px){.logo{width:84px;height:84px}.official-header{transform:translateY(10px)}.official-header h2,.official-header h3{font-size:12px}.meta{gap:4px;margin:12px 0 12px}.user{width:calc(100vw - 56px);max-width:calc(100vw - 56px)}}
</style>
<script>
const API="https://script.google.com/macros/s/AKfycbwna5ifaRT46qMasogcUbjs6u15PtP7p6vwTNCtNqtQi0Kn8FR6JLtjeborWXNPb4Hz/exec";
let lang="en",user=null,allowed=[];
const token=()=>sessionStorage.getItem("unifiedPortalSessionToken")||"";
const api=(action,data)=>fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(Object.assign({action:action,sessionToken:token()},data||{}))}).then(r=>r.json());
const esc=v=>String(v==null?"":v).replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
function render(){document.getElementById("name").textContent=user&&(user.name||user.username)||"";document.getElementById("title").textContent=lang==="ar"?"تجميع الطلبيات":"Order Aggregation";document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";document.getElementById("date").textContent=new Intl.DateTimeFormat(lang==="ar"?"ar-SA":"en-US",{timeZone:"Asia/Riyadh",dateStyle:"medium"}).format(new Date())}
function loadSummary(){const scope=document.getElementById("summaryScope").value;if(!scope)return;api("orderReport",{pharmacy:scope==="all"?"":scope}).then(r=>{if(!r.success)throw Error(r.code||"REPORT_FAILED");document.getElementById("body").innerHTML=(r.items||[]).map(i=>"<tr><td>"+esc(i.medicationName||i.medicationId||"-")+"</td><td>"+Number(i.kidney||0)+"</td><td>"+Number(i.diabetes||0)+"</td><td>"+Number(i.outpatient||0)+"</td><td>"+Number(i.grandTotal||0)+"</td></tr>").join("");document.getElementById("message").textContent=r.items&&r.items.length?"":"No submitted orders in the active period."}).catch(e=>document.getElementById("message").textContent="Could not load summary ("+esc(e.message)+").")}
function resetTotals(){const scope=document.getElementById("summaryScope").value;if(!scope||!confirm("Reset totals? Historical orders remain unchanged."))return;api("resetOrderPeriod",{pharmacy:scope==="all"?"":scope,idempotencyKey:crypto.randomUUID?crypto.randomUUID():String(Date.now())}).then(r=>{if(!r.success)throw Error(r.code||"RESET_FAILED");loadSummary()}).catch(e=>document.getElementById("message").textContent="Reset failed ("+esc(e.message)+")")}
function boot(){if(!token()){location.replace("index.html");return}api("validateSession",{service:""}).then(r=>{if(!r.success||!r.user)throw Error("INVALID_SESSION");user=r.user;allowed=["kidney","diabetes","outpatient"].filter(p=>user.isAdmin===true||user[p+"OrderAccess"]===true);const s=document.getElementById("summaryScope");s.innerHTML=allowed.map(p=>'<option value="'+p+'">'+p.charAt(0).toUpperCase()+p.slice(1)+' Pharmacy</option>').join("");if(user.isAdmin===true)s.insertAdjacentHTML("beforeend",'<option value="all">All Pharmacies</option>');if(!s.options.length)throw Error("NO_PERMISSION");s.value=user.isAdmin===true?"all":allowed[0];render();loadSummary()}).catch(()=>location.replace("index.html"))}
document.getElementById("refresh").onclick=loadSummary;document.getElementById("reset").onclick=resetTotals;document.getElementById("summaryScope").onchange=loadSummary;document.getElementById("logout").onclick=()=>{sessionStorage.removeItem("unifiedPortalSessionToken");sessionStorage.removeItem("unifiedPortalUser");location.replace("index.html")};document.getElementById("lang").onclick=()=>{lang=lang==="en"?"ar":"en";render()};render();boot();
</script></body></html>
