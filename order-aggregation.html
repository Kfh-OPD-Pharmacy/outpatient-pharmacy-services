  .user{grid-column:2;justify-self:center;width:220px;height:32px;min-height:32px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;gap:4px;padding:2px 4px;color:#168fb3;background:#fff;border:1px solid #e5e7eb;border-radius:8px;box-shadow:0 2px 6px rgba(0,0,0,.06)}
  .user button,.user a{width:27px;height:27px;min-width:27px;display:inline-flex;align-items:center;justify-content:center;padding:0;margin:0;border:0;background:transparent;color:#168fb3;cursor:pointer;flex:0 0 27px;font-size:19px;line-height:1;text-decoration:none}
  .user button:hover,.user a:hover,.user button:focus-visible,.user a:focus-visible{background:rgba(22,143,179,.08);border-radius:6px;outline:2px solid rgba(22,143,179,.35);outline-offset:1px}
  .user span{flex:1;min-width:0;text-align:center;white-space:nowrap;font-family:Arial,sans-serif;font-size:13px;font-weight:700;line-height:1.1;color:#168fb3}
  .lang{grid-column:3;justify-self:end;border:0;background:transparent;color:#168fb3;cursor:pointer}
  @media(max-width:700px){body{padding:10px;background:#fff}.container{padding:14px;border-radius:0;box-shadow:none;min-height:100vh}.logo{width:84px;height:84px;margin-top:-12px;margin-bottom:-20px}.official-header{transform:none}.official-header h2,.official-header h3{font-size:12px;white-space:normal}.top-bar + hr{margin-top:12px;margin-bottom:12px}.meta{gap:4px;margin:12px 0 12px}.user{width:calc(100vw - 56px);max-width:calc(100vw - 56px)}}
</style>
<script>
const API="https://script.google.com/macros/s/AKfycbwna5ifaRT46qMasogcUbjs6u15PtP7p6vwTNCtNqtQi0Kn8FR6JLtjeborWXNPb4Hz/exec";
let lang="en",user=null,allowed=[];
const token=()=>sessionStorage.getItem("unifiedPortalSessionToken")||"";
const api=(action,data)=>fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(Object.assign({action:action,sessionToken:token()},data||{}))}).then(r=>r.json());
const esc=v=>String(v==null?"":v).replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
let aggregationDetailsRequestVersion=0;
let aggregationSummaryRequestVersion=0;
const pharmacyName=p=>({kidney:"KC",diabetes:"DM",outpatient:"OP",mail:"MP"}[p]||p||"-");
function detailLabels(){const ar=lang==="ar";document.getElementById("detailOrderHeader").textContent=ar?"رقم الطلب":"Order No.";document.getElementById("detailPharmacyHeader").textContent=ar?"الصيدلية":"Pharmacy";document.getElementById("detailApprovalHeader").textContent=ar?"تاريخ الاعتماد":"Approval Date";document.getElementById("detailQuantityHeader").textContent=ar?"الكمية المصروفة المعتمدة":"Approved Dispensed Q";document.getElementById("aggregationDetailsClose").setAttribute("aria-label",ar?"إغلاق":"Close")}
function formatApprovalDate(value){if(!value)return "-";const d=new Date(value);return Number.isNaN(d.getTime())?esc(value):new Intl.DateTimeFormat(lang==="ar"?"ar-SA":"en-GB",{dateStyle:"medium",timeStyle:"short",timeZone:"Asia/Riyadh"}).format(d)}
function closeAggregationDetails(){aggregationDetailsRequestVersion++;document.getElementById("aggregationDetailsModal").classList.remove("is-open")}
function openAggregationDetails(aggregationKey,medicationName){const requestVersion=++aggregationDetailsRequestVersion,modal=document.getElementById("aggregationDetailsModal"),loading=document.getElementById("aggregationDetailsLoading"),content=document.getElementById("aggregationDetailsContent"),title=document.getElementById("aggregationDetailsTitle"),body=document.getElementById("aggregationDetailsBody"),total=document.getElementById("aggregationDetailsTotal"),scope=document.getElementById("summaryScope").value,isCurrent=()=>requestVersion===aggregationDetailsRequestVersion&&modal.classList.contains("is-open");detailLabels();title.textContent=medicationName||"-";body.innerHTML="";total.textContent="";modal.classList.add("is-open");loading.hidden=false;loading.textContent=lang==="ar"?"جارٍ تحميل التفاصيل…":"Loading details…";content.hidden=true;api("approvedOrderDetails",{pharmacy:scope==="all"?"":scope,aggregationKey:aggregationKey}).then(r=>{if(!isCurrent())return;if(!r.success)throw Error(r.code||"DETAILS_FAILED");const detailTotal=(r.details||[]).reduce((sum,row)=>sum+Number(row.approvedDispensedQuantity||0),0);if(detailTotal!==Number(r.grandTotal))throw Error("DETAIL_TOTAL_MISMATCH");title.textContent=r.medicationName||medicationName||"-";body.innerHTML=(r.details||[]).map(row=>"<tr><td>"+esc(row.orderNo)+"</td><td>"+esc(pharmacyName(row.pharmacy))+"</td><td>"+formatApprovalDate(row.approvalDate)+"</td><td>"+Number(row.approvedDispensedQuantity||0)+"</td></tr>").join("");total.textContent=(lang==="ar"?"الإجمالي العام: ":"Grand Total: ")+Number(r.grandTotal);loading.hidden=true;content.hidden=false}).catch(e=>{if(!isCurrent())return;body.innerHTML="";total.textContent="";content.hidden=true;loading.hidden=false;loading.textContent=(lang==="ar"?"تعذر تحميل التفاصيل: ":"Could not load details: ")+e.message})}
 function render(){document.getElementById("name").textContent=user&&(user.name||user.username)||"";document.getElementById("title").textContent=lang==="ar"?"تجميع الطلبيات":"Order Aggregation";document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";const parts=new Intl.DateTimeFormat("en-US",{timeZone:"Asia/Riyadh",weekday:"long",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date()).reduce((out,part)=>{out[part.type]=part.value;return out},{});document.getElementById("date").textContent=parts.weekday+" - "+parts.year+"-"+parts.month+"-"+parts.day}
 function loadSummary(options){const scope=document.getElementById("summaryScope").value;if(!scope)return Promise.resolve();const requestVersion=++aggregationSummaryRequestVersion,body=document.getElementById("body"),message=document.getElementById("message"),showLoading=!(options&&options.silent),isCurrent=()=>requestVersion===aggregationSummaryRequestVersion;if(showLoading){body.innerHTML="<tr class=\"summary-table-loading\"><td colspan=\"6\">"+(lang==="ar"?"جارٍ تحميل بيانات التجميع…":"Loading aggregation data…")+"</td></tr>";message.textContent=""}return api("approvedOrderReport",{pharmacy:scope==="all"?"":scope}).then(r=>{if(!isCurrent())return;if(!r.success)throw Error(r.code||"REPORT_FAILED");body.innerHTML=(r.items||[]).map(i=>"<tr><td><button type=\"button\" class=\"medication-detail-button\" data-aggregation-key=\""+esc(i.aggregationKey||"")+"\">"+esc(i.medicationName||"-")+"</button></td><td>"+Number(i.kidney||0)+"</td><td>"+Number(i.diabetes||0)+"</td><td>"+Number(i.outpatient||0)+"</td><td>"+Number(i.mail||0)+"</td><td>"+Number(i.grandTotal||0)+"</td></tr>").join("");const issueCodes=[...new Set((r.issues||[]).map(x=>x.code).filter(Boolean))];message.textContent=issueCodes.length?(lang==="ar"?"سجلات تحتاج إلى مراجعة: ":"Some records require review: ")+issueCodes.join(", "):r.items&&r.items.length?"":"No approved dispensed quantities in the active period."}).catch(e=>{if(!isCurrent())return;if(showLoading)body.innerHTML="";message.textContent="Could not load summary ("+esc(e.message)+" )."})}
 function renderCloseReport(r,scope){const rows=(r.items||[]).map(i=>"<tr><td>"+esc(i.medicationName)+"</td><td>"+Number(i.kidney||0)+"</td><td>"+Number(i.diabetes||0)+"</td><td>"+Number(i.outpatient||0)+"</td><td>"+Number(i.mail||0)+"</td><td>"+Number(i.grandTotal||0)+"</td><td>"+esc((i.orders||[]).join(", "))+"</td></tr>").join("");const w=window.open("","_blank");if(!w){document.getElementById("message").textContent="Archive completed ("+esc(r.archiveId)+"). Allow pop-ups to print the report.";return}w.document.open();w.document.write("<!doctype html><html><head><title>Approved Dispensed Quantities</title><style>body{font-family:Arial;padding:24px;color:#18324b}h1{color:#168fb3}table{width:100%;border-collapse:collapse}th,td{border:1px solid #cbd5e1;padding:8px;text-align:left}th{background:#168fb3;color:#fff}</style></head><body><h1>Approved Dispensed Quantities</h1><p><strong>Pharmacy:</strong> "+esc(scope)+"</p><p><strong>Archive:</strong> "+esc(r.archiveId)+"</p><table><thead><tr><th>Medication</th><th>KC</th><th>DM</th><th>OP</th><th>MP</th><th>Grand Total</th><th>Orders</th></tr></thead><tbody>"+rows+"</tbody></table></body></html>");w.document.close();w.focus();setTimeout(function(){w.print();},100)}
 function resetTotals(){const scope=document.getElementById("summaryScope").value;if(!scope||!confirm("Close the approved period and prepare the report? Historical orders remain unchanged."))return;api("closeApprovedPeriod",{pharmacy:scope==="all"?"":scope,periodStart:"",periodEnd:"",idempotencyKey:crypto.randomUUID?crypto.randomUUID():String(Date.now())}).then(r=>{if(!r.success){const issueCodes=[...new Set((r.issues||[]).map(x=>x.code).filter(Boolean))];throw Error((r.code||"CLOSE_FAILED")+(issueCodes.length?": "+issueCodes.join(", "):""))}document.getElementById("message").textContent="Archive completed: "+r.archiveId;renderCloseReport(r,scope);loadSummary()}).catch(e=>document.getElementById("message").textContent="Close failed ("+esc(e.message)+")")}
function boot(){if(!token()){location.replace("index.html");return}api("validateSession",{service:""}).then(r=>{if(!r.success||!r.user)throw Error("INVALID_SESSION");user=r.user;allowed=["kidney","diabetes","outpatient","mail"].filter(p=>user.isAdmin===true||user[p+"OrderAccess"]===true);const s=document.getElementById("summaryScope");s.innerHTML=allowed.map(p=>'<option value="'+p+'">'+(p==="mail"?"Mail Pharmacy (MP)":p.charAt(0).toUpperCase()+p.slice(1)+" Pharmacy")+'</option>').join("");if(user.isAdmin===true)s.insertAdjacentHTML("beforeend",'<option value="all">All Pharmacies</option>');if(!s.options.length)throw Error("NO_PERMISSION");s.value=user.isAdmin===true?"all":allowed[0];render();requestAnimationFrame(loadSummary)}).catch(()=>location.replace("index.html"))}
 document.getElementById("reset").onclick=resetTotals;document.getElementById("summaryScope").onchange=loadSummary;document.getElementById("body").onclick=e=>{const button=e.target.closest(".medication-detail-button");if(button&&button.dataset.aggregationKey)openAggregationDetails(button.dataset.aggregationKey,button.textContent)};document.getElementById("aggregationDetailsClose").onclick=closeAggregationDetails;document.getElementById("aggregationDetailsModal").onclick=e=>{if(e.target===e.currentTarget)closeAggregationDetails()};document.addEventListener("keydown",e=>{if(e.key==="Escape")closeAggregationDetails()});document.getElementById("logout").onclick=()=>{sessionStorage.removeItem("unifiedPortalSessionToken");sessionStorage.removeItem("unifiedPortalUser");location.replace("index.html")};document.getElementById("lang").onclick=()=>{lang=lang==="en"?"ar":"en";render();detailLabels()};render();detailLabels();boot();</script>
<style id="official-signature-style">.developer-signature{max-width:760px;margin:28px auto 8px;padding:0 12px;text-align:center;line-height:1.5;font-family:inherit}.developer-signature .signature-unit,.developer-signature .signature-author{display:block;margin:0;font-size:11px;font-weight:400;white-space:normal}.developer-signature .signature-unit{color:#64748b}.developer-signature .signature-author{margin-top:2px;color:#168fb3;font-weight:600}@media(max-width:600px){.developer-signature{margin-top:22px;padding:0 8px}.developer-signature .signature-unit,.developer-signature .signature-author{font-size:10px}}</style><script>(function(){if(!document.body.querySelector('.developer-signature')){var footer=document.createElement('footer');footer.className='developer-signature';footer.setAttribute('aria-label','Project signature');footer.innerHTML='<span class="signature-unit">Pharmacy Services - Outpatient Pharmacy</span><span class="signature-author">Developed by Abdullah Alattas</span>';document.body.appendChild(footer);}})();</script></body></html>
