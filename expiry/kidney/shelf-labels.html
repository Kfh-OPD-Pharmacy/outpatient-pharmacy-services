<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Labels Generator</title>

<style>
*{box-sizing:border-box}

:root{
  --main:#168fb3;
  --main-dark:#0f7592;
  --border:#cbd5e1;
  --soft:#f8fafc;
  --text:#111827;
  --muted:#64748b;
  --label-width:125mm;
  --label-height:55mm;
}

body{
  font-family:Arial,sans-serif;
  background:#f3f4f6;
  margin:0;
  padding:16px;
  color:var(--main)
}

.container{
  max-width:980px;
  margin:auto;
  background:#fff;
  padding:22px;
  border-radius:14px;
  box-shadow:0 10px 25px rgba(0,0,0,.1);
  min-height:calc(100vh - 32px)
}

.top-bar{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
  margin-bottom:8px;
  direction:ltr
}

.logo{
  width:120px;
  height:120px;
  object-fit:contain
}

.official-header{
  width:fit-content;
  max-width:100%;
  transform:translateY(14px);
  border-left:4px solid var(--main)
}

html[dir="rtl"] .official-header{
  text-align:right;
  direction:rtl;
  padding-left:8px;
  padding-right:0
}

html[dir="ltr"] .official-header{
  text-align:left;
  direction:ltr;
  padding-left:6px;
  padding-right:0
}

.official-header h2,
.official-header h3{
  margin:2px 0;
  font-size:13px;
  line-height:1.4;
  color:var(--main)
}

hr{
  border:none;
  border-top:1px solid #e5e7eb;
  margin:14px 0
}

.meta-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:14px;
  direction:ltr
}

.date-box{
  color:var(--main);
  padding:4px 0;
  font-size:13px;
  font-weight:bold;
  text-align:center
}

.language-chip{
  color:var(--main);
  font-size:13px;
  font-weight:bold;
  padding:4px 0;
  white-space:nowrap;
  background:transparent;
  border:0;
  cursor:pointer;
  font-family:inherit
}

.title-row{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  margin:18px auto 22px;
  direction:rtl
}

.page-title{
  text-align:center;
  font-size:23px;
  font-weight:bold;
  margin:0;
  color:var(--main)
}

.back-button{
  width:34px;
  height:34px;
  margin:0;
  padding:0;
  border:0;
  background:transparent;
  color:var(--main);
  font-size:28px;
  line-height:1;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  font-family:Arial,sans-serif;
  flex:0 0 auto;
  text-decoration:none
}

.back-button:hover{
  color:var(--main-dark);
  transform:translateX(-1px)
}

.login-card,
.panel{
  background:#f9fafb;
  border:1px solid #e5e7eb;
  border-radius:8px;
  padding:16px
}

.login-card{
  max-width:300px;
  margin:16px auto 0
}

.app-layout{
  display:none
}

.grid{
  display:grid;
  grid-template-columns:minmax(260px, .9fr) minmax(320px, 1.1fr);
  gap:14px;
  align-items:start
}

label{
  font-weight:bold;
  display:block;
  margin-bottom:4px;
  color:var(--text);
  font-size:12px
}

input,
select,
textarea{
  width:100%;
  min-height:34px;
  padding:7px 9px;
  margin-bottom:10px;
  border:1px solid var(--border);
  border-radius:8px;
  font-size:13px;
  background:#fff;
  color:var(--text);
  font-family:inherit
}

input[type="number"]{
  text-align:center
}

.search-wrap{
  position:relative
}

.search-results{
  display:none;
  position:absolute;
  z-index:20;
  left:0;
  right:0;
  top:calc(100% - 8px);
  max-height:260px;
  overflow:auto;
  background:#fff;
  border:1px solid var(--border);
  border-radius:8px;
  box-shadow:0 10px 22px rgba(15,23,42,.14)
}

.search-option{
  width:100%;
  border:0;
  background:#fff;
  color:var(--text);
  padding:9px 10px;
  text-align:left;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  font-family:inherit;
  font-size:13px
}

.search-option:hover{
  background:#eef8fb
}

.search-option small{
  color:var(--muted);
  white-space:nowrap
}

.primary-btn,
.secondary-btn,
.danger-btn{
  min-width:36px;
  min-height:36px;
  border-radius:8px;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
  font-family:inherit;
  padding:7px 10px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  line-height:1
}

.primary-btn{
  border:1px solid var(--main);
  background:var(--main);
  color:#fff
}

.secondary-btn{
  border:1px solid var(--border);
  background:#fff;
  color:var(--main)
}

.danger-btn{
  border:1px solid #fecaca;
  background:#fff5f5;
  color:#b91c1c
}

.icon-btn{
  width:36px;
  height:36px;
  padding:0;
  font-size:18px
}

.primary-btn:hover,
.secondary-btn:hover,
.danger-btn:hover{
  filter:brightness(.98)
}

.primary-btn:disabled,
.secondary-btn:disabled{
  background:#e2e8f0;
  color:#64748b;
  border-color:#cbd5e1;
  cursor:not-allowed
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  align-items:center
}

.status{
  min-height:22px;
  margin-top:8px;
  font-size:12px;
  color:var(--muted)
}

.status.error{
  color:#b91c1c
}

.status.success{
  color:#15803d
}

.selection-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:10px
}

.selection-count{
  color:var(--main);
  font-weight:bold;
  font-size:13px
}

.select-all-btn{
  min-height:30px;
  padding:5px 10px;
  font-size:12px
}

.empty-note{
  color:var(--muted);
  font-size:13px;
  text-align:center;
  padding:18px 10px
}

.batch-list{
  display:flex;
  flex-direction:column;
  gap:10px
}

.batch-item{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:8px;
  padding:11px
}

.batch-row{
  display:grid;
  grid-template-columns:minmax(180px, 1fr) minmax(150px, .7fr) 82px auto;
  gap:8px;
  align-items:end
}

.batch-item-title{
  font-size:12px;
  color:var(--muted);
  margin:0 0 8px;
  direction:ltr;
  text-align:left
}

.size-row{
  display:grid;
  grid-template-columns:minmax(190px, 240px) 1fr;
  gap:10px;
  align-items:end;
  margin-bottom:12px
}

.preview-panel{
  margin-top:14px
}

.preview-title{
  color:var(--main);
  margin:0 0 10px;
  font-size:16px;
  text-align:center
}

.print-area{
  --label-width:125mm;
  --label-height:55mm;
  display:block;
  overflow:auto;
  padding:10px;
  background:#fff;
  border:1px dashed #dbe4ea;
  border-radius:8px
}

.labels-sheet{
  display:grid;
  grid-template-columns:repeat(auto-fill, var(--label-width));
  align-items:start;
  justify-content:center;
  gap:4mm 5mm;
  width:100%
}

.shelf-label{
  width:var(--label-width);
  height:var(--label-height);
  background:#fff;
  border:1px solid #dbe3e8;
  border-radius:2.5mm;
  padding:3mm;
  display:grid;
  grid-template-columns:auto minmax(0, 1fr) auto;
  grid-template-rows:1fr;
  align-items:center;
  gap:2mm;
  direction:ltr;
  break-inside:avoid;
  page-break-inside:avoid;
  overflow:hidden;
  color:#111827;
  -webkit-print-color-adjust:exact;
  print-color-adjust:exact
}

.label-main{
  grid-column:2;
  grid-row:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:.8mm;
  min-width:0;
  min-height:0;
  max-width:100%;
  width:100%;
  height:100%;
  text-align:center
}

.label-name{
  font-size:18px;
  line-height:1.08;
  font-weight:800;
  width:100%;
  max-width:100%;
  white-space:normal;
  overflow:visible;
  text-overflow:clip;
  overflow-wrap:break-word;
  word-break:normal;
  text-align:center
}

.medication-primary{
  white-space:nowrap;
  font-size:1em;
  font-weight:inherit
}

.medication-details{
  white-space:nowrap;
  font-size:.86em;
  font-weight:700
}

.label-name.extreme-name .medication-primary{
  white-space:normal;
  overflow-wrap:break-word;
  word-break:normal
}

.tall-man-segment{
  font-weight:900
}

.high-alert-badge{
  flex:0 0 auto;
  max-width:100%;
  padding:1mm 2mm;
  border-radius:2mm;
  background:#b91c1c;
  color:#fff;
  font-size:7pt;
  line-height:1;
  font-weight:800;
  white-space:nowrap;
  text-align:center;
  -webkit-print-color-adjust:exact;
  print-color-adjust:exact
}

.label-exp{
  grid-column:1;
  grid-row:1;
  align-self:center;
  justify-self:center;
  width:clamp(16mm, calc(var(--label-height) - 11mm), 27mm);
  height:clamp(16mm, calc(var(--label-height) - 11mm), 27mm);
  padding:2mm;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#fff;
  overflow:hidden
}

.label-qr{
  width:100%;
  height:100%;
  aspect-ratio:1 / 1;
  display:block;
  object-fit:contain;
  image-rendering:auto
}

.label-logo-wrap{
  grid-column:3;
  grid-row:1;
  display:flex;
  align-items:center;
  justify-content:center;
  min-width:0;
  width:clamp(17mm, calc(var(--label-height) - 10mm), 28mm);
  height:clamp(17mm, calc(var(--label-height) - 10mm), 28mm)
}

.label-logo{
  width:100%;
  height:100%;
  max-width:100%;
  max-height:100%;
  object-fit:contain
}

.login-result{
  min-height:22px;
  font-size:12px;
  margin-top:6px
}

.employee-strip{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:14px;
  margin:0 auto 14px;
  color:var(--main);
  font-size:18px;
  font-weight:bold
}

.power-btn{
  border:0;
  background:transparent;
  color:var(--main);
  font-size:28px;
  line-height:1;
  padding:0;
  cursor:pointer
}

.power-btn:hover{
  color:var(--main-dark)
}

@media (max-width:820px){
  body{padding:10px;background:#fff}
  .container{padding:14px;border-radius:0;box-shadow:none;min-height:100vh}
  .logo{width:84px;height:84px}
  .official-header{transform:translateY(10px)}
  .official-header h2,
  .official-header h3{font-size:12px}
  .page-title{font-size:20px}
  .grid{grid-template-columns:1fr}
  .batch-row{grid-template-columns:1fr}
  .size-row{grid-template-columns:1fr}
}

@page{
  size:A4 portrait;
  margin:5mm
}

@media print{
  *{
    -webkit-print-color-adjust:exact;
    print-color-adjust:exact
  }

  html,
  body{
    width:210mm;
    height:auto;
    min-height:0;
    background:#fff;
    margin:0;
    padding:0;
    overflow:visible
  }

  body *{
    visibility:hidden
  }

  .container,
  #appView,
  .preview-panel{
    display:block;
    width:auto;
    max-width:none;
    min-height:0;
    height:auto;
    margin:0;
    padding:0;
    border:0;
    border-radius:0;
    box-shadow:none;
    background:transparent
  }

  .top-bar,
  hr,
  .meta-row,
  .title-row,
  #loginView,
  .employee-strip,
  .size-row,
  .grid,
  .preview-title,
  .status{
    display:none !important
  }

  .print-area,
  .print-area *{
    visibility:visible
  }

  .print-area{
    position:static;
    width:200mm;
    min-height:0;
    height:auto;
    padding:0;
    margin:0 auto;
    border:0;
    border-radius:0;
    overflow:visible
  }

  .labels-sheet{
    display:grid;
    grid-template-columns:repeat(auto-fill, var(--label-width));
    justify-content:center;
    align-items:start;
    gap:4mm 5mm;
    width:200mm;
    margin-left:auto;
    margin-right:auto
  }

  .shelf-label{
    width:var(--label-width);
    height:var(--label-height);
    break-inside:avoid;
    page-break-inside:avoid
  }
}
/* PHASE B: unified login UI only */
#loginView.login-card{
  width:min(100%, 360px);
  max-width:360px;
  margin:18px auto 0;
  padding:18px;
  background:#f9fafb;
  border:1px solid #e5e7eb;
  border-radius:10px;
  box-shadow:0 12px 28px rgba(15,23,42,.08)
}
#loginView.login-card label{
  margin:0 0 6px;
  color:var(--main);
  font-size:14px;
  line-height:1.35
}
#loginView.login-card input{
  height:40px;
  padding:8px 10px;
  margin:0 0 12px;
  border:1px solid var(--border);
  border-radius:8px;
  background:#fff;
  color:var(--text);
  font-size:14px;
  font-family:inherit
}
#loginView.login-card input:focus{
  border-color:var(--main);
  outline:3px solid rgba(22,143,179,.12)
}
#loginView .primary-btn{
  min-width:120px;
  height:40px;
  border-radius:10px;
  font-size:14px
}
#loginView .primary-btn:disabled{
  background:#94a3b8;
  color:#fff;
  cursor:not-allowed;
  opacity:.85
}
#loginResult{
  margin-top:12px;
  padding:10px 12px;
  border-radius:8px;
  font-size:13px;
  line-height:1.5
}
@media (max-width:700px){
  #loginView.login-card{
    width:min(100%, 320px);
    padding:16px;
    margin-top:16px
  }
  #loginView .primary-btn{
    width:100%;
    min-width:0
  }
}

/* PHASE B-FIX: exact unified visual tokens only */
.container{
  max-width:980px;
  background:#fff;
  padding:22px;
  border-radius:14px;
  box-shadow:0 10px 25px rgba(0,0,0,.1)
}
.page-title{
  font-size:23px;
  font-weight:bold;
  margin:18px 0 12px
}
#loginView.login-card{
  width:100%;
  max-width:420px;
  padding:22px;
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:14px;
  box-shadow:0 8px 20px rgba(0,0,0,.08)
}
#loginView.login-card input{
  width:100%;
  height:44px;
  padding:8px 12px;
  border:1px solid #cbd5e1;
  border-radius:8px;
  font-size:14px;
  font-family:inherit;
  outline:none;
  box-sizing:border-box
}
#loginView.login-card input:focus{
  border-color:var(--main);
  box-shadow:0 0 0 2px rgba(22,143,179,.12);
  outline:none
}
#loginView .primary-btn{
  height:44px;
  min-height:44px;
  border-radius:8px;
  font-size:14px;
  font-weight:bold
}
@media (max-width:700px){
  .container{
    padding:14px;
    border-radius:0;
    box-shadow:none
  }
  #loginView.login-card{
    max-width:420px;
    padding:22px
  }
}


/* PHASE C: unified portal design system */
@media screen{
  body{
    background:#f3f4f6;
  }

  .container,
  .employee-shell{
    max-width:980px;
    margin:auto;
    background:#fff;
    padding:22px;
    border-radius:14px;
    box-shadow:0 10px 25px rgba(0,0,0,.1);
  }

  .logo,
  .official-logo{
    width:120px;
    height:120px;
    object-fit:contain;
  }

  .official-header h2,
  .official-header h3{
    margin:2px 0;
    color:#168fb3;
    font-size:13px;
    line-height:1.4;
  }

  hr,
  .official-divider{
    border-top-color:#e5e7eb;
    margin:14px 0;
  }

  .page-title,
  .employee-page-title{
    color:#168fb3;
    font-size:23px;
    font-weight:bold;
    line-height:1.25;
    margin:18px 0 12px;
    text-align:center;
  }

  .title-row{
    margin:18px 0 12px;
  }

  .panel,
  .toolbar,
  .empty-box,
  .order-panel,
  .size-row,
  .result-card,
  .upload-box,
  .users-form,
  .upload-standalone,
  .employee-toolbar,
  .upload-toolbar,
  .supervisor-panel,
  .user-summary-panel,
  .filter-panel,
  .filters-panel,
  .summary-card,
  .stat-card{
    background:#fff;
    border:1px solid #e5e7eb;
    border-radius:10px;
    box-shadow:0 4px 10px rgba(0,0,0,.04);
  }

  .portal-card,
  .service-card,
  .control-card,
  .pharmacy-card,
  .card-link{
    border-radius:10px;
    box-shadow:0 4px 10px rgba(0,0,0,.04);
  }

  input,
  select,
  textarea{
    min-height:40px;
    padding:8px 12px;
    border:1px solid #cbd5e1;
    border-radius:8px;
    font-size:14px;
    font-family:inherit;
    box-sizing:border-box;
  }

  input:focus,
  select:focus,
  textarea:focus{
    border-color:#168fb3;
    box-shadow:0 0 0 2px rgba(22,143,179,.12);
    outline:none;
  }

  .primary-btn,
  .secondary-btn,
  .action-btn,
  .ghost-btn,
  button[type="submit"]{
    min-height:40px;
    border-radius:8px;
    font-size:14px;
    font-weight:bold;
  }

  .actions,
  .form-actions,
  .login-actions,
  .card-actions,
  .row-actions,
  .scan-actions{
    gap:10px;
  }

  .table-wrap,
  .dashboard-table-wrap,
  .orders-table-wrap{
    overflow-x:auto;
    border-radius:10px;
  }

  table{
    border-collapse:collapse;
  }

  th{
    background:#168fb3;
    color:#fff;
    font-weight:bold;
  }

  th,
  td{
    border-color:#e5e7eb;
  }

  @media (max-width:700px){
    body{
      padding:10px;
      background:#fff;
    }

    .container,
    .employee-shell{
      padding:14px;
      border-radius:0;
      box-shadow:none;
    }

    .logo,
    .official-logo{
      width:84px;
      height:84px;
    }

    .official-header h2,
    .official-header h3{
      font-size:12px;
    }

    .page-title,
    .employee-page-title{
      font-size:20px;
      margin:16px 0 12px;
    }

    input,
    select,
    textarea{
      width:100%;
      font-size:13px;
    }
  }
}

/* Labels page visual-only refinements */
@media screen{
  .size-row{
    align-items:end;
  }

  .size-row > div:first-child select{
    margin-bottom:0;
  }

  .size-row .actions{
    align-self:end;
    align-items:center;
    height:34px;
  }

  #printAllBtn.icon-btn,
  #clearAllBtn.icon-btn{
    width:34px;
    height:34px;
    min-width:34px;
    min-height:34px;
    padding:0;
    border:0;
    background:transparent;
    box-shadow:none;
    color:var(--main);
  }

  #printAllBtn.icon-btn:hover,
  #clearAllBtn.icon-btn:hover{
    background:transparent;
    box-shadow:none;
    color:var(--main-dark);
    filter:none;
  }

  .container:has(#appView[style*="display: block"]) .title-row .back-button,
  .container:has(#appView[style*="display:block"]) .title-row .back-button{
    display:none;
  }

  .page-title{
    font-size:0;
  }

  .page-title::before{
    content:"Labels Generator";
    font-size:23px;
    font-weight:bold;
    line-height:1.25;
  }
}

@media screen and (max-width:700px){
  .size-row .actions{
    justify-content:center;
  }

  .page-title::before{
    font-size:20px;
  }
}
</style>
</head>

<body>
<div class="container">
  <div class="top-bar">
    <img class="logo" src="../../logo.png" alt="Logo">
    <div class="official-header">
      <h2 id="officialLine1">Madinah Health Cluster</h2>
      <h3 id="officialLine2">King Fahad Hospital - Madinah</h3>
      <h3 id="officialLine3">Pharmaceutical Care Administration</h3>
    </div>

function saveStoredSession(){
  sessionStorage.setItem(KIDNEY_SESSION_TOKEN_KEY, currentSessionToken);
  sessionStorage.setItem(KIDNEY_SESSION_NAME_KEY, currentEmployeeName);
  sessionStorage.setItem(KIDNEY_SESSION_USERNAME_KEY, currentEmployeeUsername);
}

function clearStoredSession(){
  localStorage.removeItem(KIDNEY_SESSION_TOKEN_KEY);
  localStorage.removeItem(KIDNEY_SESSION_NAME_KEY);
  localStorage.removeItem(KIDNEY_SESSION_USERNAME_KEY);
  sessionStorage.removeItem(KIDNEY_SESSION_TOKEN_KEY);
  sessionStorage.removeItem(KIDNEY_SESSION_NAME_KEY);
  sessionStorage.removeItem(KIDNEY_SESSION_USERNAME_KEY);
  currentEmployeeName = "";
  currentEmployeeUsername = "";
  currentSessionToken = "";
}

async function postApi(action, payload = {}, includeSession = true){
  const requestData = {
    action:action,
    ...payload
  };

  if (includeSession){
    currentSessionToken =
      sessionStorage.getItem(KIDNEY_SESSION_TOKEN_KEY) ||
      currentSessionToken;

    if (currentSessionToken){
      requestData.sessionToken = currentSessionToken;
      requestData.token = currentSessionToken;
    }
  }

  const response =
    await fetch(
      KIDNEY_API_URL,
      {
        method:"POST",
        headers:{
          "Content-Type":"text/plain;charset=utf-8"
        },
        body:JSON.stringify(requestData)
      }
    );

  if (!response.ok){
    throw new Error("HTTP_" + response.status);
  }

  return await response.json();
}

async function loginEmployee(){
  const username =
    document.getElementById("username").value.trim();
  const password =
    document.getElementById("password").value.trim();

  if (!username || !password){
    showLoginResult(text[currentLang].invalidLogin, "error");
    return;
  }

  try{
    const result =
      await postApi(
        "employeeLogin",
        {
          username:username,
          password:password,
          pin:password
        },
        false
      );

    if (!result.success || !result.employee || !result.sessionToken){
      showLoginResult(text[currentLang].invalidLogin, "error");
      return;
    }

    currentEmployeeName =
      result.employee.name ||
      result.employee.username ||
      username;
    currentEmployeeUsername =
      result.employee.username ||
      username;
    currentSessionToken =
      result.sessionToken;

    saveStoredSession();
    document.getElementById("password").value = "";
    clearLoginResult();
    showEmployeeView();
    await loadPageData();
  }catch(error){
    showLoginResult(text[currentLang].invalidLogin, "error");
  }
}

async function restoreSession(){
  currentSessionToken =
    sessionStorage.getItem(KIDNEY_SESSION_TOKEN_KEY) || "";
  currentEmployeeName =
    sessionStorage.getItem(KIDNEY_SESSION_NAME_KEY) || "";
  currentEmployeeUsername =
    sessionStorage.getItem(KIDNEY_SESSION_USERNAME_KEY) || "";

  if (!currentSessionToken){
    clearStoredSession();
    showLoginView();
    return;
  }

  try{
    const result =
      await postApi(
        "validateSession",
        {
          service:"kidney"
        },
        true
      );

    if (!result.success || !result.user){
      clearStoredSession();
      showLoginView();
      return;
    }

    currentEmployeeUsername =
      result.user.username ||
      currentEmployeeUsername;
    currentEmployeeName =
      result.user.name ||
      result.user.username ||
      currentEmployeeName;

    saveStoredSession();
    showEmployeeView();
    await loadPageData();
  }catch(error){
    clearStoredSession();
    showLoginView();
  }
}

function startInactivityWatcher(){
  resetInactivityTimer();

  if (inactivityWatcherStarted){
    return;
  }

  inactivityWatcherStarted =
    true;

  ["click", "keydown", "input", "mousemove", "touchstart"].forEach(
    function(eventName){
      document.addEventListener(
        eventName,
        resetInactivityTimer,
        {
          passive:true
        }
      );
    }
  );
}

  if (inactivityTimer){

async function loadCentralMedicationList(){
  const response =
    await fetch(
      CENTRAL_MEDICATIONS_API_URL +
      "?action=listMedications&service=kidney"
    );
  const data =
    await response.json();

  centralMedicationIdByName = {};

  if (data && data.success && Array.isArray(data.medications)){
    centralMedicationList =
      data.medications
        .map(function(item){
          const name =
            item && item.name
              ? String(item.name).trim()
              : "";

          if (name && item && item.id){
            centralMedicationIdByName[
              normalizeMedicationKey(name)
            ] = String(item.id).trim();
          }

          return name;
        })
        .filter(Boolean)
        .filter(function(name, index, list){
          return list.indexOf(name) === index;
        });
  }else{
    centralMedicationList = [];
  }
}

async function loadExpiryRecords(){
  const response =
    await fetch(
      KIDNEY_API_URL +
      "?action=dashboard"
    );
  const data =
    await response.json();

  expiryRecords =
    (
      data.items ||
      data.medications ||
      []
    ).map(function(item){
      return {
        name:String(
          item.medicationName ||
          item.name ||
          item.medication ||
          ""
        ).trim(),
        expiry:String(
          item.expiry ||
          item.expiryDate ||
          ""
        ).trim()
      };
    }).filter(function(item){
      return item.name && item.expiry;
    });
}

function getExpiryDatesForMedication(name){
  const medicationKey =
    normalizeMedicationKey(name);

  const dates =
    expiryRecords
      .filter(function(item){
        return normalizeMedicationKey(item.name) === medicationKey;
      })
      .map(function(item){
        return normalizeDate(item.expiry);
      })
      .filter(Boolean)
      .filter(function(date, index, list){
        return list.indexOf(date) === index;
      })
      .sort();

  return dates;
}

function normalizeMedicationKey(value){
  return String(value || "")
    .toLowerCase()
    .replace(/\s+/g, " ")
    .replace(/\s*([%/.,()+-])\s*/g, "$1")
    .replace(/(\d)\s+(mg|mcg|g|ml|l|iu|unit|units|%)/g, "$1$2")
    .replace(/\b(tablet|tablets|tab|tabs)\b/g, "tab")
    .replace(/\b(capsule|capsules|cap|caps)\b/g, "cap")
    .replace(/\b(injection|injections|inj)\b/g, "inj")
    .replace(/\b(syrup|syp)\b/g, "syp")
    .replace(/\b(solution|sol)\b/g, "sol")
    .replace(/\b(suspension|susp)\b/g, "susp")
    .replace(/\b(ointment|oint)\b/g, "oint")
    .replace(/\b(cream|cr)\b/g, "cr")
    .replace(/\b(inhaler|inh)\b/g, "inh")
    .replace(/\b(ampoule|ampoules|amp)\b/g, "amp")
    .replace(/\b(vial|vials)\b/g, "vial")
    .replace(/\b(drop|drops)\b/g, "drops")
    .replace(/\b(suppository|suppositories|supp)\b/g, "supp")
    .replace(/\b(powder|pwd)\b/g, "pwd")
    .replace(/\b(spray|spr)\b/g, "spr")
    .trim();
}

function isHighAlertMedication(name){
  return HIGH_ALERT_MEDICATIONS.has(
    normalizeMedicationKey(name)
  );
}

function getMedicationIdForName(name){
  return centralMedicationIdByName[
    normalizeMedicationKey(name)
  ] || "";
}

function buildMedicationQrUrl(medicationId){
  const pageUrl =
    new URL(
      "medication-qr.html",
      window.location.href
    );

  pageUrl.searchParams.set(
    "medId",
    medicationId
  );

  return pageUrl.href;
}

function buildMedicationQrImageUrl(medicationId){
  if (!medicationId){
    return "";
  }

  return QR_IMAGE_API +
    "?size=180x180&margin=8&data=" +
    encodeURIComponent(
      buildMedicationQrUrl(medicationId)
    );
}
function normalizeDate(value){
  if (!value){
    return "";
  }

  const textValue =
    String(value).trim();

  if (/^\d{4}-\d{2}-\d{2}$/.test(textValue)){
    return textValue;
  }

  const date =
    new Date(textValue);

  if (Number.isNaN(date.getTime())){
    return "";
  }

  const year =
    date.getFullYear();
  const month =
    String(date.getMonth() + 1).padStart(2, "0");
  const day =
    String(date.getDate()).padStart(2, "0");

  return `${year}-${month}-${day}`;
}

function formatMedicationPrintName(name){
  let value =
    String(name || "").trim().replace(/\s+/g, " ");

  DOSAGE_FORM_ABBREVIATIONS.forEach(
    function(pair){
      const full =
        pair[0];
      const abbr =
        pair[1];
      const fullPattern =
        new RegExp("\\b" + escapeRegExp(full) + "\\b", "gi");
      const abbrPattern =
        new RegExp("\\b" + escapeRegExp(abbr) + "\\b", "gi");

      value =
        value.replace(fullPattern, abbr);
      value =
        value.replace(abbrPattern, abbr);
    }
  );

  return value;
}

function splitMedicationDisplayName(value){
  const textValue =
    String(value || "").trim();
  const strengthMatch =
    textValue.match(
      /\s+(?=\d+(?:[.,]\d+)?\s*(?:mcg|mg|kg|g|ml|iu|units?|meq|mmol|l|%)(?:\s|$))/i
    );
  const dosageFormMatch =
    textValue.match(
      /\s+(?=(?:Supp|Susp|Inj|Sol|Cap|Amp|Tab|Inh|Syp|Cr|Oint|Drops|Vial|Pwd|Spr|Gel)(?:\s|$))/i
    );
  const splitPoints =
    [strengthMatch, dosageFormMatch]
      .filter(Boolean)
      .map(
        function(match){
          return match.index;
        }
      );

  if (!splitPoints.length){
    return {
      medicationName:textValue,
      details:""
    };
  }

  const splitAt =
    Math.min.apply(null, splitPoints);

  return {
    medicationName:textValue.slice(0, splitAt).trim(),
    details:textValue.slice(splitAt).trim()
  };
}

function getTallManIngredient(originalName){
  const value =
    String(originalName || "").trim().toLowerCase();

  return TALL_MAN_INGREDIENTS.find(
    function(ingredient){
      if (!value.startsWith(ingredient)){
        return false;
      }

      const nextCharacter =
        value.charAt(ingredient.length);

      return !nextCharacter || !/[a-z]/i.test(nextCharacter);
    }
  ) || "";
}

function formatTallManNameHtml(displayName, originalName){
  const value =
    String(displayName || "").trim();
  const ingredient =
    getTallManIngredient(originalName);

  if (!ingredient){
    return escapeHtml(value);
  }

  const ingredientPattern =
    new RegExp(
      "^" + escapeRegExp(ingredient) + "(?=$|[^a-z])",
      "i"
    );
  const match =
    value.match(ingredientPattern);

  if (!match){
    return escapeHtml(value);
  }

  const tallManName =
    TALL_MAN_MAP[ingredient];
  const tallManHtml =
    tallManName
      .split(/([A-Z]{2,})/)
      .map(
        function(part){
          if (/^[A-Z]{2,}$/.test(part)){
            return "<span class=\"tall-man-segment\">" +
              escapeHtml(part) +
              "</span>";
          }

          return escapeHtml(part);
        }
      )
      .join("");

  return tallManHtml +
    escapeHtml(value.slice(match[0].length));
}

function updateItem(id, key, value){
  const item =
    selectedLabels.find(
      function(entry){
        return entry.id === id;
      }
    );

  if (!item){
    return;
  }

  if (key === "copies"){
    item.copies =
      Math.max(1, parseInt(value, 10) || 1);
  }else if (key === "printName"){
    item.printName =
      value;
    item.printMedicationName =
      value;
  }else{
    item[key] =
      value;
  }

  renderPreview();
  document.getElementById("selectedCount").innerText =
    text[currentLang].selected + ": " +
    selectedLabels.reduce(
      function(total, entry){
        return total + Math.max(1, Number(entry.copies) || 1);
      },
      0
    );
}

function removeItem(id){
  selectedLabels =
    selectedLabels.filter(
      function(item){
        return item.id !== id;
      }
    );
  renderBatchList();
  renderPreview();
}

function fitAllLabelNames(){

function fitLabelName(element){
  const sizeKey =
    document.getElementById("labelSize").value;
  const typographyBySize = {
    standard:{base:18, minimum:12},
    small:{base:17, minimum:12},
    tall:{base:18, minimum:13},
    wide:{base:19, minimum:14}
  };
  const typography =
    typographyBySize[sizeKey] ||
    typographyBySize.standard;
  let size =
    typography.base;
  const minimumSize =
    typography.minimum;
  const parent =
    element.parentElement;
  const primaryName =
    element.querySelector(".medication-primary");
  const details =
    element.querySelector(".medication-details");
  const badge =
    parent.querySelector(".high-alert-badge");
  const parentStyle =
    window.getComputedStyle(parent);
  const rowGap =
    parseFloat(parentStyle.rowGap || parentStyle.gap) || 0;

  element.style.fontSize =
    size + "px";
  element.style.whiteSpace =
    "normal";
  element.style.overflow =
    "visible";
  element.style.textOverflow =
    "clip";
  element.style.overflowWrap =
    "break-word";
  element.style.wordBreak =
    "normal";
  element.classList.remove(
    "extreme-name"
  );

  if (primaryName){
    primaryName.style.whiteSpace =
      "nowrap";
  }

  while (
    size >= minimumSize
  ){
    const lineHeight =
      parseFloat(
        window.getComputedStyle(element).lineHeight
      );
    const twoLineHeight =
      Math.ceil(lineHeight * 2) + 1;
    const badgeHeight =
      badge ? badge.offsetHeight + rowGap : 0;
    const availableNameHeight =
      Math.max(0, parent.clientHeight - badgeHeight);
    const primaryFits =
      !primaryName ||
      primaryName.getBoundingClientRect().width <=
        parent.clientWidth + 1;
    const detailsFit =
      !details ||
      details.getBoundingClientRect().width <=
        parent.clientWidth + 1;
    const fitsWidth =
      element.scrollWidth <= parent.clientWidth + 1 &&
      primaryFits &&
      detailsFit;
    const fitsHeight =
      element.scrollHeight <=
        Math.min(availableNameHeight, twoLineHeight) + 1;

    if (fitsWidth && fitsHeight){
      break;
    }

    if (size === minimumSize){
      element.classList.add(
        "extreme-name"
      );
      break;
    }

    size -= 0.5;
    if (size < minimumSize){
      size =
        minimumSize;
    }
    element.style.fontSize =
      size + "px";
  }
}

function buildLabelSizeOptions(){
  const select =
    document.getElementById("labelSize");

    "";

  Object.keys(LABEL_SIZES).forEach(
    function(key){
      const item =
        LABEL_SIZES[key];
      const option =
        document.createElement("option");
      option.value =
        key;
      option.innerText =
        item.label + " - " + item.widthMm + " × " + item.heightMm + " mm";
      select.appendChild(option);
    }
  );

  select.value =
    "standard";
  handleSizeChange();
}

function handleSizeChange(){
  const selected =
    LABEL_SIZES[
      document.getElementById("labelSize").value
    ] || LABEL_SIZES.standard;

  document.documentElement.style.setProperty(
    "--label-width",
    selected.widthMm + "mm"
  );
  document.documentElement.style.setProperty(
    "--label-height",
    selected.heightMm + "mm"
  );

  document.getElementById("printArea").style.setProperty(
    "--label-width",
    selected.widthMm + "mm"
  );
  document.getElementById("printArea").style.setProperty(

    selected.heightMm + "mm"
  );

  renderPreview();
}

function printAll(){
  if (!selectedLabels.length){
    setStatus(text[currentLang].needSelection, "error");
    return;
  }

  const missingExpiry =
    selectedLabels.some(
      function(item){
        return !item.selectedExpiry;
      }
    );

  if (missingExpiry){
    setStatus(text[currentLang].needExpiry, "error");
    return;
  }

  setStatus("", "");
  fitAllLabelNames();
  window.print();
}

function escapeHtml(value){
  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function escapeRegExp(value){
  return String(value).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
}

document.addEventListener(
  "input",
  function(event){
    const action =
      event.target.getAttribute("data-action");
    const id =
      event.target.getAttribute("data-id");

    if (!action || !id){
      return;
    }

    if (action === "name"){
      updateItem(id, "printName", event.target.value);
    }

    if (action === "copies"){
      updateItem(id, "copies", event.target.value);
    }
  }
);

  "change",
  function(event){
    const action =
      event.target.getAttribute("data-action");
    const id =
      event.target.getAttribute("data-id");

    if (action === "expiry" && id){
      updateItem(id, "selectedExpiry", event.target.value);
    }
  }
);

document.addEventListener(
  "click",
  function(event){
    const action =
      event.target.getAttribute("data-action");
    const id =
      event.target.getAttribute("data-id");

    if (action === "remove" && id){
      removeItem(id);
    }

);
