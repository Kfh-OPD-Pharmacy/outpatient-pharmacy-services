<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kidney Order</title>

<style>
*{box-sizing:border-box}

body{
  font-family:Arial,sans-serif;
  background:#f3f4f6;
  margin:0;
  padding:16px;
  color:#168fb3
}

.container{
  max-width:980px;
  margin:auto;
  background:#fff;
  padding:22px;
  border-radius:14px;
  box-shadow:0 10px 25px rgba(0,0,0,.1);
  min-height:calc(100vh - 32px)
}

.top-bar{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
  margin-bottom:8px;
  direction:ltr
}

.logo{
  width:120px;
  height:120px;
  object-fit:contain
}

.official-header{
  width:fit-content;
  max-width:100%;
  text-align:right;
  transform:translateY(14px);
  padding-left:8px;
  border-left:4px solid #168fb3;
  direction:rtl
}

html[dir="ltr"] .official-header{
  text-align:left;
  direction:ltr
}

.official-header h2,
.official-header h3{
  margin:2px 0;
  font-size:13px;
  line-height:1.4;
  color:#168fb3
}

hr{
  border:none;
  border-top:1px solid #e5e7eb;
  margin:14px 0
}

.meta-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:14px;
  direction:ltr
}

.date-box{
  color:#168fb3;
  padding:4px 0;
  font-size:13px;
  font-weight:bold;
  text-align:center
}

.language-chip{
  color:#168fb3;
  font-size:13px;
  font-weight:bold;
  padding:4px 0;
  white-space:nowrap;
  background:transparent;
  border:0;
  cursor:pointer;
  font-family:inherit
}

.title-row{
  display:grid;
  grid-template-columns:44px 1fr 44px;
  align-items:center;
  gap:10px;
  margin:18px 0 12px
}

.page-title{
  grid-column:2;
  text-align:center;
  font-size:23px;
  font-weight:bold;
  margin:0;
  color:#168fb3
}

.back-button{
  grid-column:3;
  width:44px;
  height:44px;
  border:0;
  background:transparent;
  color:#168fb3;
  font-size:30px;
  line-height:1;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  font-family:inherit
}

.back-button:hover{
  transform:translateX(2px)
}

.login-card,
.order-panel{
  max-width:560px;
  margin:22px auto 0;
  background:#f9fafb;
  border:1px solid #e5e7eb;
  border-radius:10px;
  padding:18px;
  box-shadow:0 4px 10px rgba(0,0,0,.04)
}

.order-panel{
  max-width:900px
}

label{
  display:block;
  color:#168fb3;
  font-weight:bold;
  font-size:14px;
  margin:0 0 7px;
  text-align:start
}

input,
textarea{
  width:100%;
  height:40px;
  border:1px solid #cbd5e1;
  border-radius:8px;
  background:#fff;
  color:#111827;
  font-size:14px;
  font-family:inherit;
  padding:8px 10px;
  outline:none
}

textarea{
  min-height:40px;
  resize:vertical
}

input:focus,
textarea:focus{
  border-color:#168fb3;
  box-shadow:0 0 0 3px rgba(22,143,179,.12)
}

.field-grid{
  display:grid;
  grid-template-columns:1.4fr .8fr .8fr;
  gap:12px;
  align-items:end
}

.field-row{
  margin-bottom:14px
}

.combo-wrap{
  position:relative
}

.combo-options{
  display:none;
  position:absolute;
  z-index:20;
  top:calc(100% + 4px);
  left:0;
  right:0;
  max-height:190px;
  overflow:auto;
  background:#fff;
  border:1px solid #cbd5e1;
  border-radius:8px;
  box-shadow:0 10px 24px rgba(15,23,42,.14)
}

.combo-option{
  padding:9px 10px;
  font-size:13px;
  color:#111827;
  cursor:pointer;
  text-align:left;
  direction:ltr
}

.combo-option:hover,
.combo-option.active{
  background:#e0f2fe
}

.combo-empty{
  padding:10px;
  font-size:13px;
  color:#94a3b8;
  text-align:left;
  direction:ltr
}

.form-actions,
.login-actions,
.order-actions{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  margin-top:14px
}

.primary-btn,
.secondary-btn,
.danger-btn{
  min-height:40px;
  border-radius:8px;
  border:0;
  padding:9px 16px;
  font-size:13px;
  font-weight:bold;
  font-family:inherit;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px
}

.primary-btn{
  background:#168fb3;
  color:#fff
}

.secondary-btn{
  background:#fff;
  color:#168fb3;
  border:1px solid #cbd5e1
}

.danger-btn{
  background:#a12727;
  color:#fff
}

.icon-btn{
  width:40px;
  height:40px;
  padding:0;
  border-radius:8px;
  border:0;
  background:transparent;
  color:#168fb3;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  justify-content:center
}

.icon-btn:hover{
  transform:scale(1.06)
}

.login-svg,
.power-svg,
.trash-svg,
.print-svg{
  width:23px;
  height:23px;
  fill:none;
  stroke:currentColor;
  stroke-width:2.2;
  stroke-linecap:round;
  stroke-linejoin:round
}

.employee-toolbar{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:14px;
  margin:10px 0 18px;
  color:#168fb3
}

.employee-name{
  font-size:20px;
  line-height:1;
  font-weight:bold;
  color:#168fb3
}

.logout-icon{
  width:36px;
  height:36px;
  border:0;
  background:transparent;
  color:#168fb3;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:0
}

.summary-strip{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:10px;
  margin:0 0 16px
}

.summary-item{
  border:1px solid #e5e7eb;
  background:#f9fafb;
  border-radius:8px;
  padding:10px;
  text-align:center
}

.summary-label{
  display:block;
  font-size:12px;
  color:#64748b;
  margin-bottom:4px
}

.summary-value{
  display:block;
  font-size:14px;
  color:#168fb3;
  font-weight:bold;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap
}

.table-wrap{
  overflow-x:auto;
  border-radius:10px;
  border:1px solid #e5e7eb;
  box-shadow:0 4px 10px rgba(0,0,0,.04);
  margin-top:16px
}

table{
  width:100%;
  border-collapse:collapse;
  background:#fff
}

th,
td{
  padding:9px 10px;
  text-align:center;
  font-size:13px;
  white-space:nowrap;
  border-bottom:1px solid #e5e7eb
}

th{
  background:#168fb3;
  color:#fff;
  font-weight:bold
}

td{
  color:#111827
}

td:nth-child(2){
  text-align:left;
  direction:ltr
}

.empty-note,
.result-box{
  text-align:center;
  font-size:13px;
  margin-top:12px;
  color:#64748b
}

.result-box.success{color:#0f7592}
.result-box.error{color:#a12727}

.hidden{
  display:none !important
}

#printPages{
  display:none;
  counter-reset:printRow
}

.print-page{
  width:100%;
  min-height:281mm;
  height:281mm;
  margin:0 auto;
  padding:10mm 12mm;
  background:#fff;
  color:#111827;
  border:1.3px solid #cbdfe6;
  border-radius:3mm;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  page-break-after:always;
  break-after:page
}

.print-page:last-child{
  page-break-after:auto;
  break-after:auto
}

.print-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  direction:ltr;
  gap:18px;
  min-height:23mm;
  margin:0 0 4mm
}

.print-logo{
  width:78px;
  height:78px;
  object-fit:contain;
  flex:0 0 auto
}

.print-official{
  text-align:right;
  direction:rtl;
  padding:2mm 0 2mm 10px;
  border-left:3px solid #168fb3
}

.print-official h2{
  margin:0 0 3px;
  color:#168fb3;
  font-size:11px;
  line-height:1.4;
  font-weight:700
}

.print-official h3{
  margin:2px 0;
  color:#168fb3;
  font-size:10px;
  line-height:1.35;
  font-weight:600
}

.print-divider{
  border:0;
  border-top:1px solid #cbdfe6;
  margin:0 0 3mm
}

.print-title{
  text-align:center;
  color:#168fb3;
  font-size:17px;
  line-height:1.25;
  font-weight:700;
  margin:0 0 4mm
}

.print-info{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:2mm;
  margin:0 0 4mm
}

.print-info-item{
  border:1px solid #cbdfe6;
  border-radius:2px;
  padding:2mm;
  text-align:center;
  background:#f9fafb;
  -webkit-print-color-adjust:exact;
  print-color-adjust:exact
}

.print-info-label{
  display:block;
  color:#334155;
  font-size:9px;
  font-weight:700;
  margin-bottom:1mm
}

.print-info-value{
  display:block;
  color:#111827;
  font-size:10px;
  font-weight:700
}

.print-table-wrap{
  width:100%;
  border:1.3px solid #168fb3;
  border-radius:2px;
  overflow:hidden;
  margin:0
}

.print-table{
  width:100%;
  border-collapse:collapse;
  table-layout:fixed
}

.print-table thead{
  display:table-header-group
}

.print-table tr{
  break-inside:avoid;
  page-break-inside:avoid
}

.print-table th{
  height:8mm;
  background:#168fb3 !important;
  color:#fff !important;
  font-size:9.5px;
  font-weight:700;
  padding:3px 5px;
  border-right:1px solid rgba(255,255,255,.45);
  vertical-align:middle;
  -webkit-print-color-adjust:exact;
  print-color-adjust:exact
}

.print-table th:last-child{
  border-right:0
}

.print-table tbody tr{
  height:8mm
}

.print-table td{
  color:#111827;
  font-size:9px;
  line-height:1.2;
  padding:3px 5px;
  border-top:1px solid #d8e0e5;
  border-right:1px solid #d8e0e5;
  white-space:normal;
  overflow-wrap:anywhere;
  vertical-align:middle
}

.print-table td:last-child{
  border-right:0
}

.print-table th:nth-child(1),
.print-table td:nth-child(1){
  width:8%
}

.print-table th:nth-child(2),
.print-table td:nth-child(2){
  width:38%
}

.print-table th:nth-child(3),
.print-table td:nth-child(3){
  width:16%
}

.print-table th:nth-child(4),
.print-table td:nth-child(4){
  width:18%
}

.print-table th:nth-child(5),
.print-table td:nth-child(5){
  width:20%
}

.print-footer{
  margin-top:auto;
  width:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  border-top:1px solid #e2e8f0;
  padding-top:2mm;
  min-height:8mm
}

.print-page-number{
  color:#64748b;
  font-size:8.5px;
  line-height:1;
  font-weight:600;
  text-align:center
}

@media (max-width:700px){
  body{
    padding:10px;
    background:#fff
  }

  .container{
    padding:14px;
    border-radius:0;
    box-shadow:none;
    min-height:100vh
  }

  .logo{
    width:84px;
    height:84px
  }

  .official-header{
    transform:translateY(10px)
  }

  .official-header h2,
  .official-header h3{
    font-size:12px
  }

  .page-title{
    font-size:20px
  }

  .login-card,
  .order-panel{
    padding:14px;
    margin-top:16px
  }

  .field-grid{
    grid-template-columns:1fr
  }

  .summary-strip{
    grid-template-columns:repeat(2,minmax(0,1fr))
  }

  th,
  td{
    padding:8px;
    font-size:12px
  }

  .employee-name{
    font-size:20px
  }
}

@page{
  size:A4 portrait;
  margin:8mm
}

@media print{
  html,
  body{
    width:100% !important;
    margin:0 !important;
    padding:0 !important;
    background:#fff !important
  }

  .container{
    display:none !important
  }

  #printPages{
    display:block !important
  }

  .print-page{
    box-shadow:none !important;
    width:100% !important;
    min-height:274mm !important;
    height:274mm !important;
    margin:0 auto !important;
    padding:10mm 12mm !important
  }
}
/* PHASE B: unified login UI only */
#loginView.login-card{
  width:min(100%, 360px);
  max-width:360px;
  margin:18px auto 0;
  padding:18px;
  background:#f9fafb;
  border:1px solid #e5e7eb;
  border-radius:10px;
  box-shadow:0 12px 28px rgba(15,23,42,.08)
}
#loginView.login-card label{
  margin:0 0 6px;
  color:#168fb3;
  font-size:14px;
  line-height:1.35
}
#loginView.login-card input{
  height:40px;
  padding:8px 10px;
  margin:0 0 12px;
  border:1px solid #cbd5e1;
  border-radius:8px;
  background:#fff;
  color:#111827;
  font-size:14px;
  font-family:inherit
}
#loginView.login-card input:focus{
  border-color:#168fb3;
  outline:3px solid rgba(22,143,179,.12)
}
#loginView .primary-btn{
  min-width:120px;
  height:40px;
  border-radius:10px;
  font-size:14px
}
#loginView .primary-btn:disabled{
  background:#94a3b8;
  color:#fff;
  cursor:not-allowed;
  opacity:.85
}
#loginResult{
  margin-top:12px;
  padding:10px 12px;
  border-radius:8px;
  font-size:13px;
  line-height:1.5
}
@media (max-width:700px){
  #loginView.login-card{
    width:min(100%, 320px);
    padding:16px;
    margin-top:16px
  }
  #loginView .primary-btn{
    width:100%;
    min-width:0
  }
}
</style>
</head>

<body>
<div class="container">

  <div class="top-bar">
    <img class="logo" src="../../logo.png" alt="Logo">

    <div class="official-header">
      <h2 id="officialLine1">تجمع المدينة المنورة الصحي</h2>
      <h3 id="officialLine2">مستشفى الملك فهد بالمدينة المنورة</h3>
      <h3 id="officialLine3">إدارة الرعاية الصيدلانية</h3>
    </div>
  </div>

  <hr>

  <div class="meta-row">
    <div class="date-box" id="dateBox"></div>

    <button
      type="button"
      class="language-chip"
      id="languageToggle"
      onclick="toggleLanguage()">
      🌐 ع | E
    </button>
  </div>

  <div class="title-row">
    <button
      type="button"
      class="back-button"
      onclick="history.back()"
      title="Back"
      aria-label="Back">
      ↩
    </button>

    <h1 class="page-title" id="pageTitle">
      Kidney Order
    </h1>
  </div>

  <div id="loginView" class="login-card">
    <div class="field-row">
      <label id="usernameLabel" for="username">Username</label>
      <input type="text" id="username" autocomplete="username">
    </div>

    <div class="field-row">
      <label id="passwordLabel" for="password">PIN</label>
      <input
        type="password"
        id="password"
        inputmode="numeric"
        autocomplete="current-password">
    </div>

    <div class="login-actions">
      <button
        type="button"
        class="primary-btn"
        id="loginBtn"
        onclick="loginUser()"
        title="Login"
        aria-label="Login">
        <svg class="login-svg" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M10 17l5-5-5-5"></path>
          <path d="M15 12H3"></path>
          <path d="M15 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4"></path>
        </svg>
      </button>
    </div>

    <div id="loginResult" class="result-box"></div>
  </div>

  <div id="orderView" class="hidden">
    <div class="employee-toolbar">
      <span class="employee-name" id="employeeName"></span>

      <button
        type="button"
        class="logout-icon"
        id="logoutBtn"
        onclick="logoutUser()"
        title="Logout"
        aria-label="Logout">
        <svg class="power-svg" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3v9"></path>
          <path d="M7.1 6.8a8 8 0 1 0 9.8 0"></path>
        </svg>
      </button>
    </div>

    <div class="order-panel">
      <div class="summary-strip">
        <div class="summary-item">
          <span class="summary-label" id="orderNoLabel">Order No.</span>
          <span class="summary-value" id="orderNoValue">-</span>
        </div>

        <div class="summary-item">
          <span class="summary-label" id="orderDateLabel">Order Date</span>
          <span class="summary-value" id="orderDateValue">-</span>
        </div>

        <div class="summary-item">
          <span class="summary-label" id="requestedByLabel">Requested By</span>
          <span class="summary-value" id="requestedByValue">-</span>
        </div>

        <div class="summary-item">
          <span class="summary-label" id="statusLabel">Status</span>
          <span class="summary-value" id="statusValue">Requested</span>
        </div>
      </div>

      <div class="field-grid">
        <div class="field-row">
          <label id="medicationLabel" for="medicationName">Medication Name</label>
          <div class="combo-wrap">
            <input
              type="text"
              id="medicationName"
              autocomplete="off"
              dir="ltr">

            <div class="combo-options" id="medicationOptions"></div>
          </div>
        </div>

        <div class="field-row">
          <label id="stockLabel" for="currentStock">Current Stock</label>
          <input type="text" id="currentStock" inputmode="numeric">
        </div>

        <div class="field-row">
          <label id="quantityLabel" for="requestedQuantity">Requested Quantity</label>
          <input type="text" id="requestedQuantity" inputmode="numeric">
        </div>
      </div>

      <div class="field-row">
        <label id="notesLabel" for="notes">Notes</label>
        <textarea id="notes"></textarea>
      </div>

      <div class="form-actions">
        <button type="button" class="primary-btn" id="addItemBtn" onclick="addItemToOrder()">
          Add Medication
        </button>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th id="colNo">No.</th>
              <th id="colMedication">Medication Name</th>
              <th id="colStock">Current Stock</th>
              <th id="colQuantity">Requested Quantity</th>
              <th id="colNotes">Notes</th>
              <th id="colAction">Action</th>
            </tr>
          </thead>
          <tbody id="orderBody"></tbody>
        </table>
      </div>

      <div id="emptyNote" class="empty-note">
        No medications added yet.
      </div>

      <div class="order-actions">
        <button type="button" class="primary-btn" id="saveOrderBtn" onclick="saveOrder()">
          Save Order
        </button>

        <button
          type="button"
          class="secondary-btn"
          id="printBtn"
          onclick="printOrder()">
          <svg class="print-svg" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 9V2h12v7"></path>
            <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
            <path d="M6 14h12v8H6z"></path>
          </svg>
          <span id="printText">Print</span>
        </button>
      </div>

      <div id="orderResult" class="result-box"></div>
    </div>
  </div>

</div>

<div id="printPages"></div>

<script>
const ORDERS_API_URL =
  "https://script.google.com/macros/s/AKfycbwna5ifaRT46qMasogcUbjs6u15PtP7p6vwTNCtNqtQi0Kn8FR6JLtjeborWXNPb4Hz/exec";

const CENTRAL_MEDICATIONS_API_URL =
  "https://script.google.com/macros/s/AKfycbxtK-J87-gmKVXExW_kbVXBuYTxArtP5pnvnp3HJh2s_BL2nPQn8vPrwMX_bDUkp4uq/exec";

const ORDER_SESSION_NAME_KEY =
  "kidneyOrderEmployeeName";

const ORDER_SESSION_USERNAME_KEY =
  "kidneyOrderEmployeeUsername";

const ORDER_SESSION_TOKEN_KEY =
  "kidneyOrderSessionToken";

const INACTIVITY_LIMIT_MS =
  30 * 60 * 1000;

let currentLang =
  localStorage.getItem("kidneyOrderLanguage") ||
  "en";

let currentEmployeeName =
  sessionStorage.getItem(ORDER_SESSION_NAME_KEY) ||
  "";

let currentEmployeeUsername =
  sessionStorage.getItem(ORDER_SESSION_USERNAME_KEY) ||
  "";

let currentSessionToken =
  sessionStorage.getItem(ORDER_SESSION_TOKEN_KEY) ||
  "";

let inactivityTimer =
  null;

let medications =
  [];

let orderItems =

function ordersApiReady(){
  return ORDERS_API_URL &&
    !ORDERS_API_URL.includes(
      "PUT_ORDERS_WEB_APP_URL_HERE"

}

  document.getElementById("loginView").classList.remove("hidden");

}

  document.getElementById("loginView").classList.add("hidden");

    currentEmployeeName ||
    currentEmployeeUsername;

  document.getElementById("requestedByValue").innerText =

}

function saveStoredSession(){
  localStorage.removeItem(
    ORDER_SESSION_NAME_KEY
  );

  localStorage.removeItem(
    ORDER_SESSION_USERNAME_KEY
  );

  localStorage.removeItem(
    ORDER_SESSION_TOKEN_KEY
  );

  sessionStorage.setItem(
    ORDER_SESSION_NAME_KEY,
    currentEmployeeName
  );

  sessionStorage.setItem(
    ORDER_SESSION_USERNAME_KEY,
    currentEmployeeUsername
  );

  sessionStorage.setItem(
    ORDER_SESSION_TOKEN_KEY,
    currentSessionToken
  );
}

function clearStoredSession(){
  currentEmployeeName =
    "";

  currentEmployeeUsername =
    "";

  currentSessionToken =
    "";

  localStorage.removeItem(ORDER_SESSION_NAME_KEY);
  localStorage.removeItem(ORDER_SESSION_USERNAME_KEY);
  localStorage.removeItem(ORDER_SESSION_TOKEN_KEY);
  sessionStorage.removeItem(ORDER_SESSION_NAME_KEY);
  sessionStorage.removeItem(ORDER_SESSION_USERNAME_KEY);
  sessionStorage.removeItem(ORDER_SESSION_TOKEN_KEY);
}

async function loginUser(){
  clearResult("loginResult");

  if (
    !ordersApiReady()
  ){
    showResult(
      "loginResult",
      "error",
      text[currentLang].apiNotConfigured
    );

    return;
  }

  const username =
    document.getElementById("username").value.trim();

  const password =
    document.getElementById("password").value.trim();

  try{
    const result =
      await postApi(
        "employeeLogin",
        {
          username:username,
          password:password,
          pin:password
        },
        false
      );

    if (
      !result.success ||
      !result.sessionToken ||
      !result.employee
    ){
      showResult(
        "loginResult",
        "error",
        text[currentLang].invalidLogin
      );

      return;
    }

    currentEmployeeName =
      result.employee.name ||
      result.employee.username ||
      username;

    currentEmployeeUsername =
      result.employee.username ||
      username;

    currentSessionToken =
      result.sessionToken;

    saveStoredSession();

    document.getElementById("password").value =
      "";

    showOrderView();
    loadMedicationDatabase();

  }catch(error){
    showResult(
      "loginResult",
      "error",
      text[currentLang].invalidLogin
    );
  }
}

async function restoreSession(){
  currentSessionToken =
    sessionStorage.getItem(ORDER_SESSION_TOKEN_KEY) ||
    "";

  currentEmployeeName =
    sessionStorage.getItem(ORDER_SESSION_NAME_KEY) ||
    "";

  currentEmployeeUsername =
    sessionStorage.getItem(ORDER_SESSION_USERNAME_KEY) ||
    "";

  if (
    !ordersApiReady()
  ){
    showLoginView();
    return;
  }

  if (
    !currentSessionToken
  ){
    clearStoredSession();
    showLoginView();
    return;
  }

  try{
    const result =
      await postApi(
        "validateSession",
        {},
        true
      );

    if (
      !result.success ||
      !result.user
    ){
      clearStoredSession();
      showLoginView();
      return;
    }

    currentEmployeeUsername =
      result.user.username ||
      currentEmployeeUsername;

    currentEmployeeName =
      result.user.name ||
      result.user.username ||
      currentEmployeeName;

    saveStoredSession();
    showOrderView();
    loadMedicationDatabase();

  }catch(error){
    clearStoredSession();
    showLoginView();
  }
}

async function logoutUser(){
  if (currentSessionToken){
    try{
      await postApi(
        "revokeSession",
        {},
        true
      );
    }catch(error){}
  }

  clearStoredSession();
  orderItems = [];
  savedOrder = null;
  renderOrderTable();
  updateSummary();
  stopInactivityTimer();
  showLoginView();
}

function startInactivityTimer(){
  resetInactivityTimer();

  ["click","keydown","mousemove","touchstart"].forEach(
    function(eventName){
      document.addEventListener(
        eventName,
        resetInactivityTimer,
        {passive:true}
      );
    }
  );
}

function resetInactivityTimer(){
  if (
    inactivityTimer
  ){
    clearTimeout(
      inactivityTimer
    );
  }

  inactivityTimer =
    setTimeout(
      function(){
        logoutUser();
        showResult(
          "loginResult",
          "error",
          text[currentLang].sessionExpired
        );
      },
      INACTIVITY_LIMIT_MS
    );
}

function stopInactivityTimer(){
  if (
    inactivityTimer
  ){
    clearTimeout(
      inactivityTimer
    );
  }
}

async function loadMedicationDatabase(){
  try{
    const response =
      await fetch(
        CENTRAL_MEDICATIONS_API_URL +
        "?action=listMedications&service=kidney"
      );

    const result =
      await response.json();

    medications =
      (result.medications || [])
        .map(
          function(item){
            return item.name || item.medicationName || "";
          }
        )
        .filter(Boolean)
        .sort(
          function(a,b){
            return a.localeCompare(b);
          }
        );

  }catch(error){
    showResult(
      "orderResult",
      "error",
      text[currentLang].loadMedicationsFailed
    );
  }
}

function filteredMedications(){
  const value =
    document.getElementById("medicationName").value
      .trim()
      .toLowerCase();

  return medications
    .filter(
      function(name){
        return !value ||
          name.toLowerCase().includes(value);
      }
    )
    .slice(0,50);
}

function showMedicationOptions(){
  const box =
    document.getElementById("medicationOptions");

  box.innerHTML =
    "";

  const list =
    filteredMedications();

  if (
    !list.length
  ){
    const empty =
      document.createElement("div");

    empty.className =
      "combo-empty";

    empty.innerText =
      text[currentLang].medicationNotFound;

    box.appendChild(empty);
  }else{
    list.forEach(
      function(name){
        const option =
          document.createElement("div");

        option.className =
          "combo-option";

        option.innerText =
          name;

        option.onclick =
          function(){
            document.getElementById("medicationName").value =
              name;

            hideMedicationOptions();
          };

        box.appendChild(option);
      }
    );
  }

  box.style.display =
    "block";
}

function hideMedicationOptions(){
  document.getElementById("medicationOptions").style.display =
    "none";
}

function medicationExists(name){
  const target =
    name.trim().toLowerCase();

  return medications.some(
    function(item){
      return item.toLowerCase() === target;
    }
  );
}

function addItemToOrder(){
  clearResult("orderResult");

  const name =
    document.getElementById("medicationName").value.trim();

  if (
    !name
  ){
    showResult(
      "orderResult",
      "error",
      text[currentLang].missingMedication
    );

    return;
  }

  if (
    !medicationExists(name)
  ){
    showResult(
      "orderResult",
      "error",
      text[currentLang].medicationNotFound
    );

    return;
  }

  orderItems.push({
    medicationName:name,
    currentStock:document.getElementById("currentStock").value.trim(),
    requestedQuantity:document.getElementById("requestedQuantity").value.trim(),
    notes:document.getElementById("notes").value.trim()
  });

  savedOrder =
    null;

  document.getElementById("medicationName").value =
    "";

  document.getElementById("currentStock").value =
    "";

  document.getElementById("requestedQuantity").value =
    "";

  document.getElementById("notes").value =
    "";

  renderOrderTable();
  updateSummary();
  document.getElementById("medicationName").focus();
}

async function saveOrder(){
  clearResult("orderResult");

  if (
    !ordersApiReady()
  ){
    showResult(
      "orderResult",
      "error",
      text[currentLang].apiNotConfigured
    );

    return;
  }

  if (
    !orderItems.length
  ){
    showResult(
      "orderResult",
      "error",
      text[currentLang].missingItems
    );

    return;
  }

  const button =
    document.getElementById("saveOrderBtn");

  button.disabled =
    true;

  try{
    const result =
      await postApi(
        "saveOrder",
        {
          items:orderItems
        },
        true
      );

    if (
      !result.success
    ){
      if (
        isSessionError(result)
      ){
        handleSessionExpired();
        return;
      }

      showResult(
        "orderResult",
        "error",
        text[currentLang].saveFailed
      );

      return;
    }

    savedOrder = {
      orderNo:result.orderNo,
      orderDate:result.orderDate,
      requestedBy:result.requestedBy,
      status:result.status || "Requested"
    };

    updateSummary();

    showResult(
      "orderResult",
      "success",
      text[currentLang].saved
    );

  }catch(error){
    showResult(
      "orderResult",
      "error",
      text[currentLang].saveFailed
    );
  }finally{
    button.disabled =
      false;
  }
}

function printOrder(){
  clearResult("orderResult");

  if (
    !orderItems.length
  ){
    showResult(
      "orderResult",
      "error",
      text[currentLang].printEmpty
    );

    return;
  }

  buildPrintPages();
  window.print();
}

function buildPrintPages(){
  const printPages =
    document.getElementById("printPages");

  printPages.innerHTML =
    "";

  const ROWS_PER_PAGE =
    24;

  const pageCount =
    Math.max(
      1,
      Math.ceil(orderItems.length / ROWS_PER_PAGE)
    );

  for (
    let pageIndex = 0;
    pageIndex < pageCount;
    pageIndex++
  ){
    const start =
      pageIndex * ROWS_PER_PAGE;

    const pageItems =
      orderItems.slice(
        start,
        start + ROWS_PER_PAGE
      );

    printPages.appendChild(
      createPrintPage(
        pageItems,
        start,
        pageIndex + 1,
        pageCount
      )
    );
  }
}

async function postApi(
  action,
  payload = {},
  includeSession = true
){
  const requestData = {
    action:action,
    ...payload
  };

  if (
    includeSession
  ){
    currentSessionToken =
      sessionStorage.getItem(ORDER_SESSION_TOKEN_KEY) ||
      currentSessionToken;

    if (
      currentSessionToken
    ){
    requestData.sessionToken =
      currentSessionToken;

    requestData.token =
      currentSessionToken;
    }
  }

  const response =
    await fetch(
      ORDERS_API_URL,
      {
        method:"POST",
        headers:{
          "Content-Type":"text/plain;charset=utf-8"
        },
        body:JSON.stringify(requestData)
      }
    );

  if (
    !response.ok
  ){
    throw new Error("HTTP_" + response.status);
  }

  return await response.json();
}

function isSessionError(result){
  return result &&
    [
      "MISSING_SESSION",
      "INVALID_SESSION",
      "SESSION_EXPIRED",
      "NO_ORDER_PERMISSION"
    ].includes(result.code);
}

  clearStoredSession();
  stopInactivityTimer();
  showLoginView();
  showResult(
    "loginResult",

    text[currentLang].sessionExpired
  );
}

}

function clearResult(id){
  const box =

}

function escapeHtml(value){
  return String(
    value === null ||
    value === undefined
      ? ""
      : value
  )
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

      event.key === "Enter"
    ){
      loginUser();
    }
  }
);

setLanguage(currentLang);
restoreSession();
</script>
</body>
