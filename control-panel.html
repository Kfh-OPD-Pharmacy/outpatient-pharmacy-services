<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التحكم</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f3f4f6;margin:0;padding:16px;color:#168fb3}
.container{max-width:980px;margin:auto;background:#fff;padding:22px;border-radius:14px;box-shadow:0 10px 25px rgba(0,0,0,.1);min-height:calc(100vh - 32px)}
.top-bar{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:8px;direction:ltr}
.logo{width:120px;height:120px;object-fit:contain}
.official-header{width:fit-content;max-width:100%;text-align:right;transform:translateY(14px);padding-left:8px;border-left:4px solid #168fb3;direction:rtl}
.official-header h2,.official-header h3{margin:2px 0;font-size:13px;line-height:1.4;color:#168fb3}
hr{border:none;border-top:1px solid #e5e7eb;margin:14px 0}
.meta-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;direction:ltr}
.date-box,.language-chip{color:#168fb3;padding:4px 0;font-size:13px;font-weight:bold;background:transparent;border:0;font-family:inherit}
.language-chip{cursor:pointer;white-space:nowrap}
.page-title{text-align:center;font-size:24px;font-weight:bold;margin:18px 0 8px;color:#168fb3}
.subtitle{text-align:center;color:#334155;font-size:15px;line-height:1.7;margin:0 auto 22px;max-width:620px}
.portal-grid{display:flex;justify-content:center;align-items:stretch;gap:14px;max-width:620px;margin:0 auto;width:100%}
.portal-grid .portal-card{width:min(100%,360px)}
.portal-card{background:#168fb3;border:1px solid #168fb3;border-radius:8px;padding:16px;text-decoration:none;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:108px;transition:.15s ease}
.portal-card:hover{border-color:#0f7592;transform:translateY(-1px);box-shadow:0 8px 18px rgba(22,143,179,.28);filter:brightness(1.05)}
.card-title{font-size:16px;font-weight:bold;color:#fff;margin:0 0 5px}
.card-desc{font-size:12px;color:rgba(255,255,255,.88);line-height:1.55;margin:0}
.card-icon{width:38px;height:38px;border-radius:8px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:21px;flex:0 0 auto}
@media (max-width:700px){
body{padding:10px;background:#fff}
.container{padding:14px;border-radius:0;box-shadow:none;min-height:100vh}
.logo{width:84px;height:84px}
.official-header{transform:translateY(10px)}
.official-header h2,.official-header h3{font-size:12px}
.page-title{font-size:20px}
.subtitle{font-size:13px}
.portal-grid{max-width:310px}
.portal-card{min-height:92px;padding:12px}
.card-title{font-size:15px}
.card-icon{width:34px;height:34px;font-size:19px}
}


/* PHASE C: unified portal design system */
@media screen{
  body{
    background:#f3f4f6;
  }

  .container,
  .employee-shell{
    max-width:980px;
    margin:auto;
    background:#fff;
    padding:22px;
    border-radius:14px;
    box-shadow:0 10px 25px rgba(0,0,0,.1);
  }

  .logo,
  .official-logo{
    width:120px;
    height:120px;
    object-fit:contain;
  }

  .official-header h2,
  .official-header h3{
    margin:2px 0;
    color:#168fb3;
    font-size:13px;
    line-height:1.4;
  }

  hr,
  .official-divider{
    border-top-color:#e5e7eb;
    margin:14px 0;
  }

  .page-title,
  .employee-page-title{
    color:#168fb3;
    font-size:23px;
    font-weight:bold;
    line-height:1.25;
    margin:18px 0 12px;
    text-align:center;
  }

  .title-row{
    margin:18px 0 12px;
  }

  .panel,
  .toolbar,
  .empty-box,
  .order-panel,
  .size-row,
  .result-card,
  .upload-box,
  .users-form,
  .upload-standalone,
  .employee-toolbar,
  .upload-toolbar,
  .supervisor-panel,
  .user-summary-panel,
  .filter-panel,
  .filters-panel,
  .summary-card,
  .stat-card{
    background:#fff;
    border:1px solid #e5e7eb;
    border-radius:10px;
    box-shadow:0 4px 10px rgba(0,0,0,.04);
  }

  .portal-card,
  .service-card,
  .control-card,
  .pharmacy-card,
  .card-link{
    border-radius:10px;
    box-shadow:0 4px 10px rgba(0,0,0,.04);
  }

  input,
  select,
  textarea{
    min-height:40px;
    padding:8px 12px;
    border:1px solid #cbd5e1;
    border-radius:8px;
    font-size:14px;
    font-family:inherit;
    box-sizing:border-box;
  }

  input:focus,
  select:focus,
  textarea:focus{
    border-color:#168fb3;
    box-shadow:0 0 0 2px rgba(22,143,179,.12);
    outline:none;
  }

  .primary-btn,
  .secondary-btn,
  .action-btn,
  .ghost-btn,
  button[type="submit"]{
    min-height:40px;
    border-radius:8px;
    font-size:14px;
    font-weight:bold;
  }

  .actions,
  .form-actions,
  .login-actions,
  .card-actions,
  .row-actions,
  .scan-actions{
    gap:10px;
  }

  .table-wrap,
  .dashboard-table-wrap,
  .orders-table-wrap{
    overflow-x:auto;
    border-radius:10px;
  }

  table{
    border-collapse:collapse;
  }

  th{
    background:#168fb3;
    color:#fff;
    font-weight:bold;
  }

  th,
  td{
    border-color:#e5e7eb;
  }

  @media (max-width:700px){
    body{
      padding:10px;
      background:#fff;
    }

    .container,
    .employee-shell{
      padding:14px;
      border-radius:0;
      box-shadow:none;
    }

    .logo,
    .official-logo{
      width:84px;
      height:84px;
    }

    .official-header h2,
    .official-header h3{
      font-size:12px;
    }

    .page-title,
    .employee-page-title{
      font-size:20px;
      margin:16px 0 12px;
    }

    input,
    select,
    textarea{
      width:100%;
      font-size:13px;
    }
  }
}

</style>

<body>
<div class="container">
  <div class="top-bar">
    <img class="logo" src="logo.png" alt="Logo">
    <div class="official-header">
      <h2 id="officialLine1">تجمع المدينة المنورة الصحي</h2>
      <h3 id="officialLine2">مستشفى الملك فهد بالمدينة المنورة</h3>
      <h3 id="officialLine3">إدارة الرعاية الصيدلانية</h3>
    </div>
  </div>
  <hr>
  <div class="meta-row">
    <div class="date-box" id="dateBox"></div>
    <button type="button" class="language-chip" id="languageToggle" onclick="toggleLanguage()">🌐 ع | E</button>
  </div>
  <div style="text-align:center">
    <a href="index.html" title="رجوع" aria-label="رجوع" style="color:#168fb3;text-decoration:none;font-size:28px;line-height:1">↩</a>
  </div>
  <h1 class="page-title" id="pageTitle">لوحة التحكم</h1>
  <p class="subtitle" id="subtitle">اختيار صفحة الإدارة المطلوبة.</p>

  <div class="portal-grid" id="portalGrid">
    <a class="portal-card" href="medications-admin.html" style="display:none">
      <div>
        <p class="card-title" id="medsTitle">إدارة الأدوية الموحدة</p>
        <p class="card-desc" id="medsDesc">إضافة وتعديل أسماء الأدوية للقوائم المنسدلة.</p>
      </div>
      <div class="card-icon">💊</div>
    </a>
  </div>
</div>

<script>
let currentLang = "ar";
const text = {
  ar:{
    title:"لوحة التحكم",
    subtitle:"اختيار صفحة الإدارة المطلوبة.",
    officialLine1:"تجمع المدينة المنورة الصحي",
    officialLine2:"مستشفى الملك فهد بالمدينة المنورة",
    officialLine3:"إدارة الرعاية الصيدلانية",
    medsTitle:"إدارة الأدوية الموحدة",
    medsDesc:"إضافة وتعديل أسماء الأدوية للقوائم المنسدلة."
  },
  en:{
    title:"Control Panel",
    subtitle:"Choose the required administration page.",
    officialLine1:"Madinah Health Cluster",
    officialLine2:"King Fahad Hospital - Madinah",
    officialLine3:"Pharmaceutical Care Administration",
    medsTitle:"Unified Medication Management",
    medsDesc:"Add and edit medication names for dropdown lists."
  }
};
function setLanguage(lang){
  currentLang = lang;
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.title = text[lang].title;
  ["officialLine1","officialLine2","officialLine3"].forEach(id => document.getElementById(id).innerText = text[lang][id]);
  document.getElementById("pageTitle").innerText = text[lang].title;
  document.getElementById("subtitle").innerText = text[lang].subtitle;
  ["medsTitle","medsDesc"].forEach(id => document.getElementById(id).innerText = text[lang][id]);
  renderDate();
}
function toggleLanguage(){setLanguage(currentLang === "ar" ? "en" : "ar")}
function renderDate(){
  const now = new Date();
  const date = new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Riyadh"}).format(now);
  const day = new Intl.DateTimeFormat(currentLang === "ar" ? "ar-SA" : "en-US",{timeZone:"Asia/Riyadh",weekday:"long"}).format(now);
  document.getElementById("dateBox").innerText = `${day} - ${date}`;
}

const UNIFIED_API_URL =
  "https://script.google.com/macros/s/AKfycbzg9PCeoJQl0ifbng_aam6u5mTePD0872wqZ5ilZYqcFV9QypiyopulgPPyO3nqLpez/exec";

async function unifiedApi(payload){
  const response = await fetch(
    UNIFIED_API_URL,
    {
      method:"POST",
      headers:{
        "Content-Type":"text/plain;charset=utf-8"
      },
      body:JSON.stringify(payload)
    }
  );

  return response.json();
}

function clearPortalSession(){
  sessionStorage.removeItem("unifiedPortalUsername");
  sessionStorage.removeItem("unifiedPortalSessionToken");
  sessionStorage.removeItem("unifiedPortalUser");
}

function getControlCards(){
  return {
    meds:document.querySelector('a.portal-card[href="medications-admin.html"]')
  };
}

function hideAllControlCards(){
  const cards = getControlCards();

  if (cards.meds){
    cards.meds.style.display = "none";
  }
}

function renderAllowedControlServices(user){
  const cards = getControlCards();

  const medsAllowed = Boolean(
    user &&
    user.medicationManagementAccess
  );

  if (cards.meds){
    cards.meds.style.display =
      medsAllowed
        ? "flex"
        : "none";
  }

  return medsAllowed;
}

async function validatePageAccess(){
  hideAllControlCards();

  const sessionToken =
    sessionStorage.getItem("unifiedPortalSessionToken") || "";

  if (!sessionToken){
    window.location.href = "index.html";
    return;
  }

  let cachedUserRendered = false;

  const cachedUserText =
    sessionStorage.getItem("unifiedPortalUser") || "";

  if (cachedUserText){
    try{
      const cachedUser =
        JSON.parse(cachedUserText);

      if (
        cachedUser &&
        typeof cachedUser === "object"
      ){
        cachedUserRendered =
          renderAllowedControlServices(cachedUser);
      }
    } catch (error){
      cachedUserRendered = false;
    }
  }

  try{
    const result = await unifiedApi({
      action:"validateSession",
      sessionToken:sessionToken,
      service:""
    });

    if (
      !result.success ||
      !result.user ||
      result.user.active === false
    ){
      clearPortalSession();
      window.location.href = "index.html";
      return;
    }

    sessionStorage.setItem(
      "unifiedPortalUser",
      JSON.stringify(result.user)
    );

    const hasControlAccess =
      renderAllowedControlServices(result.user);

    if (!hasControlAccess){
      window.location.href = "index.html";
    }

  } catch (error){
    if (cachedUserRendered){
      return;
    }

    hideAllControlCards();
  }
}

setLanguage("ar");
validatePageAccess();

window.addEventListener(
  "pageshow",
  function(event) {
    if (event.persisted) {
      validatePageAccess();
    }
  }
);
</script>
</body>
</html>
