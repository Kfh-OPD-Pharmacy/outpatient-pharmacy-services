<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>صيدلية العيادات الخارجية</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f3f4f6;margin:0;padding:16px;color:#168fb3}
.container{max-width:980px;margin:auto;background:#fff;padding:22px;border-radius:14px;box-shadow:0 10px 25px rgba(0,0,0,.1);min-height:calc(100vh - 32px)}
.top-bar{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:8px;direction:ltr}
.logo{width:120px;height:120px;object-fit:contain}
.official-header{width:fit-content;max-width:100%;text-align:right;transform:translateY(14px);padding-left:8px;border-left:4px solid #168fb3;direction:rtl}
.official-header h2,.official-header h3{margin:2px 0;font-size:13px;line-height:1.4;color:#168fb3}
hr{border:none;border-top:1px solid #e5e7eb;margin:14px 0}
.meta-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;direction:ltr}
.date-box{color:#168fb3;padding:4px 0;font-size:13px;font-weight:bold;text-align:center}
.language-chip{color:#168fb3;font-size:13px;font-weight:bold;padding:4px 0;white-space:nowrap;background:transparent;border:0;cursor:pointer;font-family:inherit}
.title-row{display:flex;align-items:center;justify-content:center;gap:10px;margin:20px 0 24px;direction:rtl}
.back-button{width:36px;height:36px;border:0;background:transparent;color:#168fb3;font-size:32px;line-height:1;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;transition:.15s ease}
.back-button:hover{color:#0f7592;transform:translateX(-2px)}
.page-title{text-align:center;font-size:24px;font-weight:bold;margin:0;color:#168fb3}
.portal-grid{display:grid;grid-template-columns:1fr;gap:12px;max-width:270px;margin:0 auto}
.portal-card{height:108px;background:#168fb3;border:1px solid #168fb3;border-radius:8px;padding:12px;text-decoration:none;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;text-align:center;transition:.15s ease}
.portal-card:hover{border-color:#0f7592;transform:translateY(-1px);box-shadow:0 8px 18px rgba(22,143,179,.28);filter:brightness(1.05)}
.card-title{font-size:15px;font-weight:bold;color:#fff;margin:0;line-height:1.5}
.card-icon{width:30px;height:30px;border-radius:8px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:17px}

.access-denied{
  display:none;
  max-width:420px;
  margin:18px auto 0;
  padding:12px 14px;
  border:1px solid #e5e7eb;
  border-radius:8px;
  background:#f8fafc;
  color:#475569;
  text-align:center;
  font-size:13px;
  line-height:1.6
}
@media (max-width:700px){
body{padding:10px;background:#fff}
.container{padding:14px;border-radius:0;box-shadow:none;min-height:100vh}
.logo{width:84px;height:84px}
.official-header{transform:translateY(10px)}
.official-header h2,.official-header h3{font-size:12px}
.page-title{font-size:20px}
.title-row{margin:18px 0 22px}
}


/* PHASE C: unified portal design system */
@media screen{
  body{
    background:#f3f4f6;
  }

  .container,
  .employee-shell{
    max-width:980px;
    margin:auto;
    background:#fff;
    padding:22px;
    border-radius:14px;
    box-shadow:0 10px 25px rgba(0,0,0,.1);
  }

  .logo,
  .official-logo{
    width:120px;
    height:120px;
    object-fit:contain;
  }

  .official-header h2,
  .official-header h3{
    margin:2px 0;
    color:#168fb3;
    font-size:13px;
    line-height:1.4;
  }

  hr,
  .official-divider{
    border-top-color:#e5e7eb;
    margin:14px 0;
  }

  .page-title,
  .employee-page-title{
    color:#168fb3;
    font-size:23px;
    font-weight:bold;
    line-height:1.25;
    margin:18px 0 12px;
    text-align:center;
  }

  .title-row{
    margin:18px 0 12px;
  }

  .panel,
  .toolbar,
  .empty-box,
  .order-panel,
  .size-row,
  .result-card,
  .upload-box,
  .users-form,
  .upload-standalone,
  .employee-toolbar,
  .upload-toolbar,
  .supervisor-panel,
  .user-summary-panel,
  .filter-panel,
  .filters-panel,
  .summary-card,
  .stat-card{
    background:#fff;
    border:1px solid #e5e7eb;
    border-radius:10px;
    box-shadow:0 4px 10px rgba(0,0,0,.04);
  }

  .portal-card,
  .service-card,
  .control-card,
  .pharmacy-card,
  .card-link{
    border-radius:10px;
    box-shadow:0 4px 10px rgba(0,0,0,.04);
  }

  input,
  select,
  textarea{
    min-height:40px;
    padding:8px 12px;
    border:1px solid #cbd5e1;
    border-radius:8px;
    font-size:14px;
    font-family:inherit;
    box-sizing:border-box;
  }

  input:focus,
  select:focus,
  textarea:focus{
    border-color:#168fb3;
    box-shadow:0 0 0 2px rgba(22,143,179,.12);
    outline:none;
  }

  .primary-btn,
  .secondary-btn,
  .action-btn,
  .ghost-btn,
  button[type="submit"]{
    min-height:40px;
    border-radius:8px;
    font-size:14px;
    font-weight:bold;
  }

  .actions,
  .form-actions,
  .login-actions,
  .card-actions,
  .row-actions,
  .scan-actions{
    gap:10px;
  }

  .table-wrap,
  .dashboard-table-wrap,
  .orders-table-wrap{
    overflow-x:auto;
    border-radius:10px;
  }

  table{
    border-collapse:collapse;
  }

  th{
    background:#168fb3;
    color:#fff;
    font-weight:bold;
  }

  th,
  td{
    border-color:#e5e7eb;
  }

  @media (max-width:700px){
    body{
      padding:10px;
      background:#fff;
    }

    .container,
    .employee-shell{
      padding:14px;
      border-radius:0;
      box-shadow:none;
    }

    .logo,
    .official-logo{
      width:84px;
      height:84px;
    }

    .official-header h2,
    .official-header h3{
      font-size:12px;
    }

    .page-title,
    .employee-page-title{
      font-size:20px;
      margin:16px 0 12px;
    }

    input,
    select,
    textarea{
      width:100%;
      font-size:13px;
    }
  }
}


/* Unified portal top-row session controls */
.meta-row{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);
  align-items:center;
  gap:12px;
  direction:ltr
}

.meta-row .date-box{
  justify-self:start
}

.meta-row .language-chip{
  justify-self:end
}

.meta-row .employee-toolbar{
  grid-column:2;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  margin:0;
  padding:0;
  direction:rtl;
  color:#168fb3
}

.meta-row .employee-name{
  white-space:nowrap;
  font-size:18px;
  line-height:1;
  font-weight:bold;
  color:#168fb3
}

.meta-row .portal-back-button,
.meta-row .logout-icon{
  width:34px;
  height:34px;
  margin:0;
  padding:0;
  border:0;
  background:transparent;
  color:#168fb3;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  flex:0 0 auto;
  font-family:Arial,sans-serif
}

.meta-row .portal-back-button{
  font-size:28px;
  line-height:1;
  text-decoration:none
}

.meta-row .portal-back-button:hover{
  color:#0f7592;
  transform:translateX(-1px)
}

.meta-row .logout-icon:hover{
  color:#0f7592;
  transform:scale(1.06)
}

.meta-row .power-svg{
  width:30px;
  height:30px;
  display:block;
  fill:none;
  stroke:currentColor;
  stroke-width:2.35;
  stroke-linecap:round;
  stroke-linejoin:round
}

@media (max-width:700px){
  .meta-row{
    grid-template-columns:minmax(54px,1fr) auto minmax(54px,1fr);
    gap:6px
  }

  .meta-row .employee-toolbar{
    gap:6px
  }

  .meta-row .employee-name{
    max-width:130px;
    overflow:hidden;
    text-overflow:ellipsis;
    font-size:15px
  }

  .meta-row .portal-back-button,
  .meta-row .logout-icon{
    width:30px;
    height:30px
  }

  .meta-row .power-svg{
    width:25px;
    height:25px
  }

  .meta-row .date-box,
  .meta-row .language-chip{
    font-size:11px
  }
}

</style>
</head>
<body>
<div class="container">
  <div class="top-bar">
    <img class="logo" src="logo.png" alt="Logo">
    <div class="official-header">
      <h2 id="officialLine1">تجمع المدينة المنورة الصحي</h2>
      <h3 id="officialLine2">مستشفى الملك فهد بالمدينة المنورة</h3>
      <h3 id="officialLine3">إدارة الرعاية الصيدلانية</h3>
    </div>
  </div>
  <hr>
  <div class="meta-row">
    <div class="date-box" id="dateBox"></div>

    <div class="employee-toolbar">
      <a
        class="portal-back-button"
        href="index.html"
        title="رجوع"
        aria-label="رجوع">↩</a>

      <span
        class="employee-name"
        id="employeeName"></span>

      <button
        type="button"
        class="logout-icon"
        id="logoutBtn"
        onclick="logoutPortal()"
        title="خروج"
        aria-label="خروج">
        <svg
          class="power-svg"
          viewBox="0 0 24 24"
          aria-hidden="true">
          <path d="M12 3v9"></path>
          <path d="M7.1 6.8a8 8 0 1 0 9.8 0"></path>
        </svg>
      </button>
    </div>

    <button type="button" class="language-chip" id="languageToggle" onclick="toggleLanguage()">🌐 ع | E</button>
  </div>
  <div class="title-row">
    <h1 class="page-title" id="pageTitle">صيدلية العيادات الخارجية</h1>
  </div>
  <div class="portal-grid">
    <a class="portal-card" id="mailCard" href="prescriptions/index.html" style="display:none">
      <div class="card-icon">✉</div>
      <p class="card-title" id="mailTitle">البريد الدوائي</p>
    </a>
    <a class="portal-card" id="appointmentCard" href="medication/portal.html" style="display:none">
      <div class="card-icon">💊</div>
      <p class="card-title" id="monthlyTitle">صرف الأدوية الشهرية بموعد</p>
    </a>
  </div>
  <div id="accessDenied" class="access-denied"></div>
</div>
<script>
const UNIFIED_API_URL =
  "https://script.google.com/macros/s/AKfycbxdYdIiVRYwqXYj7TIg-vPrg1hCGiJOnfusGEXF6ughJdUNEFayU3g5HyWFY9u0SO-U/exec";

let currentLang = "ar";

const text = {
  ar: {
    title: "صيدلية العيادات الخارجية",
    officialLine1: "تجمع المدينة المنورة الصحي",
    officialLine2: "مستشفى الملك فهد بالمدينة المنورة",
    officialLine3: "إدارة الرعاية الصيدلانية",
    mailTitle: "البريد الدوائي",
    monthlyTitle: "صرف الأدوية الشهرية بموعد",
    accessDenied: "ليس لديك صلاحية للدخول إلى صيدلية العيادات الخارجية."
  },
  en: {
    title: "Outpatient Pharmacy",
    officialLine1: "Madinah Health Cluster",
    officialLine2: "King Fahad Hospital - Madinah",
    officialLine3: "Pharmaceutical Care Administration",
    mailTitle: "Mail Pharmacy",
    monthlyTitle: "Monthly Medication Pickup by Appointment",
    accessDenied: "You do not have access to the outpatient pharmacy."
  }
};

function setLanguage(lang) {
  currentLang = lang;
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.title = text[lang].title;

  ["officialLine1","officialLine2","officialLine3","mailTitle","monthlyTitle"].forEach(function(id) {
    document.getElementById(id).innerText = text[lang][id];
  });

  document.getElementById("pageTitle").innerText = text[lang].title;

  const denied = document.getElementById("accessDenied");
  if (denied) {
    denied.innerText = text[lang].accessDenied;
  }

  renderDate();
}

function toggleLanguage() {
  setLanguage(currentLang === "ar" ? "en" : "ar");
}

function renderDate() {
  const now = new Date();
  const date = new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Riyadh" }).format(now);
  const dayName = new Intl.DateTimeFormat(currentLang === "ar" ? "ar-SA" : "en-US", {
    timeZone: "Asia/Riyadh",
    weekday: "long"
  }).format(now);

  document.getElementById("dateBox").innerText = `${dayName} - ${date}`;
}

async function unifiedApi(payload) {
  const response = await fetch(
    UNIFIED_API_URL,
    {
      method: "POST",
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },
      body: JSON.stringify(payload)
    }
  );

  return response.json();
}

function clearPortalSession() {
  sessionStorage.removeItem("unifiedPortalUsername");
  sessionStorage.removeItem("unifiedPortalSessionToken");
  sessionStorage.removeItem("unifiedPortalUser");
}

function hideAllOutpatientCards() {
  document.getElementById("mailCard").style.display = "none";
  document.getElementById("appointmentCard").style.display = "none";

  const denied = document.getElementById("accessDenied");
  if (denied) {
    denied.style.display = "none";
  }
}

function setEmployeeName(user) {
  const employeeName = document.getElementById("employeeName");
  if (!employeeName) {
    return;
  }

  employeeName.innerText =
    (user && (user.name || user.username)) || "";
}

function clearEmployeeName() {
  const employeeName = document.getElementById("employeeName");
  if (employeeName) {
    employeeName.innerText = "";
  }
}

async function logoutPortal() {
  const sessionToken =
    sessionStorage.getItem("unifiedPortalSessionToken") || "";

  if (sessionToken) {
    try {
      await unifiedApi({
        action: "revokeSession",
        sessionToken: sessionToken
      });
    } catch (error) {}
  }

  clearPortalSession();
  hideAllOutpatientCards();
  clearEmployeeName();

  window.location.replace("index.html");
}

function denyAndReturnHome() {
  hideAllOutpatientCards();
  clearEmployeeName();

  window.location.replace("index.html");
}

function renderAllowedServices(user) {
  const mailAllowed = Boolean(
    user &&
    (
      user.opdMailRxAccess ||
      user.opdMailDailyListAccess ||
      user.opdMailIndicatorAccess
    )
  );

  const appointmentAllowed = Boolean(
    user &&
    (
      user.opdAppointmentManageAccess ||
      user.opdAppointmentIndicatorAccess
    )
  );

  if (!mailAllowed && !appointmentAllowed) {
    denyAndReturnHome();
    return;
  }

  document.getElementById("mailCard").style.display =
    mailAllowed ? "flex" : "none";

  document.getElementById("appointmentCard").style.display =
    appointmentAllowed ? "flex" : "none";

  document.getElementById("accessDenied").style.display = "none";
}

async function validatePageAccess() {
  const sessionToken =
    sessionStorage.getItem("unifiedPortalSessionToken") || "";

  if (!sessionToken) {
    clearPortalSession();
    hideAllOutpatientCards();
    clearEmployeeName();

    window.location.replace("index.html");
    return;
  }

  let cachedUser = null;
  let cachedUserRendered = false;

  const cachedUserText =
    sessionStorage.getItem("unifiedPortalUser") || "";

  if (cachedUserText) {
    try {
      cachedUser =
        JSON.parse(cachedUserText);

      if (
        cachedUser &&
        typeof cachedUser === "object"
      ) {
        const cachedMailAllowed = Boolean(
          cachedUser.opdMailRxAccess ||
          cachedUser.opdMailDailyListAccess ||
          cachedUser.opdMailIndicatorAccess
        );

        const cachedAppointmentAllowed = Boolean(
          cachedUser.opdAppointmentManageAccess ||
          cachedUser.opdAppointmentIndicatorAccess
        );

        if (
          cachedMailAllowed ||
          cachedAppointmentAllowed
        ) {
          setEmployeeName(cachedUser);
          renderAllowedServices(cachedUser);
          cachedUserRendered = true;
        }
      }
    } catch (error) {
      cachedUser = null;
    }
  }

  try {
    const result = await unifiedApi({
      action: "validateSession",
      sessionToken: sessionToken,
      service: ""
    });

    if (
      !result.success ||
      !result.user ||
      result.user.active === false
    ) {
      clearPortalSession();
      hideAllOutpatientCards();
      clearEmployeeName();

      window.location.replace("index.html");
      return;
    }

    sessionStorage.setItem(
      "unifiedPortalUser",
      JSON.stringify(result.user)
    );

    sessionStorage.setItem(
      "unifiedPortalUsername",
      result.user.username || ""
    );

    setEmployeeName(result.user);
    renderAllowedServices(result.user);

  } catch (error) {
    if (cachedUserRendered) {
      return;
    }

    hideAllOutpatientCards();
    clearEmployeeName();
  }
}

window.addEventListener(
  "pageshow",
  function() {
    const sessionToken =
      sessionStorage.getItem("unifiedPortalSessionToken") || "";

    if (sessionToken) {
      return;
    }

    hideAllOutpatientCards();
    clearEmployeeName();

    const denied = document.getElementById("accessDenied");
    if (denied) {
      denied.style.display = "none";
    }

    window.location.replace("index.html");
  }
);

setLanguage("ar");
validatePageAccess();
</script>
</body>
</html>
