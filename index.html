<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بوابة خدمات الرعاية الصيدلانية</title>
<meta property="og:title" content="بوابة خدمات الرعاية الصيدلانية">
<meta property="og:description" content="بوابة موحدة لتقديم الخدمات الصيدلانية.">
<meta name="twitter:title" content="بوابة خدمات الرعاية الصيدلانية">
<meta name="twitter:description" content="بوابة موحدة لتقديم الخدمات الصيدلانية.">
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f3f4f6;margin:0;padding:16px;color:#168fb3}
.container{max-width:980px;margin:auto;background:#fff;padding:22px;border-radius:14px;box-shadow:0 10px 25px rgba(0,0,0,.1);min-height:calc(100vh - 32px)}
.top-bar{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:8px;direction:ltr}
.logo{width:120px;height:120px;object-fit:contain}
.official-header{width:fit-content;max-width:100%;text-align:right;transform:translateY(14px);padding-left:8px;border-left:4px solid #168fb3;direction:rtl}
.official-header h2,.official-header h3{margin:2px 0;font-size:13px;line-height:1.4;color:#168fb3}
hr{border:none;border-top:1px solid #e5e7eb;margin:14px 0}
.meta-row{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);
  align-items:center;
  gap:12px;
  margin-bottom:14px;
  direction:ltr
}
.date-box{
  grid-column:1;
  justify-self:start;
  color:#168fb3;
  padding:4px 0;
  font-size:13px;
  font-weight:bold;
  text-align:center
}
.language-chip{
  grid-column:3;
  justify-self:end;
  color:#168fb3;
  font-size:13px;
  font-weight:bold;
  padding:4px 0;
  white-space:nowrap;
  background:transparent;
  border:0;
  cursor:pointer;
  font-family:inherit
}
.page-title{text-align:center;font-size:24px;font-weight:bold;margin:20px 0 10px;color:#168fb3}
.subtitle{text-align:center;color:#334155;font-size:15px;line-height:1.7;margin:0 auto 24px;max-width:620px}
.portal-grid{display:grid;grid-template-columns:repeat(2,minmax(0,240px));justify-content:center;gap:16px;max-width:520px;margin:0 auto}
.portal-card{height:116px;background:#168fb3;border:1px solid #168fb3;border-radius:10px;padding:14px;text-decoration:none;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;transition:.15s ease;box-shadow:0 4px 10px rgba(0,0,0,.04)}
.portal-card:hover{border-color:#0f7592;transform:translateY(-2px);box-shadow:0 9px 20px rgba(22,143,179,.24);filter:brightness(1.04)}
.card-title{font-size:16px;font-weight:bold;color:#fff;margin:0;line-height:1.5}
.card-desc{font-size:12px;color:rgba(255,255,255,.86);line-height:1.55;margin:0}
.card-icon{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.2);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;flex:0 0 auto}

.login-card{
  width:100%;
  max-width:420px;
  margin:18px auto 0;
  padding:22px;
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:14px;
  box-shadow:0 8px 20px rgba(0,0,0,.08)
}
.login-card label{
  display:block;
  margin:0 0 6px;
  color:#168fb3;
  font-size:14px;
  font-weight:bold
}
.login-card input{
  width:100%;
  height:44px;
  margin:0 0 12px;
  padding:8px 12px;
  border:1px solid #cbd5e1;
  border-radius:8px;
  background:#fff;
  color:#111827;
  font-size:14px;
  font-family:inherit
}
.login-card input:focus{
  border-color:#168fb3;
  box-shadow:0 0 0 2px rgba(22,143,179,.12);
  outline:none
}
.login-actions{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px
}
.login-icon-btn{
  width:44px;
  height:44px;
  min-height:44px;
  padding:0;
  border-radius:8px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  font-family:inherit
}
.login-icon-btn.primary{
  border:0;
  background:#168fb3;
  color:#fff
}
.login-icon-btn.secondary{
  border:1px solid #168fb3;
  background:#fff;
  color:#168fb3
}
.login-icon-btn:hover{
  transform:translateY(-1px)
}
.login-icon-btn:disabled{
  background:#94a3b8;
  border-color:#94a3b8;
  color:#fff;
  cursor:not-allowed;
  transform:none
}
.login-action-svg{
  width:22px;
  height:22px;
  display:block;
  fill:none;
  stroke:currentColor;
  stroke-width:2.2;
  stroke-linecap:round;
  stroke-linejoin:round
}
.pin-change-panel{
  display:none;
  margin-top:14px;
  padding-top:14px;
  border-top:1px solid #e5e7eb
}
.pin-change-panel.visible{
  display:block
}
.pin-change-actions{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px
}
.pin-change-btn{
  min-height:40px;
  padding:8px 16px;
  border:0;
  border-radius:8px;
  background:#168fb3;
  color:#fff;
  font-size:13px;
  font-weight:bold;
  cursor:pointer
}
.pin-change-icon{
  width:34px;
  height:34px;
  min-height:34px;
  padding:0;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  font-size:18px
}
.pin-change-btn:disabled{
  background:#94a3b8;
  cursor:not-allowed
}
.pin-change-result{
  display:none;
  margin-top:10px;
  padding:9px 10px;
  border-radius:8px;
  text-align:center;
  font-size:13px;
  line-height:1.5
}
.pin-change-result.error{
  display:block;
  background:#fef2f2;
  color:#991b1b
}
.primary-btn{
  min-height:44px;
  padding:9px 18px;
  border:0;
  border-radius:8px;
  background:#168fb3;
  color:#fff;
  font-size:14px;
  font-weight:bold;
  cursor:pointer
}
.primary-btn:disabled{
  background:#94a3b8;
  cursor:not-allowed
}
.login-result{
  display:none;
  margin-top:12px;
  padding:10px 12px;
  border-radius:8px;
  text-align:center;
  font-size:13px;
  line-height:1.5
}
.login-result.error{
  display:block;
  background:#fef2f2;
  color:#991b1b
}
.login-result.success{
  display:block;
  background:#ecfdf5;
  color:#065f46
}
.portal-session{
  display:flex;
  align-items:center;
  justify-content:center;
  box-sizing:border-box;
  width:246px;
  max-width:calc(100vw - 40px);
  height:42px;
  gap:6px;
  padding:4px 6px;
  margin:0;
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:10px;
  box-shadow:0 2px 6px rgba(0,0,0,.06);
  color:#168fb3;
  direction:ltr
}
.portal-user-group{display:flex;align-items:center;justify-content:center;gap:8px;grid-column:2;min-width:0;direction:ltr}
.portal-user-group .portal-session{flex:0 1 auto}
.portal-back-btn,.logout-btn{width:30px;height:30px;min-height:0;padding:0;margin:0;border:0;background:transparent;color:#168fb3;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.portal-back-btn{font-size:22px}
.portal-user-name{flex:1 1 auto;max-width:calc(100% - 60px);overflow:visible;text-overflow:clip;white-space:nowrap}
.portal-pin-outside{width:34px;height:34px;min-height:34px;padding:0;border:1px solid #e5e7eb;border-radius:50%;background:#fff;color:#168fb3;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto;font-size:18px}
.portal-user-name{
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-family:Arial,sans-serif;
  font-size:15px;
  font-weight:bold;
  line-height:1.2;
  text-align:center;
  color:#168fb3
}
.logout-btn{
  width:30px;
  height:30px;
  min-height:0;
  padding:0;
  margin:0;
  border:0;
  background:transparent;
  color:#168fb3;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  flex:0 0 auto
}
.power-svg{
  width:25px;
  height:25px;
  display:block;
  fill:none;
  stroke:currentColor;
  stroke-width:2.35;
  stroke-linecap:round;
  stroke-linejoin:round
}
.no-access{
  display:none;
  max-width:620px;
  margin:14px auto 0;
  padding:12px;
  border:1px solid #e5e7eb;
  border-radius:8px;
  background:#f8fafc;
  color:#475569;
  text-align:center;
  font-size:13px
}
@media (max-width:760px){
.meta-row{
  grid-template-columns:minmax(70px,1fr) minmax(150px,246px) minmax(54px,1fr);
  gap:8px
}
  .portal-session{
  width:100%;
  max-width:246px
}
.portal-user-name{
  font-size:14px
}
body{padding:10px;background:#fff}
.container{padding:14px;border-radius:0;box-shadow:none;min-height:100vh}
.logo{width:84px;height:84px}
.official-header{transform:translateY(10px)}
.official-header h2,.official-header h3{font-size:12px}
.page-title{font-size:20px;margin-top:18px}
.subtitle{font-size:13px;margin-bottom:20px}
.portal-grid{grid-template-columns:1fr;max-width:300px;gap:12px}
.portal-card{height:104px;padding:12px}
.card-title{font-size:15px}
.card-desc{font-size:12px}
.card-icon{width:30px;height:30px;font-size:17px}
.login-card{max-width:320px;padding:16px}
}


/* PHASE C: unified portal design system */
@media screen{
  body{
    background:#f3f4f6;
  }
  .portal-user-group{gap:5px;max-width:calc(100vw - 20px)}
  .portal-session{width:min(246px,calc(100vw - 70px))}
  .portal-pin-outside{width:32px;height:32px;min-height:32px}

  .container,
  .employee-shell{
    max-width:980px;
    margin:auto;
    background:#fff;
    padding:22px;
    border-radius:14px;
    box-shadow:0 10px 25px rgba(0,0,0,.1);
  }

  .logo,
  .official-logo{
    width:120px;
    height:120px;
    object-fit:contain;
  }

  .official-header h2,
  .official-header h3{
    margin:2px 0;
    color:#168fb3;
    font-size:13px;
    line-height:1.4;
  }

  hr,
  .official-divider{
    border-top-color:#e5e7eb;
    margin:14px 0;
  }

  .page-title,
  .employee-page-title{
    color:#168fb3;
    font-size:23px;
    font-weight:bold;
    line-height:1.25;
    margin:18px 0 12px;
    text-align:center;
  }

  .title-row{
    margin:18px 0 12px;
  }

  .panel,
  .toolbar,
  .empty-box,
  .order-panel,
  .size-row,
  .result-card,
  .upload-box,
  .users-form,
  .upload-standalone,
  .employee-toolbar,
  .upload-toolbar,
  .supervisor-panel,
  .user-summary-panel,
  .filter-panel,
  .filters-panel,
  .summary-card,
  .stat-card{
    background:#fff;
    border:1px solid #e5e7eb;
    border-radius:10px;
    box-shadow:0 4px 10px rgba(0,0,0,.04);
  }

  .portal-card,
  .service-card,
  .control-card,
  .pharmacy-card,
  .card-link{
    border-radius:10px;
    box-shadow:0 4px 10px rgba(0,0,0,.04);
  }

  input,
  select,
  textarea{
    min-height:40px;
    padding:8px 12px;
    border:1px solid #cbd5e1;
    border-radius:8px;
    font-size:14px;
    font-family:inherit;
    box-sizing:border-box;
  }

  input:focus,
  select:focus,
  textarea:focus{
    border-color:#168fb3;
    box-shadow:0 0 0 2px rgba(22,143,179,.12);
    outline:none;
  }

  .primary-btn,
  .secondary-btn,
  .action-btn,
  .ghost-btn,
  button[type="submit"]{
    min-height:40px;
    border-radius:8px;
    font-size:14px;
    font-weight:bold;
  }

  .actions,
  .form-actions,
  .login-actions,
  .card-actions,
  .row-actions,
  .scan-actions{
    gap:10px;
  }

  .table-wrap,
  .dashboard-table-wrap,
  .orders-table-wrap{
    overflow-x:auto;
    border-radius:10px;
  }

  table{
    border-collapse:collapse;
  }

  th{
    background:#168fb3;
    color:#fff;
    font-weight:bold;
  }

  th,
  td{
    border-color:#e5e7eb;
  }

  @media (max-width:700px){
    body{
      padding:10px;
      background:#fff;
    }

    .container,
    .employee-shell{
      padding:14px;
      border-radius:0;
      box-shadow:none;
    }

    .logo,
    .official-logo{
      width:84px;
      height:84px;
    }

    .official-header h2,
    .official-header h3{
      font-size:12px;
    }

    .page-title,
    .employee-page-title{
      font-size:20px;
      margin:16px 0 12px;
    }

    input,
    select,
    textarea{
      width:100%;
      font-size:13px;
    }
  }
}

</style>
<style id="compact-user-toolbar-style">.portal-user-group{gap:3px;max-width:100%;min-width:0}.portal-session{height:32px;width:220px;max-width:calc(100vw - 54px);gap:4px;padding:2px 4px;border-radius:8px}.portal-user-name{font-size:13px;line-height:1.1;max-width:calc(100% - 56px)}.portal-back-btn,.portal-session .logout-btn{width:27px;height:27px}.portal-back-btn{font-size:19px}.portal-pin-outside,.toolbar-pin-button{width:30px;height:30px;min-width:30px;min-height:30px;font-size:16px;border-radius:50%}.employee-meta-tools{height:36px;gap:7px;direction:ltr}.employee-meta-tools .back-button,.employee-meta-tools .logout-icon{width:28px;height:28px}.employee-meta-tools .employee-name{font-size:13px;max-width:min(42vw,240px)}.employee-toolbar,.kidney-user-toolbar{min-height:32px;height:32px;gap:5px;padding:2px 5px;direction:ltr}.employee-toolbar .portal-back-button,.employee-toolbar .back-button,.kidney-user-toolbar .back-button{order:3}.employee-toolbar .portal-back-button,.employee-toolbar .back-button,.kidney-user-toolbar .back-button,.employee-toolbar .logout-icon,.kidney-user-toolbar .logout-icon{width:28px;height:28px}.employee-toolbar .logout-icon,.kidney-user-toolbar .logout-icon{order:1}.employee-toolbar .employee-name,.employee-toolbar strong,.kidney-user-toolbar .employee-name{order:2;font-size:13px;max-width:min(42vw,240px)}@media(max-width:430px){.portal-user-group{gap:3px}.portal-session{width:calc(100vw - 56px);max-width:calc(100vw - 56px);height:34px;padding:2px 3px}.portal-user-name{font-size:12px;max-width:calc(100% - 52px)}.portal-back-btn,.portal-session .logout-btn{width:25px;height:25px}.portal-pin-outside,.toolbar-pin-button{width:28px;height:28px;min-width:28px;min-height:28px;font-size:15px}.employee-meta-tools{height:34px;gap:5px}.employee-meta-tools .employee-name{font-size:12px;max-width:calc(100vw - 120px)}.employee-toolbar,.kidney-user-toolbar{gap:4px;padding:2px 4px;min-height:32px;height:32px}.employee-toolbar .employee-name,.employee-toolbar strong,.kidney-user-toolbar .employee-name{font-size:12px;max-width:calc(100vw - 120px)}}@media(max-width:340px){.portal-user-name{font-size:11px}.employee-meta-tools .employee-name,.employee-toolbar .employee-name,.employee-toolbar strong,.kidney-user-toolbar .employee-name{font-size:11px;max-width:calc(100vw - 112px)}}</style></head>
<body>
<div class="container">
  <div class="top-bar">
    <img class="logo" src="logo.png" alt="Logo">
    <div class="official-header">
      <h2 id="officialLine1">تجمع المدينة المنورة الصحي</h2>
      <h3 id="officialLine2">مستشفى الملك فهد بالمدينة المنورة</h3>
      <h3 id="officialLine3">إدارة الرعاية الصيدلانية</h3>
    </div>
  </div>

  <hr>

  <div class="meta-row">
    <div class="date-box" id="dateBox"></div>

    <div class="portal-user-group" id="portalUserGroup" style="display:none">
      <button type="button" class="portal-pin-outside" id="changePinBtn" onclick="togglePinChangePanel()" title="Change PIN" aria-label="Change PIN">🔑</button>
      <div class="portal-session" id="portalSession">
      <button
        type="button"
        class="logout-btn"
        id="logoutBtn"
        onclick="logoutPortal()"
        title="Logout"
        aria-label="Logout">
        <svg
          class="power-svg"
          viewBox="0 0 24 24"
          aria-hidden="true">
          <path d="M12 3v9"></path>
          <path d="M7.1 6.8a8 8 0 1 0 9.8 0"></path>
        </svg>
      </button>

      <span id="portalUserName" class="portal-user-name"></span>

      </div>
    </div>

    <button type="button" class="language-chip" id="languageToggle" onclick="toggleLanguage()">🌐 ع | E</button>
  </div>

  <h1 class="page-title" id="pageTitle">بوابة خدمات الرعاية الصيدلانية</h1>

  <div id="loginView" class="login-card">
    <label id="usernameLabel" for="portalUsername">اسم المستخدم</label>
    <input type="text" id="portalUsername" autocomplete="username">

    <label id="pinLabel" for="portalPin">PIN</label>
    <input type="password" id="portalPin" inputmode="numeric" autocomplete="current-password">

    <div class="login-actions">
      <button
        type="button"
        class="login-icon-btn primary"
        id="loginBtn"
        onclick="loginPortal()"
        title="Login"
        aria-label="Login">
        <svg class="login-action-svg" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M10 17l5-5-5-5"></path>
          <path d="M15 12H3"></path>
          <path d="M14 3h5a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-5"></path>
        </svg>
      </button>

    </div>

    <div id="loginResult" class="login-result"></div>
  </div>

  <div id="portalView" style="display:none">
    <div id="pinChangePanel" class="pin-change-panel" aria-hidden="true">
      <label id="currentPinLabel" for="currentPin">Current PIN</label>
      <input type="password" id="currentPin" inputmode="numeric" autocomplete="current-password">

      <label id="newPinLabel" for="newPin">New PIN</label>
      <input type="password" id="newPin" inputmode="numeric" autocomplete="new-password">

      <label id="confirmPinLabel" for="confirmPin">Confirm New PIN</label>
      <input type="password" id="confirmPin" inputmode="numeric" autocomplete="new-password">

      <div class="pin-change-actions">
        <button
          type="button"
          class="pin-change-btn"
          id="updatePinBtn"
          onclick="changePortalPin()">
          Update PIN
        </button>
      </div>

      <div id="pinChangeResult" class="pin-change-result"></div>
    </div>

    <div class="portal-grid">
      <a class="portal-card" id="outpatientCard" href="outpatient-pharmacy.html" onclick="navigateFresh(this.getAttribute('href')); return false;" style="display:none">
        <div class="card-icon">🏥</div>
        <p class="card-title" id="outpatientTitle">صيدلية العيادات الخارجية</p>
      </a>

      <a class="portal-card" id="diabetesCard" href="diabetes-center.html" onclick="navigateFresh(this.getAttribute('href')); return false;" style="display:none">
        <div class="card-icon">🩺</div>
        <p class="card-title" id="diabetesTitle">صيدلية مركز السكر</p>
      </a>

      <a class="portal-card" id="kidneyCard" href="expiry/kidney/index.html" onclick="navigateFresh(this.getAttribute('href')); return false;" style="display:none">
        <div class="card-icon">💠</div>
        <p class="card-title" id="kidneyTitle">صيدلية مركز الكلى</p>
      </a>

      <a class="portal-card" id="controlCard" href="control-panel.html" onclick="navigateFresh(this.getAttribute('href')); return false;" style="display:none">
        <div class="card-icon">⚙</div>
        <p class="card-title" id="controlTitle">لوحة التحكم</p>
      </a>
    </div>

    <div id="noAccessMessage" class="no-access"></div>
  </div>
</div>

<script>
const UNIFIED_API_URL =
  "https://script.google.com/macros/s/AKfycbzg9PCeoJQl0ifbng_aam6u5mTePD0872wqZ5ilZYqcFV9QypiyopulgPPyO3nqLpez/exec";

let currentLang = "en";

let portalUsername =
  sessionStorage.getItem(
    "unifiedPortalUsername"
  ) || "";

let portalSessionToken =
  sessionStorage.getItem(
    "unifiedPortalSessionToken"
  ) || "";

let currentUser = null;

const text = {
  ar: {
    title: "بوابة خدمات الرعاية الصيدلانية",
    officialLine1: "تجمع المدينة المنورة الصحي",
    officialLine2: "مستشفى الملك فهد بالمدينة المنورة",

function setLanguage(lang) {
  currentLang = lang;

  document.documentElement.lang =
    lang;

  document.documentElement.dir =
    lang === "ar"
      ? "rtl"
      : "ltr";

  document.title =
    text[lang].title;

  [
    "officialLine1",
    "officialLine2",
    "officialLine3",
    "subtitle",
    "outpatientTitle",
    "outpatientDesc",
    "diabetesTitle",
    "diabetesDesc",
    "kidneyTitle",
    "kidneyDesc",
    "controlTitle",
    "controlDesc"
  ].forEach(
    function(id) {
      const element =
        document.getElementById(id);

      if (element) {
        element.innerText =
          text[lang][id];
      }
    }
  );

  document.getElementById(
    "pageTitle"
  ).innerText =
    text[lang].title;

  document.getElementById(
    "usernameLabel"
  ).innerText =
    text[lang].username;

  const loginBtn =
    document.getElementById(
      "loginBtn"
    );

  loginBtn.title =
    text[lang].login;

  loginBtn.setAttribute(
    "aria-label",
    text[lang].login
  );

  const changePinBtn =
    document.getElementById(
      "changePinBtn"
    );

  changePinBtn.title =
    text[lang].changePin;

  changePinBtn.setAttribute(
    "aria-label",
    text[lang].changePin
  );

  document.getElementById("currentPinLabel").innerText =
    text[lang].currentPin;

  document.getElementById(
    "newPinLabel"
  ).innerText =
    text[lang].newPin;

  document.getElementById(
    "confirmPinLabel"
  ).innerText =
    text[lang].confirmPin;

  document.getElementById(
    "updatePinBtn"
  ).innerText =
    text[lang].updatePin;

  const logoutBtn =
    document.getElementById(
      "logoutBtn"
    );

  logoutBtn.title =
    text[lang].logout;

  logoutBtn.setAttribute(
    "aria-label",
    text[lang].logout
  );

  document.getElementById(
    "noAccessMessage"
  ).innerText =
    text[lang].noAccess;

  document.getElementById(
    "languageToggle"
  ).innerText =
    "🌐 ع | E";

  renderDate();
}


function toggleLanguage() {
  setLanguage(
    currentLang === "ar"
      ? "en"
      : "ar"
  );
}


function renderDate() {
  const now =
    new Date();

  const date =
    new Intl.DateTimeFormat(
      "en-CA",
      {
        timeZone:
          "Asia/Riyadh"
      }
    ).format(now);

  const dayName =
    new Intl.DateTimeFormat(
      currentLang === "ar"
        ? "ar-SA"
        : "en-US",
      {
        timeZone:
          "Asia/Riyadh",
        weekday:
          "long"
      }
    ).format(now);

  document.getElementById(
    "dateBox"
  ).innerText =
    `${dayName} - ${date}`;
}


async function unifiedApi(payload) {
  const response =
    await fetch(
      UNIFIED_API_URL,
      {
        method:
          "POST",

        headers: {
          "Content-Type":
            "text/plain;charset=utf-8"
        },

        body:
          JSON.stringify(payload)
      }
    );

  return response.json();
}


function showLoginResult(
  message,
  isSuccess
) {
  const result =
    document.getElementById(
      "loginResult"
    );

  if (!message) {
    result.className =
      "login-result";

    result.innerText =
      "";

    return;
  }

  result.className =
    isSuccess
      ? "login-result success"
      : "login-result error";

  result.innerText =
    message;
}


function navigateFresh(
  target,
  replaceHistory = false
) {
  const url =
    new URL(
      target,
      window.location.href
    );

  url.searchParams.set(
    "_r",
    Date.now().toString()
  );

  if (replaceHistory) {
    window.location.replace(
      url.toString()
    );
  } else {
    window.location.assign(
      url.toString()
    );
  }
}


function refreshCurrentPageFresh() {
  navigateFresh(
    window.location.pathname,
    true
  );
}


function showPinChangeResult(
  message,
  isError
) {
  const result =
    document.getElementById(
      "pinChangeResult"
    );

  if (!message) {
    result.className =
      "pin-change-result";

    result.removeAttribute(
      "style"
    );

    result.innerText =
      "";

    return;
  }

  result.className =
    isError
      ? "pin-change-result error"
      : "pin-change-result";

  result.style.display =
    "block";

  result.style.background =
    isError
      ? "#fef2f2"
      : "#ecfdf5";

  result.style.color =
    isError
      ? "#991b1b"
      : "#065f46";

  result.innerText =
    message;
}


function clearPinChangeFields() {
  [
    "currentPin",
    "newPin",
    "confirmPin"
  ].forEach(
    function(id) {
      document.getElementById(
        id
      ).value =
        "";
    }
  );
}


function closePinChangePanel() {
  const panel =
    document.getElementById(
      "pinChangePanel"
    );

  panel.classList.remove(
    "visible"
  );

  panel.setAttribute(
    "aria-hidden",
    "true"
  );

  clearPinChangeFields();
  showPinChangeResult(
    "",
    false
  );
}


function togglePinChangePanel() {
  if (!portalSessionToken || !portalUsername) {
    return;
  }

  const panel =
    document.getElementById(
      "pinChangePanel"
    );

  const willOpen =
    !panel.classList.contains(
      "visible"
    );

  if (!willOpen) {
    closePinChangePanel();
    return;
  }

  clearPinChangeFields();
  setPinChangeMode(Boolean(currentUser && currentUser.mustChangePin));
  showPinChangeResult(
    "",
    false
  );

  panel.classList.add(
    "visible"
  );

  panel.setAttribute(
    "aria-hidden",
    "false"
  );
}


async function changePortalPin() {
  const username =
    portalUsername.trim();

  if (!portalSessionToken || !username) {
    showPinChangeResult(
      text[currentLang].sessionExpired,
      true
    );
    return;
  }

  const currentPin =
    document.getElementById(
      "currentPin"
    ).value.trim();

  const newPin =
    document.getElementById(
      "newPin"
    ).value.trim();

  const confirmPin =
    document.getElementById(
      "confirmPin"
    ).value.trim();

  const limitedPinChange = Boolean(currentUser && currentUser.mustChangePin);

  if (
    !username ||
    (!limitedPinChange && !currentPin) ||
    !newPin ||
    !confirmPin
  ) {
    showPinChangeResult(
      text[currentLang].invalidCurrentPin,
      true
    );
    return;
  }

  if (
    newPin !==
    confirmPin
  ) {
    showPinChangeResult(
      text[currentLang].pinMismatch,
      true
    );
    return;
  }

  if (
    newPin.length < 4
  ) {
    showPinChangeResult(
      text[currentLang].pinTooShort,
      true
    );
    return;
  }

  const updateButton =
    document.getElementById(
      "updatePinBtn"
    );

  updateButton.disabled =
    true;

  showPinChangeResult(
    "",
    false
  );

  try {
    const pinPayload = {
      action: "changeLoginPin",
      username: username,
      newPin: newPin,
      sessionToken: portalSessionToken
    };
    if (!limitedPinChange) pinPayload.currentPin = currentPin;
    const result = await unifiedApi(pinPayload);

    if (
      !result ||
      result.success !== true
    ) {
      const code =
        result &&
        result.code
          ? result.code
          : "";

      let message =
        text[currentLang].invalidCurrentPin;

      if (
        code ===
        "PIN_TOO_SHORT"
      ) {
        message =
          text[currentLang].pinTooShort;
      } else if (
        code ===
        "NOT_FOUND"
      ) {
        message =
          text[currentLang].userNotFound;
      } else if (code === "TEMPORARY_PIN_EXPIRED") {
        message = text[currentLang].temporaryPinExpired;
      }

      showPinChangeResult(
        message,
        true
      );

      return;
    }

    clearPinChangeFields();

    closePinChangePanel();

    if (limitedPinChange) {
      clearPortalStorage();
      showLoginResult(text[currentLang].pinChanged, true);
      window.setTimeout(function() { showLoginView(); }, 2000);
    } else {
      showLoginResult(text[currentLang].pinChanged, true);
    }

  } catch (error) {
    showPinChangeResult(
      text[currentLang].networkError,
      true
    );

  } finally {
    updateButton.disabled =
      false;
  }
}


function clearPortalStorage() {
  sessionStorage.removeItem(
    "unifiedPortalUsername"
  );

  sessionStorage.removeItem(
    "unifiedPortalSessionToken"
  );

  sessionStorage.removeItem(
    "unifiedPortalUser"
  );

  portalUsername = "";
  portalSessionToken = "";
  currentUser = null;
}


function showLoginView() {
  document.getElementById(
    "portalView"
  ).style.display =
    "none";

  document.getElementById(
    "loginView"
  ).style.display =
    "block";

  document.getElementById(
    "portalUserGroup"
  ).style.display =
    "none";

  closePinChangePanel();
  hideAllPortalCards();
}


function showPortalView(user) {
  currentUser =
    user || null;

  document.getElementById(
    "loginView"
  ).style.display =
    "none";

  document.getElementById(
    "portalView"
  ).style.display =
    "block";

  document.getElementById(
    "portalUserGroup"
  ).style.display =
    "flex";

  document.getElementById(
    "portalUserName"
  ).innerText =
    (
      currentUser &&
      (
        currentUser.name ||
        currentUser.username
      )
    ) || portalUsername;

  renderPortalCards(
    currentUser
  );

  setPinChangeMode(Boolean(currentUser && currentUser.mustChangePin));

  if (currentUser && currentUser.mustChangePin === true) {
    hideAllPortalCards();
    setTimeout(function() {
      if (portalSessionToken && portalUsername) {
        const panel = document.getElementById("pinChangePanel");
        if (panel && !panel.classList.contains("visible")) togglePinChangePanel();
      }
    }, 0);
  }
}

function setPinChangeMode(required) {
  const label = document.getElementById("currentPinLabel");
  const input = document.getElementById("currentPin");
  if (label) label.style.display = required ? "none" : "";
  if (input) {
    input.style.display = required ? "none" : "";
    input.required = !required;
    if (required) input.value = "";
  }
}

function hideAllPortalCards() {
  [
    "outpatientCard",
    "diabetesCard",
    "kidneyCard",
    "controlCard"
  ].forEach(
    function(id) {
      document.getElementById(
        id
      ).style.display =
        "none";
    }
  );

  document.getElementById(
    "noAccessMessage"
  ).style.display =
    "none";
}


function hasAny(user, keys) {
  return keys.some(
    function(key) {
      return Boolean(
        user &&
        user[key]
      );
    }
  );
}


function renderPortalCards(user) {
  hideAllPortalCards();

  const outpatientAllowed =
    hasAny(
      user,
      [
        "opdMailRxAccess",
        "opdMailDailyListAccess",
        "opdMailIndicatorAccess",
        "opdAppointmentManageAccess",
        "opdAppointmentIndicatorAccess"
      ]
    );

  const diabetesAllowed =
    hasAny(
      user,
      [
        "diabetesMailRxAccess",
        "diabetesMailDailyListAccess",
        "diabetesMailIndicatorAccess",
        "diabetesAppointmentManageAccess",
        "diabetesAppointmentIndicatorAccess"
      ]
    );

  const kidneyAllowed =
    hasAny(
      user,
      [
        "kidneyExpiryRegisterAccess",
        "kidneyExpiryDashboardAccess",
        "kidneyOrderAccess",
        "kidneyLabelsAccess"
      ]
    );

  const controlAllowed =
    hasAny(
      user,
      [
        "userManagementAccess",
        "medicationManagementAccess"
      ]
    );

  document.getElementById(
    "outpatientCard"
  ).style.display =
    outpatientAllowed
      ? "flex"
      : "none";

  document.getElementById(
    "diabetesCard"
  ).style.display =
    diabetesAllowed
      ? "flex"
      : "none";

  document.getElementById(
    "kidneyCard"
  ).style.display =
    kidneyAllowed
      ? "flex"
      : "none";

  document.getElementById(
    "controlCard"
  ).style.display =
    controlAllowed
      ? "flex"
      : "none";

  const anyPortal =
    outpatientAllowed ||
    diabetesAllowed ||
    kidneyAllowed ||
    controlAllowed;

  document.getElementById(
    "noAccessMessage"
  ).style.display =
    anyPortal
      ? "none"
      : "block";
}


async function loginPortal() {
  const username =
    document.getElementById(
      "portalUsername"
    ).value.trim();

  const pin =
    document.getElementById(
      "portalPin"
    ).value.trim();

  if (
    !username ||
    !pin
  ) {
    showLoginResult(
      text[currentLang].invalidLogin
    );

    return;
  }

  const loginButton =
    document.getElementById(
      "loginBtn"
    );

  loginButton.disabled =
    true;

  showLoginResult("");

  try {
    const result =
      await unifiedApi({
        action:
          "portalLogin",
        username:
          username,
        pin:
          pin
      });

    if (
      !result.success ||
      !result.sessionToken ||
      !result.user
    ) {
      if (result && result.code === "TEMPORARY_PIN_EXPIRED") {
        showLoginResult(text[currentLang].temporaryPinExpired);
        return;
      }
      if (result && result.code === "AUTH_RATE_LIMITED") {
        showLoginResult(text[currentLang].authRateLimited);
        return;
      }
      showLoginResult(
        text[currentLang].invalidLogin
      );

      return;
    }

    portalUsername =
      result.user.username ||
      username;

    portalSessionToken =
      result.sessionToken;

    currentUser =
      result.user;

    sessionStorage.setItem(
      "unifiedPortalUsername",
      portalUsername
    );

    sessionStorage.setItem(
      "unifiedPortalSessionToken",
      portalSessionToken
    );

    sessionStorage.setItem(
      "unifiedPortalUser",
      JSON.stringify(currentUser)
    );

    document.getElementById(
      "portalPin"
    ).value =
      "";

    refreshCurrentPageFresh();

  } catch (error) {
    showLoginResult(
      text[currentLang].invalidLogin
    );

  } finally {
    loginButton.disabled =
      false;
  }
}


async function restorePortalSession() {
  portalSessionToken =
    sessionStorage.getItem(
      "unifiedPortalSessionToken"
    ) || "";

  if (!portalSessionToken) {
    showLoginView();
    return;
  }

  document.getElementById(
    "loginView"
  ).style.display =
    "none";

  let cachedUser = null;

  const cachedUserText =
    sessionStorage.getItem(
      "unifiedPortalUser"
    ) || "";

  if (cachedUserText) {
    try {
      cachedUser =
        JSON.parse(
          cachedUserText
        );

      if (
        cachedUser &&
        typeof cachedUser === "object"
      ) {
        currentUser =
          cachedUser;

        portalUsername =
          cachedUser.username ||
          portalUsername;

        showPortalView(
          cachedUser
        );
      }
    } catch (error) {
      cachedUser = null;
    }
  }

  try {
    const result =
      await unifiedApi({
        action:
          "validateSession",
        sessionToken:
          portalSessionToken,
        service:
          ""
      });

    if (
      !result.success ||
      !result.user ||
      result.user.active === false
    ) {
      clearPortalStorage();
      showLoginView();
      return;
    }

    currentUser =
      result.user;

    portalUsername =
      result.user.username ||
      portalUsername;

    sessionStorage.setItem(
      "unifiedPortalUsername",
      portalUsername
    );

    sessionStorage.setItem(
      "unifiedPortalUser",
      JSON.stringify(currentUser)
    );

    showPortalView(
      currentUser
    );

  } catch (error) {
    clearPortalStorage();
    showLoginView();
  }
}


async function logoutPortal() {
  const tokenToRevoke =
    portalSessionToken;

  if (tokenToRevoke) {
    try {
      await unifiedApi({
        action:
          "revokeSession",
        sessionToken:
          tokenToRevoke
      });
    } catch (error) {}
  }

  clearPortalStorage();

  document.getElementById(
    "portalPin"
  ).value =
    "";

  showLoginResult("");

  navigateFresh(
    window.location.pathname,
    true
  );
}


document.getElementById(
  "portalPin"
).addEventListener(
  "keydown",
  function(event) {
    if (event.key === "Enter") {
      loginPortal();
    }
  }
);

setLanguage("en");
restorePortalSession();

window.addEventListener(
  "pageshow",
  function(event) {
    if (event.persisted) {
      restorePortalSession();
    }
  }
);
</script>
